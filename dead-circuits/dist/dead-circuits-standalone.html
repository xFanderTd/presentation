        kb: [['Движение', K('A', 'D') + K('←', '→')], ['Прыжок / двойной', K('SPACE')], ['Кувырок', K('SHIFT') + K('L')], ['Основное оружие', K('J') + TX('ЛКМ')],
          ['Второе оружие / щит', K('K') + TX('ПКМ')], ['Навыки', K('Q') + K('E')], ['Аптечка', K('R')], ['Взаимодействие', K('F')],
          ['Лестница', K('W') + K('S')], ['Спрыгнуть вниз', K('S') + '+' + K('SPACE')], ['Удар о землю', TX('в воздухе') + K('S') + '+' + K('SPACE')], ['Карта', K('M') + K('TAB')], ['Пауза', K('ESC') + K('P')]],
        pad: [['Движение', TX('Л. стик') + TX('Крестовина')], ['Прыжок / двойной', K('A')], ['Кувырок', K('RB')], ['Основное оружие', K('X')],
          ['Второе оружие / щит', K('Y')], ['Навыки', K('LT') + K('RT')], ['Аптечка', K('LB')], ['Взаимодействие', K('B')],
          ['Лестница', K('↑') + K('↓')], ['Спрыгнуть вниз', K('↓') + '+' + K('A')], ['Удар о землю', TX('в воздухе') + K('↓') + '+' + K('A')], ['Карта', K('SELECT')], ['Пауза', K('START')]],
        touch: [['Движение', TX('джойстик слева')], ['Прыжок', TX('кнопка прыжка')], ['Кувырок', TX('кнопка кувырка')], ['Основное оружие', TX('большая кнопка')],
          ['Второе оружие', TX('кнопка над ней')], ['Навыки', TX('малые кнопки')], ['Аптечка', TX('зелёная кнопка')], ['Взаимодействие', TX('появляется у объекта')],
          ['Спрыгнуть вниз', TX('джойстик вниз + прыжок')], ['Удар о землю', TX('в воздухе: вниз + прыжок')], ['Карта', TX('миникарта')], ['Пауза', TX('кнопка II')]],
      };
      const NOTE = {
        kb: 'Кувырок даёт неуязвимость. Урон, полученный недавно, можно вернуть атаками (оранжевая часть полосы здоровья).',
        pad: 'Поддерживается стандартная раскладка Xbox / PlayStation. Кувырок даёт неуязвимость.',

    // ---------------------------------------------------------------- SETTINGS
    showSettings(group) {
      const S = G.settings;
      const el = mk(`<div class="scr dim enter"><div class="win cf">
        <div class="win-h"><div class="ttl cy">Настройки</div></div>
        <div class="set">
          <div class="row cf" data-nav data-focus data-slider="music"><span>Музыка</span><span class="slider"><span class="trk"><i></i><b></b></span><span class="val"></span></span></div>
          <div class="row cf" data-nav data-slider="sfx"><span>Звуки</span><span class="slider"><span class="trk"><i></i><b></b></span><span class="val"></span></span></div>
          <button class="row cf" data-nav data-toggle="shake"><span>Тряска экрана</span><span class="val"></span></button>
          <button class="row cf" data-nav data-toggle="scanlines"><span>Скан-линии</span><span class="val"></span></button>
          <button class="row cf" data-nav data-a="fs"><span>Полный экран</span><span class="val">&gt;</span></button>
        </div>
        <div class="rowf"><button class="mbtn cf small" data-nav data-a="back">Назад</button></div></div><div class="hint"></div></div>`);
      const paintT = (b) => { const on = S[b.dataset.toggle] !== false; const v = b.querySelector('.val'); v.textContent = on ? 'ВКЛ' : 'ВЫКЛ'; v.classList.toggle('off', !on); };
      el.querySelectorAll('[data-slider]').forEach((r) => {
        this.paintSlider(r);
        const trk = r.querySelector('.trk');
        const setFrom = (e) => {
          const b = trk.getBoundingClientRect();
          G.settings[r.dataset.slider] = Math.round(G.clamp((e.clientX - b.left) / b.width, 0, 1) * 20) / 20;
          this.paintSlider(r); this.applySettings(true);
        };
        r.addEventListener('pointerdown', (e) => {
          const b = trk.getBoundingClientRect();
          if (e.clientX < b.left - 12 || e.clientX > b.right + 12) { this.adjustSlider(r, e.clientX < b.left ? -0.1 : 0.1); return; }
          try { r.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          r._drag = true; setFrom(e);
        });
        r.addEventListener('pointermove', (e) => { if (r._drag) setFrom(e); });
        const end = () => { if (r._drag && r.dataset.slider === 'sfx') sfx('uiMove', 0.6); r._drag = false; };
        r.addEventListener('pointerup', end); r.addEventListener('pointercancel', end);
      });
      el.querySelectorAll('[data-toggle]').forEach((b) => {
        paintT(b);
        b.onclick = () => { S[b.dataset.toggle] = S[b.dataset.toggle] === false; paintT(b); this.applySettings(true); };
      });
      const fs = el.querySelector('[data-a=fs]');
      const fsVal = fs.querySelector('.val');
      const fsPaint = () => { fsVal.textContent = document.fullscreenElement || document.webkitFullscreenElement ? 'ВКЛ' : 'ВЫКЛ'; };
      fsPaint();
      fs.onclick = () => {
        const ok = this.toggleFullscreen();
        if (!ok) { fsVal.textContent = 'НЕДОСТУПНО'; fsVal.classList.add('off'); return; }
        setTimeout(fsPaint, 400);
      };
      const sc = { el, kind: 'settings', group, onBack: () => this.pop(sc) };
      el.querySelector('[data-a=back]').onclick = () => this.pop(sc);
      return this.push(sc);
    },

      this.closeKind('pause');
      this.closeKind('map');
      const p = G.game && G.game.player;
      const g = G.game || {};
      const run = G.RUN && G.RUN[g.stage];
      const biome = run && G.BIOMES && G.BIOMES[run.biome];

      const el = mk(`<div class="scr dim enter"><div class="pause-grid">
        <div class="pz-left"><div class="ttl cy glitch" data-text="ПАУЗА">ПАУЗА</div>

          <button class="mbtn cf" data-nav data-a="settings">Настройки</button>

        }

      } else build.hidden = true;
      const sc = { el, kind: 'pause', onBack: () => onResume() };

      el.querySelector('[data-a=controls]').onclick = () => this.showControls('pause');
      const q = el.querySelector('[data-a=quit]');

        this.hideAll(); onQuit();
      };

    },
    hidePause() { this.closeKind('pause'); },

    // ---------------------------------------------------------------- DEATH / VICTORY
    summaryHtml(sum, win) {
      sum = sum || {};
      const stage = sum.stage != null ? sum.stage : 0;
      const run = G.RUN && G.RUN[Math.min(stage, G.RUN.length - 1)];
      const stageName = run && run.kind === 'transit' ? 'Шлюз' : sum.stageName || (run ? run.biome : '—');
      const n = (v) => Math.round(v || 0);
      const cells = win ? `<div>${img('cells')}<span>Ядра</span><b class="cy">${n(sum.cells)}</b></div>` : `<div>${img('cells')}<span>Ядра потеряны</span><b class="bad">${n(sum.cells)}</b></div>`;
      return `<div class="sum cf">
        <div>${img('clock')}<span>Время</span><b>${fmt(sum.time || 0)}</b></div>
        <div>${img('skull')}<span>Уничтожено</span><b>${n(sum.kills)}</b></div>
        <div>${img('stage')}<span>Сектор</span><b style="font-family:var(--font-pixel);font-size:calc(var(--u)*8)">${esc(stageName)} ${stage + 1}/${G.RUN ? G.RUN.length : 7}</b></div>
        ${cells}
        <div>${img('blade')}<span>Урон нанесён</span><b>${n(sum.dmgDealt)}</b></div>
        <div>${img('heart')}<span>Урон получен</span><b>${n(sum.dmgTaken)}</b></div>
        <div>${img('gold')}<span>Кредиты</span><b class="gd">${n(sum.gold)}</b></div>

        <div class="build"></div></div>`;

    fillBuild(el, sum) {
      const b = el.querySelector('.build');
      if (!b) return;
      const slots = (sum && sum.slots) || {};
      for (const [slot] of G.SLOT_BUTTONS || []) {
        const inst = slots[slot];
        const fr = mk(`<div class="fr cf" style="--bc:${inst ? statColor(inst.def.stat) : '#2b2a45'}" title="${inst ? esc(G.itemName(inst)) : ''}"></div>`);
        if (inst) fr.appendChild(itemCanvas(inst.def));
        b.appendChild(fr);
      }
      const st = (sum && sum.stats) || {};
      b.appendChild(mk(`<div class="pz-stats"><b class="sB">${st.brutality || 1}</b><b class="sT">${st.tactics || 1}</b><b class="sS">${st.survival || 1}</b></div>`));
    },
    showDeath(sum, onRetry, onMenu) {
      this.hideAll();
      this.clearBanner();
      const el = mk(`<div class="scr end end-dead enter">
        <div class="ttl glitch jitter" data-text="СИСТЕМА ОТКЛЮЧЕНА">СИСТЕМА ОТКЛЮЧЕНА</div>
        <div class="sub">Сигнал потерян · нейросеть перезагружается</div>
        ${this.summaryHtml(sum, false)}
        <div class="rowf"><button class="mbtn cf primary" data-nav data-focus data-a="retry">Заново</button><button class="mbtn cf" data-nav data-a="menu">В меню</button></div>
        <div class="seed">Seed: ${esc(sum && sum.seed)}</div><div class="hint"></div></div>`);
      this.fillBuild(el, sum);
      el.querySelector('[data-a=retry]').onclick = () => { this.hideAll(); onRetry && onRetry(); };
      el.querySelector('[data-a=menu]').onclick = () => { this.hideAll(); onMenu && onMenu(); };
      const sc = this.push({ el, kind: 'end', onBack: () => { this.hideAll(); onMenu && onMenu(); } });
      if (G.touch && G.touch.releaseAll) G.touch.releaseAll();
      return sc;
    },
    showVictory(sum, onMenu) {
      this.hideAll();
      this.clearBanner();
      const m = G.meta || {};
      const rec = sum && m.bestTime != null && Math.abs(m.bestTime - (sum.time || 0)) < 0.01;
      const el = mk(`<div class="scr end end-win enter">
        <div class="ttl glitch" data-text="ЯДРО ОСВОБОЖДЕНО">ЯДРО ОСВОБОЖДЕНО</div>
        <div class="sub">Забег завершён · победа №${m.wins || 1}</div>
        ${rec ? '<div class="rec">Новый рекорд времени!</div>' : ''}
        ${this.summaryHtml(sum, true)}
        <div class="rowf"><button class="mbtn cf primary" data-nav data-focus data-a="again">Новый забег</button><button class="mbtn cf" data-nav data-a="menu">В меню</button></div>
        <div class="seed">Seed: ${esc(sum && sum.seed)}</div><div class="hint"></div></div>`);
      this.fillBuild(el, sum);
      el.querySelector('[data-a=menu]').onclick = () => { this.hideAll(); onMenu && onMenu(); };
      el.querySelector('[data-a=again]').onclick = () => { this.hideAll(); if (G.game && G.game.newRun) G.game.newRun(); else if (onMenu) onMenu(); };
      const sc = this.push({ el, kind: 'end', onBack: () => { this.hideAll(); onMenu && onMenu(); } });
      if (G.touch && G.touch.releaseAll) G.touch.releaseAll();

    // ---------------------------------------------------------------- LEVEL BANNER (glitch decode)
    clearBanner() { this.bn = null; if (this.bannerEl) this.bannerEl.hidden = true; },
    banner(title, sub) {
      const b = this.bannerEl;
      const g = G.game || {};
      const tag = G.RUN && g.stage != null ? `ЭТАП ${g.stage + 1}/${G.RUN.length}` : '';
      b.innerHTML = `<div class="bn-tag">${esc(tag)}</div><div class="bn-title"></div><div class="bn-line"></div><div class="bn-sub">${esc(sub || '')}</div>`;
      b.classList.remove('out');
      b.hidden = false;
      this.bn = { t: 0, text: String(title || ''), el: b.querySelector('.bn-title'), last: '', life: 2.8 };
      this.updateBanner(0);
    },
    updateBanner(dt) {
      const bn = this.bn;
      if (!bn) return;
      bn.t += dt;
      const GL = '#$%&*+=?<>/\\АБВГДЖЗИКЛМНПРСТУФХЦЧШЭЮЯ01';
      const k = Math.min(1, bn.t / 0.7), n = bn.text.length;
      if (bn.t < 0.8) {
        const tick = Math.floor(bn.t * 30);
        if (tick !== bn.tick) {
          bn.tick = tick;
          let s = '';
          for (let i = 0; i < n; i++) {
            const ch = bn.text[i];
            if (ch === ' ' || i < Math.floor(k * n)) s += ch;
            else if (i < Math.floor(k * n) + 4 || bn.t > 0.05) s += GL[(Math.random() * GL.length) | 0];
          }
          bn.el.textContent = s;
        }
      } else if (bn.last !== bn.text) { bn.el.textContent = bn.text; bn.last = bn.text; }
      if (bn.t > bn.life && !bn.out) { bn.out = true; this.bannerEl.classList.add('out'); }
      if (bn.t > bn.life + 0.6) { this.bannerEl.hidden = true; this.bn = null; }
    },

    // ---------------------------------------------------------------- STAT CHOICE (power scroll)
    statCard(stat, p) {
      const lv = (p && p.stats && p.stats[stat]) || 1;
      const its = [];
      if (p) for (const k in p.slots) { const it = p.slots[k]; if (it && statList(it.def.stat).includes(stat)) its.push(it); }
      const hp = Math.round(STAT_HP[stat] * ((p && p.hpMul) || 1));
      const c = mk(`<button class="card cf ${STAT_K[stat]}" data-nav data-stat="${stat}">
        <div class="band"><span class="nm">${STAT_NAME[stat]}</span><span class="lv"><small>Уровень</small>${lv}<i class="ar r"></i>${lv + 1}</span></div>
        <ul><li>Урон <b>${STAT_WORD[stat]}</b> снаряжения <b>+14%</b></li><li>Макс. здоровье <b>+${hp}</b></li><li>Полное восстановление</li></ul>
        <div class="its"></div><div class="pick">Установить</div></button>`);
      const box = c.querySelector('.its');
      if (its.length) for (const it of its) box.appendChild(itemCanvas(it.def));
      else box.innerHTML = '<small>нет подходящего снаряжения</small>';
      return c;
    },
    chooseStat(options, cb) {
      this.closeKind('map');
      const p = G.world && G.world.player;
      const opts = (options && options.length ? options : ['brutality', 'tactics', 'survival']).filter((s) => STAT_NAME[s]);
      const el = mk(`<div class="scr dim enter stat-scr"><div class="ttl cy glitch" data-text="ЧИП УСИЛЕНИЯ">ЧИП УСИЛЕНИЯ</div>
        <div class="sub">Выберите параметр для прокачки</div><div class="cards"></div><div class="hint"></div></div>`);
      const cards = el.querySelector('.cards');
      let done = false;
      const sc = { el, kind: 'stat', modal: true, onBack: null };
      opts.forEach((s, i) => {
        const c = this.statCard(s, p);
        if (i === 0) c.setAttribute('data-focus', '');
        c.onclick = () => { if (done) return; done = true; this.pop(sc); sfx('uiSelect', 0.5); cb && cb(s); };
        cards.appendChild(c);
      });
      if (G.touch && G.touch.releaseAll) G.touch.releaseAll();
      sfx('uiOpen', 0.45);
      return this.push(sc);
    },

    // ---------------------------------------------------------------- COLLECTOR
    openCollector(world) {
      world = world || G.world;
      if (!world || this.stack.some((s) => s.kind === 'collector')) return;
      this.closeKind('map');
      const p = world.player;
      const st = (world._uiCollector = world._uiCollector || { taken: false, offer: null });
      const el = mk(`<div class="scr dim enter"><div class="win cf coll">
        <div class="win-h"><div class="ttl cy">Коллектор</div><div class="cur"><span class="cv">0</span>${img('cells')}</div></div>
        <div class="tabs"><button class="tab cf" data-nav data-auto data-focus data-t="mut">${img('implant')}Импланты</button><button class="tab cf" data-nav data-auto data-t="bp">${img('chip')}Чертежи</button><button class="tab cf" data-nav data-auto data-t="up">${img('cells')}Улучшения</button></div>
        <div class="coll-body"></div>
        <div class="coll-foot"><span class="msg"></span><button class="mbtn cf small" data-nav data-a="close">Закрыть</button></div></div><div class="hint"></div></div>`);
      const body = el.querySelector('.coll-body'), msg = el.querySelector('.msg'), cv = el.querySelector('.cur .cv');
      const sc = { el, kind: 'collector', modal: true, tab: 'mut' };
      const say = (t, cls) => { msg.textContent = t; msg.className = 'msg ' + (cls || ''); };
      const cells = () => (p ? p.cells | 0 : 0);
      const paintCur = () => { cv.textContent = cells(); };
      const cost = (n) => `<span class="cost ${cells() < n ? 'no' : ''}">${n}${img('cells')}</span>`;
      const render = () => {
        paintCur();
        el.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === sc.tab));
        body.innerHTML = '';
        body.scrollTop = 0;
        if (sc.tab === 'mut') renderMut(); else if (sc.tab === 'bp') renderBp(); else renderUp();
      };
      // --- implants: pick one free implant per transit (max G.MAX_MUTATIONS, replace when full)
      const mutIcon = (m, size = 16) => { const c = document.createElement('canvas'); c.width = c.height = size; c.className = 'px'; H().paintMutation(c, m); return c; };
      const install = (m, idx) => {
        let res = null;
        try { res = G.addMutation(p, m, idx); } catch (e) { console.error(e); }
        if (!res) { say('Сбой установки импланта', 'bad'); sfx('denied', 0.5); return; }
        st.taken = true; st.pending = null;
        say('Имплант установлен: ' + H().mutName(m), 'ok');
        render();
        this.setFocus(sc, el.querySelector('.tab[data-t=mut]'), false);
      };
      const renderMut = () => {
        if (!G.offerMutations || !G.addMutation) {
          body.innerHTML = '<div class="note">Имплант-модуль не отвечает. Нейро-импланты станут доступны в следующих версиях прошивки.</div>';
          return;
        }
        const mine = (p && p.mutations) || [];
        if (st.taken) {
          body.innerHTML = '<div class="note">Имплант уже установлен в этом шлюзе. Следующий — в следующем шлюзе.</div>';
          if (mine.length) {
            const list = mk('<div class="list"></div>');
            for (const m of mine) {
              const r = mk(`<div class="li cf owned"><div class="fr cf k-t" style="--bc:${statColor(m.stat)}"></div><div class="tx"><span>${esc(H().mutName(m))}</span><small>${esc(m.desc || '')}</small></div><span></span></div>`);
              r.querySelector('.fr').appendChild(mutIcon(m));
              list.appendChild(r);
            }
            body.appendChild(list);
          }
          return;
        }
        if (st.pending) { // slots full: choose which implant to replace
          const m = st.pending;
          body.appendChild(mk(`<div class="note">Все слоты имплантов заняты. Что заменить на «${esc(H().mutName(m))}»?</div>`));
          const list = mk('<div class="list"></div>');
          mine.forEach((old, i) => {
            const r = mk(`<button class="li cf" data-nav><div class="fr cf" style="--bc:${statColor(old.stat)}"></div><div class="tx"><span>${esc(H().mutName(old))}</span><small>${esc(old.desc || '')}</small></div><span class="cost no" style="font-family:var(--font-pixel)">Заменить</span></button>`);
            r.querySelector('.fr').appendChild(mutIcon(old));
            r.onclick = () => install(m, i);
            list.appendChild(r);
          });
          const cancel = mk('<button class="li cf" data-nav><div class="fr cf" style="--bc:#45466a"></div><div class="tx"><span>Отмена</span><small>Вернуться к выбору</small></div><span></span></button>');
          cancel.onclick = () => { st.pending = null; render(); };
          list.appendChild(cancel);
          body.appendChild(list);
          return;
        }
        if (!st.offer) { try { st.offer = G.offerMutations(world.rng, p, 3) || []; } catch (e) { console.error(e); st.offer = []; } }
        if (!st.offer.length) { body.innerHTML = '<div class="note">Нет доступных имплантов.</div>'; return; }
        const max = G.MAX_MUTATIONS || 3;
        body.appendChild(mk(`<div class="note">Выберите один бесплатный имплант. Он действует до конца забега. Слоты: ${mine.length} / ${max}</div>`));
        const cards = mk('<div class="cards"></div>');
        st.offer.forEach((m) => {
          const s = statList(m.stat)[0];
          const c = mk(`<button class="card cf ${STAT_K[s] || 'k-t'}" data-nav><div class="band"><span class="nm" style="padding-right:calc(var(--u)*22)">${esc(H().mutName(m))}</span><span class="lv"><small>${esc(STAT_NAME[s] || 'Имплант')}</small></span></div>
            <ul><li>${esc(m.desc || m.description || '')}</li></ul><div class="pick">${mine.length >= max ? 'Заменить…' : 'Установить'}</div></button>`);
          const icv = mutIcon(m, 24);
          icv.style.cssText = 'position:absolute;right:calc(var(--u)*6);top:calc(var(--u)*6);width:calc(var(--u)*20);height:calc(var(--u)*20)';
          c.querySelector('.band').appendChild(icv);
          c.onclick = () => {
            if (st.taken) return;
            if (mine.length >= max) { st.pending = m; render(); const it = this.items(sc).filter((e) => e.classList.contains('li')); this.setFocus(sc, it[0] || null, false); return; }
            install(m);
          };
          cards.appendChild(c);
        });
        body.appendChild(cards);
      };
      // --- blueprints: unlock items for future runs
      const renderBp = () => {
        const unlocked = (G.meta && G.meta.unlocked) || [];
        const all = Object.values(G.ITEMS || {}).filter((d) => d.blueprint);
        if (!all.length) { body.innerHTML = '<div class="note">Чертежей пока нет. Ищите их у элитных врагов.</div>'; return; }
        const locked = all.filter((d) => !unlocked.includes(d.id)), owned = all.filter((d) => unlocked.includes(d.id));
        const list = mk('<div class="list"></div>');
        for (const d of locked.concat(owned)) {
          const own = unlocked.includes(d.id);
          const price = d.unlockCost || 50;
          const r = mk(`<button class="li cf ${own ? 'owned' : ''}" data-nav><div class="fr cf" style="--bc:${statColor(d.stat)}"></div>
            <div class="tx"><span>${esc(d.name)}</span><small>${esc(H().KIND_NAME[d.kind] || '')}${d.desc ? ' · ' + esc(d.desc) : ''}</small></div>
            ${own ? '<span class="cost done">Открыт</span>' : cost(price)}</button>`);
          r.querySelector('.fr').appendChild(itemCanvas(d));
          r.onclick = () => {
            if (own) return;
            let ok = false;
            if (G.unlockBlueprint) { try { ok = G.unlockBlueprint(d.id) !== false && (G.meta.unlocked || []).includes(d.id); } catch (e) { console.error(e); } }
            else if (cells() >= price) {
              p.cells -= price;
              G.meta.unlocked = G.meta.unlocked || []; G.meta.unlocked.push(d.id);
              if (G.saveMeta) G.saveMeta();
              G.emit('unlock', { id: d.id, def: d });
              ok = true;
            }
            if (ok) { say('Чертёж открыт: ' + d.name, 'ok'); if (!G.unlockBlueprint) sfx('shopBuy', 0.6); const idx = this.items(sc).indexOf(r); render(); const it = this.items(sc); this.setFocus(sc, it[Math.min(idx, it.length - 1)] || null, false); }
            else { say('Недостаточно ядер', 'bad'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); if (!G.unlockBlueprint) sfx('denied', 0.5); }
          };
          list.appendChild(r);
        }
        body.appendChild(list);
      };
      // --- permanent upgrades
      const UP_ICON = { flask: 'flask', hp: 'heart', flaskPower: 'flask', startSkill: 'implant', startGold: 'gold', interest: 'gold', cellMagnet: 'cells' };
      const renderUp = () => {
        const ups = G.META_UPGRADES || [];
        if (!ups.length) { body.innerHTML = '<div class="note">Улучшения недоступны.</div>'; return; }
        const list = mk('<div class="list"></div>');
        for (const u of ups) {
          const lvl = ((G.meta && G.meta.upgrades) || {})[u.id] || 0;
          const max = (u.cost || []).length;
          const next = lvl < max ? u.cost[lvl] : null;
          const r = mk(`<button class="li cf ${next == null ? 'owned' : ''}" data-nav><div class="fr cf" style="--bc:var(--cells)">${img(UP_ICON[u.id] || 'chip')}</div>
            <div class="tx"><span>${esc(u.name)}</span><small>${esc(u.desc || '')}</small><div class="pips">${'<i></i>'.repeat(max)}</div></div>
            ${next == null ? '<span class="cost done">Максимум</span>' : cost(next)}</button>`);
          r.querySelectorAll('.pips i').forEach((e, i) => e.classList.toggle('on', i < lvl));
          r.onclick = () => {
            if (next == null) return;
            let ok = false;
            if (G.buyUpgrade) { try { const before = lvl; const res = G.buyUpgrade(u.id); ok = res !== false && (((G.meta.upgrades || {})[u.id] || 0) > before); } catch (e) { console.error(e); } }
            else if (cells() >= next) {
              p.cells -= next;
              G.meta.upgrades = G.meta.upgrades || {}; G.meta.upgrades[u.id] = lvl + 1;
              if (G.saveMeta) G.saveMeta();
              ok = true;
            }
            if (ok) { say(G.buyUpgrade ? 'Улучшение установлено: ' + u.name : 'Улучшение установлено (со следующего забега)', 'ok'); if (!G.buyUpgrade) sfx('shopBuy', 0.6); const idx = this.items(sc).indexOf(r); render(); const it = this.items(sc); this.setFocus(sc, it[Math.min(idx, it.length - 1)] || null, false); }
            else { say('Недостаточно ядер', 'bad'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); sfx('denied', 0.5); }
          };
          list.appendChild(r);
        }
        body.appendChild(list);
      };
      el.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { if (sc.tab !== b.dataset.t) { sc.tab = b.dataset.t; say(''); render(); } }));
      const close = () => { this.pop(sc); };
      sc.onBack = close;
      el.querySelector('[data-a=close]').onclick = close;
      render();
      if (G.touch && G.touch.releaseAll) G.touch.releaseAll();
      sfx('uiOpen', 0.45);
      return this.push(sc);
    },

    // ---------------------------------------------------------------- BIG MAP
    openMap() {
      const w = G.world, hud = H();
      if (!w || !hud || !hud.map || this.stack.length) return;
      const tex = hud.map.tex;
      const maxW = 880, maxH = 400; // backing px (= 2 per game px)
      let s = Math.min(maxW / tex.width, maxH / tex.height);
      if (s >= 1) s = Math.floor(s);
      const cw = Math.max(2, Math.round(tex.width * s)), ch = Math.max(2, Math.round(tex.height * s));
      const run = G.RUN && G.game && G.RUN[G.game.stage];
      const biome = run && G.BIOMES && G.BIOMES[run.biome];
      const name = run ? (run.kind === 'transit' ? 'Шлюз' : run.kind === 'boss' ? 'Арена ядра' : biome ? biome.name : run.biome) : 'Карта';
      // explored percentage (open tiles only)
      const L = w.level;
      let open = 0, seen = 0;
      for (let i = 0; i < L.w * L.h; i++) { if (L.tiles && L.tiles[i] !== G.T.SOLID) { open++; if (L.explored[i]) seen++; } }
      const pct = open ? Math.round((100 * seen) / open) : 0;
      const C = hud.MARK_COL;
      const el = mk(`<div class="scr dim enter bigmap"><div class="win-h" style="width:calc(var(--u)*${Math.max(200, cw / 2 + 8)})"><div class="ttl cy" >${esc(name)}</div><div class="sub">Исследовано ${pct}%</div></div>
        <div class="mapbox cf"><canvas class="px" width="${cw}" height="${ch}" style="width:calc(var(--u)*${cw / 2});height:calc(var(--u)*${ch / 2})"></canvas></div>
        <div class="legend"><span><i style="background:#27f3ff"></i>Выход</span><span><i style="background:${C.chest}"></i>Контейнер</span><span><i style="background:${C.scroll}"></i>Чип</span><span><i style="background:${C.shop}"></i>Магазин</span><span><i style="background:${C.collector}"></i>Коллектор</span><span><i style="background:#fff"></i>Вы</span></div>
        <button class="mbtn cf small" data-nav data-focus data-a="close">Закрыть</button><div class="hint"></div></div>`);
      const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
      const draw = (blink) => { hud.collectMarks(w); hud.drawMapView(ctx, cw, ch, w, { center: false, blink }); };
      draw(1);
      let acc = 0, bl = 1;
      const sc = { el, kind: 'map', modal: true, onBack: () => this.closeMap(), update: (dt) => { acc += dt; if (acc > 0.35) { acc = 0; bl ^= 1; draw(bl); } } };
      el.querySelector('[data-a=close]').onclick = () => this.closeMap();
      el.querySelector('.mapbox').onclick = () => this.closeMap();
      if (G.touch && G.touch.releaseAll) G.touch.releaseAll();
      this.push(sc);
      sfx('uiOpen', 0.5);
    },
    closeMap() { this.closeKind('map'); },

    // ---------------------------------------------------------------- TITLE BACKDROP (canvas, 480×270)
    drawBackdrop(ctx, dt) {
      this.bdT = (this.bdT || 0) + (dt || 0);
      if (G.drawCityBackdrop && !this._bdFail) {
        try { G.drawCityBackdrop(ctx, this.bdT, dt); return; } catch (e) { this._bdFail = true; }
      }
      if (!this.city) this.city = buildCity();
      drawCity(ctx, this.city, this.bdT, dt || 0);
      if (G.game && G.game.vignette) ctx.drawImage(G.game.vignette, 0, 0);
    },
  };

  // ------------------------------------------------------------------ procedural neon skyline
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function buildCity() {
    const R = new G.RNG(0xc17c17);
    const W = G.W, Hh = G.H, LW = 960;
    // sky with dithered bands
    const sky = canvas(W, Hh), g = sky.getContext('2d');
    const bands = ['#05040f', '#070517', '#0a071e', '#0e0926', '#130b2e', '#190d36', '#210f3e', '#2b1146', '#36134c', '#421451', '#4f1554', '#5c1656', '#6a1857'];
    const bh = 200 / bands.length;
    bands.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + 1); });
    g.fillStyle = bands[bands.length - 1]; g.fillRect(0, 200, W, Hh - 200);
    for (let i = 1; i < bands.length; i++) {
      const y = Math.floor(i * bh);
      g.fillStyle = bands[i - 1];
      for (let x = (i & 1); x < W; x += 2) g.fillRect(x, y, 1, 1);
    }
    for (let i = 0; i < 110; i++) { g.fillStyle = R.chance(0.2) ? '#b6c2ff' : R.chance(0.5) ? '#5b5c93' : '#3a3a6a'; g.fillRect(R.int(0, W - 1), R.int(0, 120), 1, 1); }
    // striped sun
    const sx = 332, sy = 132, sr = 64;
    const cols = ['#ffe14d', '#ffc23d', '#ff9a3a', '#ff6a4a', '#ff3d6a', '#ff2a8a'];
    const glow = g.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 2.2);
    glow.addColorStop(0, 'rgba(255,60,140,0.35)'); glow.addColorStop(1, 'rgba(255,42,138,0)');
    g.fillStyle = glow; g.fillRect(sx - sr * 2.3, sy - sr * 2.3, sr * 4.6, sr * 4.6);
    for (let y = -sr; y <= sr; y++) {
      const yy = y + sr * 0.05;
      if (yy > 0) { const gap = 1 + Math.floor((yy / sr) * 5); if (yy % 10 < gap) continue; }
      const hw = Math.floor(Math.sqrt(sr * sr - y * y));
      g.fillStyle = cols[Math.min(cols.length - 1, Math.floor(((y + sr) / (2 * sr)) * cols.length))];
      g.fillRect(sx - hw, sy + y, hw * 2 + 1, 1);
    }
    // layers of buildings (tileable over LW)
    const blinks = [];
    const layer = (o) => {
      const c = canvas(LW, Hh), q = c.getContext('2d');
      const L = { cv: c, speed: o.speed, blinks: [] };
      let x = -10;
      while (x < LW) {
        const w = R.int(o.wMin, o.wMax), h = R.int(o.hMin, o.hMax);
        const top = Hh - h;
        const draw = (ox) => {
          q.fillStyle = o.color; q.fillRect(ox, top, w, h);
          // setback / roof detail
          if (R.chance(0.45)) { const iw = Math.max(4, Math.floor(w * R.float(0.3, 0.7))); q.fillRect(ox + Math.floor((w - iw) / 2), top - R.int(4, 14), iw, 20); }
          if (o.edge) { q.fillStyle = o.edge; q.fillRect(ox, top, w, 1); q.fillRect(ox, top, 1, h); }
          // windows
          for (let wy = top + 4; wy < Hh - 2; wy += o.wy) {
            for (let wx = ox + 2; wx < ox + w - 2; wx += o.wx) {
              if (R.chance(o.lit)) { q.fillStyle = R.pick(o.win); q.fillRect(wx, wy, o.ww, o.wh); }
            }
          }
          // neon sign
          if (o.signs && R.chance(o.signs)) {
            const c2 = R.pick(['#ff2a8a', '#27f3ff', '#ffe14d', '#b46cff', '#48ff8a']);
            q.fillStyle = c2;
            if (R.chance(0.5)) { const sh = R.int(14, 34), sx2 = ox + R.int(1, Math.max(1, w - 5)); q.fillRect(sx2, top + R.int(6, 20), 4, sh); q.fillStyle = '#05040a'; for (let k = 3; k < sh; k += 5) q.fillRect(sx2 + 1, top + 8 + k, 2, 1); }
            else { const sw = Math.min(w - 4, R.int(12, 26)); q.fillRect(ox + 2, top + R.int(8, 18), sw, 3); }
          }
          // antenna
          if (R.chance(o.ant)) {
            const ax = ox + R.int(2, w - 3), ah = R.int(8, 24);
            q.fillStyle = o.color; q.fillRect(ax, top - ah, 1, ah);
            L.blinks.push({ x: ax, y: top - ah - 1, ph: R.float(0, 6), c: R.chance(0.7) ? '#ff3348' : '#27f3ff' });
          }
        };
        draw(x);
        if (x + w > LW) draw(x - LW);
        x += w + R.int(o.gapMin, o.gapMax);
      }
      return L;
    };
    const far = layer({ speed: 5, color: '#1b1034', wMin: 18, wMax: 44, hMin: 70, hMax: 165, gapMin: -6, gapMax: 4, wx: 3, wy: 4, ww: 1, wh: 1, lit: 0.18, win: ['#3d2a73', '#5a2a6b', '#2b4a7a'], ant: 0.35, signs: 0 });
    const mid = layer({ speed: 12, color: '#110a22', edge: '#241640', wMin: 22, wMax: 56, hMin: 50, hMax: 125, gapMin: 2, gapMax: 14, wx: 4, wy: 5, ww: 2, wh: 1, lit: 0.22, win: ['#27f3ff', '#ff2a8a', '#ffe14d', '#6a4aa8', '#6a4aa8'], ant: 0.25, signs: 0.55 });
    const near = layer({ speed: 26, color: '#06040b', edge: '#1a1030', wMin: 34, wMax: 80, hMin: 22, hMax: 70, gapMin: 6, gapMax: 26, wx: 6, wy: 6, ww: 2, wh: 2, lit: 0.08, win: ['#ff2a8a', '#27f3ff', '#ffc23d'], ant: 0.3, signs: 0.35 });
    // horizon haze
    const fog = canvas(W, Hh), fg = fog.getContext('2d');
    const gr = fg.createLinearGradient(0, 150, 0, Hh);
    gr.addColorStop(0, 'rgba(255,42,138,0)'); gr.addColorStop(0.55, 'rgba(255,42,138,0.10)'); gr.addColorStop(1, 'rgba(120,30,160,0.22)');
    fg.fillStyle = gr; fg.fillRect(0, 150, W, Hh - 150);
    // rain sprites
    const drop = (len, col) => { const c = canvas(Math.ceil(len * 0.3) + 1, len); const q = c.getContext('2d'); q.fillStyle = col; for (let i = 0; i < len; i++) q.fillRect(Math.floor((len - 1 - i) * 0.3), i, 1, 1); return c; };
    const drops = [];
    for (let i = 0; i < 150; i++) drops.push({ x: R.float(0, W + 60), y: R.float(-Hh, Hh), v: R.float(280, 420), n: R.chance(0.3) ? 1 : 0 });
    return { sky, far, mid, near, fog, drops, dropS: [drop(6, 'rgba(150,170,255,0.35)'), drop(10, 'rgba(190,210,255,0.55)')], cars: [], carT: 1, R, blinks };
  }
  function drawLayer(ctx, L, t) {
    const LW = L.cv.width;
    const off = Math.floor((t * L.speed) % LW);
    ctx.drawImage(L.cv, -off, 0);
    if (LW - off < G.W) ctx.drawImage(L.cv, LW - off, 0);
    for (const b of L.blinks) {
      if (Math.sin(t * 2.2 + b.ph) < 0.3) continue;
      let x = b.x - off; if (x < -2) x += LW;
      if (x > G.W + 2) continue;
      ctx.fillStyle = b.c; ctx.fillRect(x, b.y, 1, 1);
      G.drawGlow(ctx, x, b.y, 6, b.c, 0.6);
    }
  }
  function drawCity(ctx, C, t, dt) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(C.sky, 0, 0);
    drawLayer(ctx, C.far, t);
    ctx.drawImage(C.fog, 0, 0);
    // flying cars between far & mid layers
    C.carT -= dt;
    if (C.carT <= 0) {
      C.carT = C.R.float(0.8, 2.6);
      const dir = C.R.sign();
      C.cars.push({ x: dir > 0 ? -12 : G.W + 12, y: C.R.int(46, 150), v: dir * C.R.float(40, 110), c: C.R.pick(['#27f3ff', '#ff2a8a', '#ffe14d']) });
    }
    for (let i = C.cars.length - 1; i >= 0; i--) {
      const c = C.cars[i];
      c.x += c.v * dt;
      if (c.x < -20 || c.x > G.W + 20) { C.cars.splice(i, 1); continue; }
      const x = Math.round(c.x), y = c.y, d = Math.sign(c.v);
      ctx.fillStyle = c.c; ctx.globalAlpha = 0.35; ctx.fillRect(d > 0 ? x - 9 : x + 3, y + 1, 7, 1); ctx.globalAlpha = 1;
      ctx.fillStyle = '#0b0816'; ctx.fillRect(x - 2, y, 5, 2);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(d > 0 ? x + 2 : x - 2, y, 1, 1);
      ctx.fillStyle = '#ff3348'; ctx.fillRect(d > 0 ? x - 2 : x + 2, y + 1, 1, 1);
      G.drawGlow(ctx, x, y, 8, c.c, 0.35);
    }
    drawLayer(ctx, C.mid, t);
    // searchlights
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2; i++) {
      const a = -Math.PI / 2 + Math.sin(t * 0.35 + i * 2.1) * 0.55;
      const bx = 110 + i * 260, by = G.H;
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = i ? '#ff2a8a' : '#27f3ff';
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a - 0.05) * 320, by + Math.sin(a - 0.05) * 320);
      ctx.lineTo(bx + Math.cos(a + 0.05) * 320, by + Math.sin(a + 0.05) * 320);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawLayer(ctx, C.near, t);
    // rain
    for (const d of C.drops) {
      d.y += d.v * dt; d.x -= d.v * 0.3 * dt;
      if (d.y > G.H) { d.y = C.R.float(-30, -5); d.x = C.R.float(0, G.W + 60); }
      ctx.drawImage(C.dropS[d.n], Math.round(d.x), Math.round(d.y));
    }
  }

  G.ui = ui;
})();

</script>
<script>/* js/touch.js */
'use strict';
// On-screen touch controls (mobile): floating joystick on the left, Dead Cells-style action cluster on
// the right (item icons + cooldown sweeps), contextual interact button, pause/map buttons, portrait hint.
// Multi-touch safe (tracks touch identifiers), drives the game only through G.input.setVirtual().
(function () {
  const G = window.G;
  const BTNS = [
    { act: 'attack1', slot: 'primary', k: 'k-c' },
    { act: 'attack2', slot: 'secondary', k: 'k-c' },
    { act: 'jump', icon: 'jump', k: 'k-g' },
    { act: 'roll', icon: 'roll', k: 'k-v' },
    { act: 'skill1', slot: 'skill1', k: 'k-c' },
    { act: 'skill2', slot: 'skill2', k: 'k-c' },
    { act: 'heal', icon: 'flask', k: 'k-s' },
    { act: 'interact', icon: 'hand', k: 'k-y' },
  ];
  const SLIDE = { attack1: 1, attack2: 1, skill1: 1, skill2: 1, jump: 1, roll: 1 }; // a finger may slide between these
  const DIRS = ['left', 'right', 'up', 'down'];
  const STAT_K = { brutality: 'k-b', tactics: 'k-t', survival: 'k-s' };

  const touch = {
    enabled: false, visible: false,
    touches: new Map(), hold: {}, dirs: {}, stick: { id: null },
    btn: {}, b: 60,

    init() {
      let root = document.getElementById('touch');
      if (!root) { root = document.createElement('div'); root.id = 'touch'; }
      document.body.appendChild(root); // full-viewport layer: may use the pillarbox & safe areas
      root.className = 'tc';
      this.root = root;
      const icon = (n) => (G.hud && G.hud.icon ? G.hud.icon(n) : '');
      let html = `<div class="tc-zone"></div><div class="tc-stick"><i class="tc-dir l"></i><i class="tc-dir r"></i><i class="tc-dir u"></i><i class="tc-dir d"></i><div class="tc-knob"></div></div>`;
      for (const b of BTNS) {
        html += `<div class="tc-btn ${b.k}" data-act="${b.act}">` +
          (b.slot ? '<canvas width="24" height="24"></canvas><i class="cd"></i><b class="cdt"></b>' : `<img alt="" draggable="false" src="${icon(b.icon)}">`) +
          (b.act === 'heal' ? '<b class="n"></b>' : '') + (b.act === 'interact' ? '<span class="lbl"></span>' : '') + '</div>';
      }
      html += `<div class="tc-sys" data-act="map"><img alt="" src="${icon('map')}"></div><div class="tc-sys" data-act="pause"><img alt="" src="${icon('pause')}"></div>`;
      root.innerHTML = html;
      this.zone = root.querySelector('.tc-zone');
      this.stickEl = root.querySelector('.tc-stick');
      this.knob = root.querySelector('.tc-knob');
      this.dirEls = { left: root.querySelector('.tc-dir.l'), right: root.querySelector('.tc-dir.r'), up: root.querySelector('.tc-dir.u'), down: root.querySelector('.tc-dir.d') };
      for (const b of BTNS) {
        const el = root.querySelector(`.tc-btn[data-act="${b.act}"]`);
        el.addEventListener('animationend', () => el.classList.remove('ready'));
        this.btn[b.act] = { def: b, el, cv: el.querySelector('canvas'), cd: el.querySelector('.cd'), cdt: el.querySelector('.cdt'), n: el.querySelector('.n'), lbl: el.querySelector('.lbl'), id: null, p: -1, t: '', peak: 1, last: 0, k: b.k };
      }
      // portrait hint
      const rot = document.createElement('div');
      rot.className = 'tc-rotate';
      rot.innerHTML = '<div class="ph"></div><div class="big">Поверните устройство</div><div class="sm">DEAD CIRCUITS играется в горизонтальной ориентации</div><button type="button">Играть так</button>';
      rot.querySelector('button').addEventListener('click', () => document.body.classList.add('tc-rotate-off'));
      document.body.appendChild(rot);

      const opt = { passive: false };
      root.addEventListener('touchstart', (e) => this.onStart(e), opt);
      root.addEventListener('touchmove', (e) => this.onMove(e), opt);
      root.addEventListener('touchend', (e) => this.onEnd(e), opt);
      root.addEventListener('touchcancel', (e) => this.onEnd(e), opt);
      // Stop compatibility mouse events (a tap on the canvas would otherwise fire attack1 via mousedown)
      // and double-tap zoom everywhere except in menus, where taps must become clicks.
      document.addEventListener('touchstart', (e) => {
        this.enable(true);
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('#ui .scr, .tc-rotate, #touch')) return;
        if (t.closest('.h-map')) { if (G.ui && G.ui.openMap) G.ui.openMap(); }
        if (e.cancelable) e.preventDefault();
      }, { capture: true, passive: false });
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('dblclick', (e) => e.preventDefault());
      window.addEventListener('blur', () => this.releaseAll());
      document.addEventListener('visibilitychange', () => { if (document.hidden) this.releaseAll(); });
      window.addEventListener('keydown', (e) => { if (!e.repeat && this.enabled && !G.params.has('touch')) this.enable(false); });
      const rs = () => requestAnimationFrame(() => this.layout());
      window.addEventListener('resize', rs);
      window.addEventListener('orientationchange', rs);

      let coarse = false;
      try { coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) { /* old browser */ }
      if (coarse || G.params.has('touch')) this.enable(true);
      this.layout();
      const loop = () => { try { this.frame(); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    },

    enable(on) {
      if (this.enabled === on) return;
      this.enabled = on;
      document.body.classList.toggle('touch-mode', on);
      if (on) G.input.device = 'touch';
      else this.releaseAll();
      if (G.hud && G.hud.measure) requestAnimationFrame(() => G.hud.measure());
      this.layout();
    },

    // geometry: button unit, idle stick position, keep the HUD minimap clear of the system buttons
    layout() {
      const vw = window.innerWidth, vh = window.innerHeight;
      this.b = Math.max(46, Math.min(86, 0.155 * Math.min(vw, vh)));
      if (this.stick.id == null) this.placeStick(null);
      const st = document.getElementById('stage');
      if (!st) return;
      const r = st.getBoundingClientRect();
      const cs = getComputedStyle(document.documentElement);
      const sar = parseFloat(cs.getPropertyValue('--sar')) || 0, sat = parseFloat(cs.getPropertyValue('--sat')) || 0;
      // system buttons live at the top-right; they only collide with the HUD when they overlap the stage
      const pillar = r.top >= sat + 54 ? 1e4 : vw - r.right;
      const narrow = pillar < 108 + sar;
      document.body.classList.toggle('tc-narrow', narrow);
      const need = (narrow ? 58 : 108) + sar;
      document.body.style.setProperty('--tc-res', Math.max(0, need - pillar) + 'px');
      document.body.classList.toggle('tc-reserve', pillar < need);
    },
    placeStick(x, y) {
      const s = this.stickEl.style;
      if (x == null) {
        const cs = getComputedStyle(document.documentElement);
        const sal = parseFloat(cs.getPropertyValue('--sal')) || 0, sab = parseFloat(cs.getPropertyValue('--sab')) || 0;
        x = sal + this.b * 1.55; y = window.innerHeight - sab - this.b * 1.45;
      }
      this.stick.bx = x; this.stick.by = y;
      s.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      this.knob.style.transform = '';
    },

    // ---------------------------------------------------------------- action holds (counted per action)
    press(act, el) {
      this.hold[act] = (this.hold[act] || 0) + 1;
      if (this.hold[act] === 1) G.input.setVirtual(act, true);
      if (el) el.classList.add('on');
    },
    release(act, el) {
      if (!this.hold[act]) return;
      this.hold[act]--;
      if (this.hold[act] <= 0) { this.hold[act] = 0; G.input.setVirtual(act, false); }
      if (el && !this.hold[act]) el.classList.remove('on');
    },
    setDir(d, on) {
      if (!!this.dirs[d] === on) return;
      this.dirs[d] = on;
      G.input.setVirtual(d, on);
      this.dirEls[d].classList.toggle('on', on);
    },
    releaseAll() {
      for (const a in this.hold) if (this.hold[a]) { this.hold[a] = 0; G.input.setVirtual(a, false); }
      for (const d of DIRS) this.setDir(d, false);
      this.touches.clear();
      if (this.root) this.root.querySelectorAll('.on').forEach((e) => e.classList.remove('on'));
      if (this.stickEl) { this.stick.id = null; this.stickEl.classList.remove('on'); this.placeStick(null); }
    },

    onStart(e) {
      if (e.cancelable) e.preventDefault();
      if (!this.visible) return;
      for (const t of e.changedTouches) {
        const tg = t.target && t.target.closest ? t.target : null;
        const b = tg && tg.closest('.tc-btn, .tc-sys');
        if (b) {
          const act = b.dataset.act;
          this.touches.set(t.identifier, { kind: 'btn', act, el: b });
          this.press(act, b);
          if (act === 'jump' || act === 'roll' || act === 'attack1') this.buzz(8);
          continue;
        }
        if (tg && tg.closest('.tc-zone') && this.stick.id == null) {
          this.stick.id = t.identifier;
          this.touches.set(t.identifier, { kind: 'stick' });
          this.placeStick(t.clientX, t.clientY);
          this.stickEl.classList.add('on');
          this.moveStick(t.clientX, t.clientY);
        }
      }
    },
    onMove(e) {
      if (e.cancelable) e.preventDefault();
      for (const t of e.changedTouches) {
        const rec = this.touches.get(t.identifier);
        if (!rec) continue;
        if (rec.kind === 'stick') { this.moveStick(t.clientX, t.clientY); continue; }
        if (!SLIDE[rec.act]) continue;
        const under = document.elementFromPoint(t.clientX, t.clientY);
        const nb = under && under.closest && under.closest('.tc-btn');
        if (nb && nb !== rec.el && SLIDE[nb.dataset.act] && this.root.contains(nb)) {
          this.release(rec.act, rec.el);
          rec.act = nb.dataset.act; rec.el = nb;
          this.press(rec.act, nb);
        }
      }
    },
    onEnd(e) {
      if (e.cancelable) e.preventDefault();
      for (const t of e.changedTouches) {
        const rec = this.touches.get(t.identifier);
        if (!rec) continue;
        this.touches.delete(t.identifier);
        if (rec.kind === 'stick') {
          this.stick.id = null;
          for (const d of DIRS) this.setDir(d, false);
          this.stickEl.classList.remove('on');
          this.placeStick(null);
        } else this.release(rec.act, rec.el);
      }
    },
    moveStick(x, y) {
      const R = this.b * 0.8;
      let dx = x - this.stick.bx, dy = y - this.stick.by;
      let d = Math.hypot(dx, dy);
      if (d > R * 1.3) { // drag the base along with the thumb
        const k = (d - R * 1.3) / d;
        this.placeStick(this.stick.bx + dx * k, this.stick.by + dy * k);
        dx = x - this.stick.bx; dy = y - this.stick.by; d = Math.hypot(dx, dy);
      }
      const kd = d > R ? R / d : 1;
      this.knob.style.transform = `translate(${(dx * kd).toFixed(1)}px, ${(dy * kd).toFixed(1)}px)`;
      const nx = dx / R, ny = dy / R, ax = Math.abs(dx), ay = Math.abs(dy);
      const D = this.dirs;
      this.setDir('left', D.left ? nx < -0.2 : nx < -0.3);
      this.setDir('right', D.right ? nx > 0.2 : nx > 0.3);
      // vertical only when clearly vertical (keeps running from triggering ladders / drops)
      this.setDir('up', ny < (D.up ? -0.4 : -0.5) && ay > ax * (D.up ? 0.85 : 1.15));
      this.setDir('down', ny > (D.down ? 0.4 : 0.5) && ay > ax * (D.down ? 0.85 : 1.15));
    },
    buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ } },

    // ---------------------------------------------------------------- per-frame (rAF) refresh
    frame() {
      const g = G.game;
      const show = this.enabled && !!g && g.state === 'play' && !g.paused && !!G.world && !(G.ui && G.ui.stack && G.ui.stack.length);
      if (show !== this.visible) {
        this.visible = show;
        document.body.classList.toggle('tc-on', show);
        if (!show) this.releaseAll();
      }
      if (!show) return;
      if (G.input.device === 'pad') { this.enable(false); return; }
      const p = G.world.player;
      if (!p) return;
      for (const b of BTNS) {
        const B = this.btn[b.act];
        if (b.slot) this.updSlot(B, p.slots[b.slot], p);
      }
      const H = this.btn.heal;
      const n = p.flasks | 0;
      if (n !== H.p) { H.n.textContent = n; H.el.classList.toggle('empty', n <= 0); H.p = n; }
      const I = this.btn.interact;
      const f = p.state !== 'dead' ? p.focus : null;
      if (!!f !== !!I.id) { I.el.classList.toggle('show', !!f); if (!f) this.release('interact', I.el); }
      if (f) {
        let txt = typeof f.prompt === 'function' ? f.prompt() : f.prompt || '';
        txt = String(txt).split(/[:—]/)[0].trim();
        if (txt !== I.t) { I.lbl.textContent = txt; I.t = txt; }
      }
      I.id = f || null;
    },
    updSlot(B, inst, p) {
      const id = inst ? inst.id + ':' + inst.uid : '';
      if (id !== B.id) {
        B.id = id;
        const g = B.cv.getContext('2d');
        g.clearRect(0, 0, 24, 24);
        if (inst) { try { g.imageSmoothingEnabled = false; g.drawImage(G.itemIcon(inst.def, 24), 0, 0); } catch (e) { /* no icon */ } }
        B.el.classList.toggle('empty', !inst);
        const st = inst ? (Array.isArray(inst.def.stat) ? inst.def.stat[0] : inst.def.stat) : null;
        const k = STAT_K[st] || B.def.k;
        if (k !== B.k) { B.el.classList.remove(B.k); B.el.classList.add(k); B.k = k; }
        B.peak = 1; B.last = 0;
      }
      let frac = 0, txt = '';
      if (inst && inst.cd > 0) {
        if (inst.cd > B.last + 0.02) B.peak = inst.cd;
        const tot = inst.cdMax || (inst.def.cooldown ? inst.def.cooldown * (p.cdMul || 1) : B.peak);
        frac = Math.max(0, Math.min(1, inst.cd / Math.max(0.01, tot)));
        if (inst.cd >= 1) txt = String(Math.ceil(inst.cd));
      }
      B.last = inst ? inst.cd || 0 : 0;
      const q = Math.ceil(frac * 48) / 48;
      if (q !== B.p) {
        if (q === 0 && B.p > 0) B.el.classList.add('ready');
        B.cd.style.setProperty('--p', q.toFixed(3));
        B.el.classList.toggle('cooling', q > 0);
        B.p = q;
      }
      if (txt !== B.t) { B.cdt.textContent = txt; B.t = txt; }
    },
  };
  G.touch = touch;
})();

</script>
<script>/* js/game.js */
'use strict';
// World container, run structure (biomes → transit → boss), main loop and rendering pipeline.
(function () {
  const G = window.G;
  const PAL = G.PAL, TS = G.TILE;

  // Run layout. depth = difficulty tier used by enemies & loot.
  G.RUN = [
    { kind: 'biome', biome: 'scrap', depth: 0 },
    { kind: 'transit', biome: 'scrap', depth: 0 },
    { kind: 'biome', biome: 'slums', depth: 1 },
    { kind: 'transit', biome: 'slums', depth: 1 },
    { kind: 'biome', biome: 'spire', depth: 2 },
    { kind: 'transit', biome: 'spire', depth: 2 },
    { kind: 'boss', biome: 'core', depth: 3 },
  ];

  // persistent meta progression
  G.meta = Object.assign({ cells: 0, unlocked: [], upgrades: {}, runs: 0, wins: 0, bestTime: null, kills: 0 }, G.store.get('meta', {}));
  G.saveMeta = () => G.store.set('meta', G.meta);

  // ---------------------------------------------------------------- exit door
  class ExitDoor extends G.WorldObject {
    constructor(x, y, opts = {}) {
      super(x, y, 24, 36);
      this.locked = !!opts.locked;
      this.interactable = !this.locked;
    }
    get prompt() { return this.locked ? 'Заблокировано' : 'Выйти'; }
    update(dt, world) {
      this.t += dt;
      if (this.locked && world.bossDefeated) { this.locked = false; this.interactable = true; world.fx.ring(this.cx, this.cy, 4, 40, PAL.cyan, 0.6, 2); }
    }
    interact(p, world) { if (!this.locked) G.game.nextStage(); }
    draw(ctx, cam) {
      const x = Math.round(this.x - cam.ox), y = Math.round(this.y - cam.oy);
      const c = this.locked ? PAL.red : PAL.cyan;
      G.px.rect(ctx, x - 3, y - 3, 30, 39, PAL.ink);
      G.px.rect(ctx, x - 2, y - 2, 28, 38, '#2b2a45');
      G.px.rect(ctx, x, y, 24, 36, '#0b0a14');
      // energy field
      for (let i = 0; i < 6; i++) {
        const yy = (Math.floor(this.t * 30) + i * 6) % 36;
        G.px.rect(ctx, x + 1, y + yy, 22, 1, this.locked ? '#5a1020' : '#0e5e70');
      }
      G.px.rect(ctx, x, y, 24, 1, c); G.px.rect(ctx, x, y, 1, 36, c); G.px.rect(ctx, x + 23, y, 1, 36, c);
      G.font.draw(ctx, this.locked ? 'LOCK' : 'EXIT', x + 12, y - 11, c, 1, 'center');
    }
    drawLight(ctx, cam) { G.drawGlow(ctx, this.cx - cam.ox, this.cy - cam.oy, 50, this.locked ? PAL.red : PAL.cyan, 0.45); }
  }
  G.OBJECTS.exit = (w, s) => new ExitDoor(s.x, s.y, s);
  G.OBJECTS.boss = (w, s) => {
    if (G.spawnBoss) G.spawnBoss(w, s.x, s.y);
    else { const e = G.spawnEnemy(w, 'grunt', s.x, s.y, { elite: true }); if (e) e.isBoss = true; }
    return null;
  };

  // ---------------------------------------------------------------- fallback level (used only if level.js is missing)
  class StubLevel extends G.TileMap {
    constructor(spec) {
      const R = new G.RNG(spec.seed);
      const kind = spec.kind;
      const w = kind === 'biome' ? 140 : kind === 'boss' ? 46 : 40, h = kind === 'biome' ? 34 : 20;
      super(w, h);
      this.biome = spec.biome;
      for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) if (x === 0 || x === w - 1 || y === 0 || y >= h - 3) this.set(x, y, G.T.SOLID);
      this.objects = []; this.enemySpawns = []; this.rooms = [];
      if (kind === 'biome') {
        for (let x = 8; x < w - 8; x += R.int(5, 9)) {
          const y = R.int(h - 10, h - 6);
          const len = R.int(3, 6);
          for (let i = 0; i < len; i++) this.set(x + i, y, R.chance(0.5) ? G.T.PLATFORM : G.T.SOLID);
          if (R.chance(0.25)) for (let yy = y - 5; yy < y; yy++) this.set(x + len + 2, yy, G.T.SOLID);
          if (R.chance(0.2)) for (let yy = y; yy < h - 3; yy++) this.set(x - 1, yy, G.T.LADDER);
          if (R.chance(0.15)) this.set(x + 2, h - 4, G.T.SPIKES);
        }
        for (let x = 20; x < w - 10; x += R.int(7, 12)) this.enemySpawns.push({ x: x * TS + 8, y: (h - 3) * TS, air: false });
        this.objects.push({ kind: 'scroll', x: 30 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'chest', x: 50 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'weapon', x: 12 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'food', x: 70 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'exit', x: (w - 4) * TS, y: (h - 3) * TS });
      } else if (kind === 'transit') {
        this.objects.push({ kind: 'healstation', x: 12 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'collector', x: 20 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'exit', x: (w - 4) * TS, y: (h - 3) * TS });
      } else {
        this.objects.push({ kind: 'boss', x: 30 * TS, y: (h - 3) * TS });
        this.objects.push({ kind: 'exit', x: (w - 3) * TS, y: (h - 3) * TS, locked: true });
      }
      this.spawn = { x: 4 * TS, y: (h - 3) * TS };
    }
    drawBackground(ctx, cam) { ctx.fillStyle = '#100c20'; ctx.fillRect(0, 0, G.W, G.H); }
  }

  // ---------------------------------------------------------------- World
  class World {
    constructor(spec, player) {
      this.spec = spec;
      this.depth = spec.depth;
      this.biome = spec.biome;
      this.kind = spec.kind;
      this.rng = new G.RNG((spec.seed ^ 0x5bd1e995) >>> 0);
      this.level = G.Level && G.Level.generate ? G.Level.generate(spec) : new StubLevel(spec);
      this.fx = new G.FX(this.level);
      this.cam = new G.Camera();
      this.enemies = []; this.projectiles = []; this.objects = []; this.allies = []; this.flashLights = [];
      this.time = 0; this.hitstopT = 0; this.glitch = 0; this.slowmo = 0;
      this.bossDefeated = false; this.boss = null;
      G.world = this;
      const sp = this.level.spawn;
      this.player = player;
      player.x = sp.x - player.w / 2; player.y = sp.y - player.h; player.vx = player.vy = 0;
      player.state = 'normal'; player.act = null; player.safe = { x: player.x, y: player.y };
      for (const s of player.scarf) { s.x = s.px = player.cx; s.y = s.py = player.y + 6; }
      this.cam.snap(player.cx, player.cy, this.level);
      for (const o of this.level.objects || []) this.spawnObject(o);
      const spawnR = this.rng.fork();
      for (const s of this.level.enemySpawns || []) {
        const type = G.pickEnemy(this.biome, this.depth, spawnR, s);
        if (!type) continue;
        const elite = this.kind === 'biome' && spawnR.chance(0.05 + 0.03 * this.depth);
        G.spawnEnemy(this, type, s.x, s.y, { elite, spawn: s });
      }
    }
    spawnObject(spec) {
      const f = G.OBJECTS[spec.kind];
      if (!f) return null;
      const o = f(this, spec);
      if (o) { o.mapKind = spec.kind; this.objects.push(o); }
      return o;
    }
    addObject(o) { this.objects.push(o); return o; }
    addProjectile(p) { this.projectiles.push(p); return p; }
    spawnEnemy(type, x, y, opts) { return G.spawnEnemy(this, type, x, y, opts); }
    dropCurrency(x, y, cells, gold) {
      for (let i = 0; i < cells; i++) this.objects.push(new G.Currency(x, y, 'cells', 1));
      let g = gold;
      while (g > 0) { const v = g > 30 ? 10 : g > 8 ? 3 : 1; g -= v; this.objects.push(new G.Currency(x, y, 'gold', v)); }
    }
    enemiesInBox(box) { return this.enemies.filter((e) => !e.dead && !e.dying && G.overlap(box, e)); }
    hitstop(t) { this.hitstopT = Math.max(this.hitstopT, t); }
    shake(m, t) { this.cam.shake(m, t); }

    update(dt) {
      if (this.glitch > 0) this.glitch = Math.max(0, this.glitch - dt * 2);
      if (this.hitstopT > 0) { this.hitstopT -= dt; this.cam.shakeT = Math.max(0, this.cam.shakeT - dt); return; }
      this.time += dt;
      const p = this.player;
      p.update(dt, this);
      for (const e of this.enemies) e.update(dt, this);
      for (const a of this.allies) a.update(dt, this);
      for (const pr of this.projectiles) pr.update(dt, this);
      for (const o of this.objects) o.update(dt, this);
      this.fx.update(dt);
      this.level.update(dt, this);
      for (const f of this.flashLights) f.t += dt;
      this.flashLights = this.flashLights.filter((f) => f.t < f.life);
      this.enemies = this.enemies.filter((e) => !e.dead);
      this.allies = this.allies.filter((e) => !e.dead);
      this.projectiles = this.projectiles.filter((e) => !e.dead);
      this.objects = this.objects.filter((e) => !e.dead);
      this.cam.follow(p, this.level, dt);
      // music intensity follows nearby aggro enemies
      if (G.audio && G.audio.intensity) {
        let n = 0;
        for (const e of this.enemies) if (e.aggro && !e.dying && G.dist(e.cx, e.cy, p.cx, p.cy) < 260) n++;
        this._int = G.lerp(this._int || 0, Math.min(1, n / 3 + (this.boss ? 1 : 0)), dt * 1.5);
        G.audio.intensity(this._int);
      }
    }

    draw(ctx) {
      const cam = this.cam;
      cam.beginFrame();
      G.lights.length = 0;
      ctx.fillStyle = PAL.bg0; ctx.fillRect(0, 0, G.W, G.H);
      this.level.drawBackground(ctx, cam);
      this.fx.drawDecals(ctx, cam);
      this.level.drawTiles(ctx, cam);
      const vis = (e) => cam.visible(e.x, e.y, e.w || 8, e.h || 8, 48);
      for (const o of this.objects) if (vis(o)) o.draw(ctx, cam);
      for (const e of this.enemies) if (vis(e)) e.draw(ctx, cam);
      for (const a of this.allies) if (vis(a)) a.draw(ctx, cam);
      this.player.draw(ctx, cam);
      for (const pr of this.projectiles) pr.draw(ctx, cam);
      this.fx.draw(ctx, cam);
      this.level.drawForeground(ctx, cam);
      // additive light pass
      ctx.globalCompositeOperation = 'lighter';
      this.level.drawLights(ctx, cam);
      for (const o of this.objects) if (o.drawLight && vis(o)) o.drawLight(ctx, cam);
      for (const e of this.enemies) if (e.drawLight && vis(e)) e.drawLight(ctx, cam);
      for (const a of this.allies) if (a.drawLight && vis(a)) a.drawLight(ctx, cam);
      for (const pr of this.projectiles) if (pr.drawLight) pr.drawLight(ctx, cam);
      this.player.drawLight(ctx, cam);
      const L = G.lights;
      for (let i = 0; i < L.length; i += 5) G.drawGlow(ctx, L[i] - cam.ox, L[i + 1] - cam.oy, L[i + 2], L[i + 3], L[i + 4]);
      for (const f of this.flashLights) G.drawGlow(ctx, f.x - cam.ox, f.y - cam.oy, f.r, f.color, 1 - f.t / f.life);
      this.fx.drawAdditive(ctx, cam);
      ctx.globalCompositeOperation = 'source-over';
      // overlays that must stay readable
      for (const e of this.enemies) if (e.drawOverlayTop && vis(e)) e.drawOverlayTop(ctx, cam);
      this.fx.drawTexts(ctx, cam);
    }
  }
  G.World = World;

  // ---------------------------------------------------------------- Game (state machine + loop)
  const game = {
    state: 'boot',        // boot | title | play | dead | victory
    paused: false,
    stage: 0,
    runTime: 0,
    seed: 0,
    world: null,
    player: null,
    fade: 0, fadeDir: 0, fadeCb: null,
    stats: null,

    init() {
      this.canvas = document.getElementById('game');
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.ctx.imageSmoothingEnabled = false;
      G.bindMouse(this.canvas);
      this.buildVignette();
      if (G.ui && G.ui.init) G.ui.init();
      if (G.hud && G.hud.init) G.hud.init();
      if (G.touch && G.touch.init) G.touch.init();
      window.addEventListener('resize', () => this.resize());
      document.addEventListener('visibilitychange', () => { if (document.hidden && this.state === 'play' && !this.paused) this.togglePause(true); });
      this.resize();
      const unlockAudio = () => { if (G.audio) G.audio.init(); };
      window.addEventListener('pointerdown', unlockAudio, { capture: true });
      window.addEventListener('keydown', unlockAudio, { capture: true });
      window.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
      // test hook: advance N frames synchronously
      G.advance = (n) => { for (let i = 0; i < n; i++) { G.input.poll(); this.step(G.DT); G.input.endStep(); } this.render(G.DT); };
      if (G.params.has('play')) this.newRun();
      else this.toTitle();
      let last = performance.now(), acc = 0;
      const frame = (now) => {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now; acc += dt;
        let steps = 0;
        if (G.params.has('manual')) acc = 0; // tests drive the simulation via G.advance()
        while (acc >= G.DT && steps < 6) { G.input.poll(); this.step(G.DT); G.input.endStep(); acc -= G.DT; steps++; }
        if (steps >= 6) acc = 0;
        this.render(dt);
        this._fpsAcc = (this._fpsAcc || 0) * 0.95 + (1 / Math.max(dt, 0.001)) * 0.05;
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    },

    resize() {
      const stage = document.getElementById('stage');
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / G.W, vh / G.H);
      const w = Math.floor(G.W * s), h = Math.floor(G.H * s);
      stage.style.width = w + 'px'; stage.style.height = h + 'px';
      document.documentElement.style.setProperty('--s', (w / G.W).toFixed(4));
    },

    buildVignette() {
      const c = document.createElement('canvas');
      c.width = G.W; c.height = G.H;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(G.W / 2, G.H * 0.55, G.H * 0.35, G.W / 2, G.H / 2, G.W * 0.62);
      grd.addColorStop(0, 'rgba(5,3,12,0)');
      grd.addColorStop(1, 'rgba(5,3,12,0.72)');
      g.fillStyle = grd; g.fillRect(0, 0, G.W, G.H);
      this.vignette = c;
    },

    toTitle() {
      this.state = 'title';
      this.world = null;
      if (G.hud) G.hud.show(false);
      if (G.audio) G.audio.music('title');
      if (G.ui && G.ui.showTitle) G.ui.showTitle(() => this.newRun());
      else this.newRun();
    },

    newRun(seed) {
      const ps = parseInt(G.params.get('seed'), 10);
      this.seed = seed || (Number.isFinite(ps) ? ps : Math.floor(Math.random() * 900000) + 100000);
      this.runRng = new G.RNG(this.seed);
      this.stage = 0;
      const bp = G.params.get('biome'), kp = G.params.get('kind');
      if (bp || kp) {
        let idx = G.RUN.findIndex((r) => (!bp || r.biome === bp) && (!kp || r.kind === kp));
        if (idx < 0 && kp) idx = G.RUN.findIndex((r) => r.kind === kp);
        if (idx >= 0) this.stage = idx;
      }
      this.runTime = 0;
      this.stats = { kills: 0, cellsTotal: 0, goldTotal: 0, dmgDealt: 0, dmgTaken: 0, scrolls: 0 };
      const p = new G.Player(0, 0);
      this.player = p;
      G.startingLoadout(p, this.runRng);
      const wp = G.params.get('weapon');
      if (wp && G.ITEMS[wp]) p.equip(G.makeItem(wp, 0), G.ITEMS[wp].kind === 'skill' ? 'skill1' : 'primary');
      for (const u of G.META_UPGRADES || []) { const lvl = (G.meta.upgrades || {})[u.id] || 0; if (lvl && u.apply) u.apply(p, lvl); }
      G.meta.runs++; G.saveMeta();
      if (G.ui && G.ui.hideAll) G.ui.hideAll();
      this.state = 'play'; this.paused = false;
      this.loadStage(this.stage);
      G.emit('runStart', { seed: this.seed });
    },

    loadStage(i) {
      const spec = Object.assign({}, G.RUN[i]);
      spec.seed = (this.seed * 31 + i * 7919) >>> 0;
      this.world = new World(spec, this.player);
      this.fade = 1; this.fadeDir = -1;
      if (G.hud) { G.hud.show(true); if (G.hud.onLevel) G.hud.onLevel(this.world); }
      const biome = G.BIOMES && G.BIOMES[spec.biome];
      if (G.audio) G.audio.music(spec.kind === 'transit' ? 'transit' : spec.kind === 'boss' ? 'boss' : (biome && biome.music) || spec.biome);
      if (G.audio) G.audio.play(spec.kind === 'transit' ? 'transit' : 'levelStart');
      const name = spec.kind === 'transit' ? 'Шлюз' : (biome ? biome.name : spec.biome);
      const sub = spec.kind === 'transit' ? 'Безопасная зона' : spec.kind === 'boss' ? 'Финальная схватка' : 'Сектор ' + (spec.depth + 1);
      if (G.ui && G.ui.banner) G.ui.banner(name, sub);
      G.emit('levelStart', { world: this.world, spec });
    },

    nextStage() {
      if (this.fadeDir === 1) return;
      this.fadeDir = 1;
      if (G.audio) G.audio.play('door');
      this.fadeCb = () => {
        this.stage++;
        if (this.stage >= G.RUN.length) this.victory();
        else this.loadStage(this.stage);
      };
    },

    victory() {
      this.state = 'victory';
      G.meta.wins++;
      if (!G.meta.bestTime || this.runTime < G.meta.bestTime) G.meta.bestTime = this.runTime;
      G.meta.kills += this.stats.kills;
      G.saveMeta();
      if (G.audio) { G.audio.music(null); G.audio.play('victory'); }
      if (G.hud) G.hud.show(false);
      G.emit('runEnd', { win: true });
      if (G.ui && G.ui.showVictory) G.ui.showVictory(this.summary(), () => this.toTitle());
    },

    onPlayerDeath() {
      this.state = 'dead';
      G.meta.kills += this.stats.kills;
      G.saveMeta();
      if (G.audio) G.audio.music(null);
      G.emit('runEnd', { win: false });
      if (G.ui && G.ui.showDeath) G.ui.showDeath(this.summary(), () => this.newRun(), () => this.toTitle());
    },

    summary() {
      const p = this.player;
      const biome = G.BIOMES && G.BIOMES[G.RUN[Math.min(this.stage, G.RUN.length - 1)].biome];
      return Object.assign({}, this.stats, {
        time: this.runTime, seed: this.seed, stage: this.stage, stageName: biome ? biome.name : '',
        cells: p.cells, gold: p.gold, stats: Object.assign({}, p.stats), slots: p.slots,
      });
    },

    togglePause(force) {
      if (this.state !== 'play') return;
      this.paused = force != null ? force : !this.paused;
      if (G.ui && G.ui.showPause) {
        if (this.paused) G.ui.showPause(() => this.togglePause(false), () => this.toTitle());
        else if (G.ui.hidePause) G.ui.hidePause();
      }
    },

    step(dt) {
      if (G.ui && G.ui.update) G.ui.update(dt);
      if (this.state !== 'play' || !this.world) return;
      if (G.input.pressed('pause') && !(G.ui && G.ui.isModalOpen && G.ui.isModalOpen())) { this.togglePause(); return; }
      const modal = G.ui && G.ui.isModalOpen && G.ui.isModalOpen();
      if (this.paused || modal) return;
      if (this.fadeDir === 1) {
        this.fade = Math.min(1, this.fade + dt * 3);
        if (this.fade >= 1) { this.fadeDir = 0; const cb = this.fadeCb; this.fadeCb = null; if (cb) cb(); }
        return;
      }
      if (this.fadeDir === -1) { this.fade = Math.max(0, this.fade - dt * 2.5); if (this.fade <= 0) this.fadeDir = 0; }
      this.runTime += dt;
      this.world.update(dt);
      const p = this.player;
      if (p.state === 'dead' && p.deadT > 1.6 && this.state === 'play') this.onPlayerDeath();
    },

    render(dt) {
      const ctx = this.ctx;
      if (!this.world) {
        if (G.ui && G.ui.drawBackdrop) G.ui.drawBackdrop(ctx, dt);
        else { ctx.fillStyle = PAL.bg0; ctx.fillRect(0, 0, G.W, G.H); }
        return;
      }
      this.world.draw(ctx);
      ctx.drawImage(this.vignette, 0, 0);
      const fx = this.world.fx;
      if (fx.flashT > 0) { ctx.globalAlpha = Math.min(0.35, fx.flashT * 3); ctx.fillStyle = fx.flashColor; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
      const p = this.player;
      if (p && p.hp < p.maxHp * 0.25 && p.state !== 'dead') {
        ctx.globalAlpha = 0.12 + Math.sin(this.world.time * 6) * 0.06; ctx.fillStyle = PAL.red;
        ctx.fillRect(0, 0, G.W, 3); ctx.fillRect(0, G.H - 3, G.W, 3); ctx.fillRect(0, 0, 3, G.H); ctx.fillRect(G.W - 3, 0, 3, G.H);
        ctx.globalAlpha = 1;
      }
      if (this.world.glitch > 0) this.glitchFx(ctx, this.world.glitch);
      if (this.fade > 0) { ctx.globalAlpha = this.fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
      if (G.hud && G.hud.update) G.hud.update(this.world, dt);
      if (G.debug.fps) G.font.draw(ctx, Math.round(this._fpsAcc || 0) + ' FPS', 4, 4, PAL.lime);
    },

    glitchFx(ctx, k) {
      const n = Math.ceil(k * 6);
      for (let i = 0; i < n; i++) {
        const y = G.rand.int(0, G.H - 8), h = G.rand.int(2, 10), dx = G.rand.int(-8, 8) * k;
        ctx.drawImage(this.canvas, 0, y, G.W, h, dx, y, G.W, h);
      }
      ctx.globalAlpha = 0.18 * k; ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(this.canvas, 2 * k, 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    },
  };
  G.game = game;

  // run stats
  G.on('enemyKilled', () => { if (game.stats) game.stats.kills++; if (game.player) game.player.kills++; });
  G.on('enemyHit', (e) => { if (game.stats) game.stats.dmgDealt += e.dmg || 0; });
  G.on('playerHurt', (e) => { if (game.stats) game.stats.dmgTaken += e.dmg || 0; });
  G.on('pickup', (e) => { if (!game.stats) return; if (e.kind === 'cells') game.stats.cellsTotal += e.value; if (e.kind === 'gold') game.stats.goldTotal += e.value; });
  G.on('scroll', () => { if (game.stats) game.stats.scrolls++; });
  G.on('bossDefeated', () => { if (game.world) game.world.bossDefeated = true; });

  window.addEventListener('load', () => game.init());
})();

</script>
</body>
</html>
