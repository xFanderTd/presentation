    const lvl = G.meta.upgrades[id] || 0;
    if (lvl >= u.cost.length) return false;
    const cost = u.cost[lvl];
    if (p.cells < cost) { snd('denied'); return false; }
    p.cells -= cost;
    G.meta.upgrades[id] = lvl + 1;
    G.saveMeta();
    if (u.now) u.now(p, lvl + 1);
    snd('shopBuy');
    G.emit('upgrade', { id, def: u, lvl: lvl + 1, cost });
    return true;
  };

  // ================================================================ mutations («Импланты»)
  // def: {id, name, desc, stat, icon(ctx,size), hooks: update(p,dt,world), onIncoming(p,amount,info)->amount,
  //       onDealDamage(p,dealt,target,inst), onRollEnd(p,world), onKill(p,enemy,world), hpMul, dmgMod(p,inst,t),
  //       critChance(p,inst,t), onAdd(p), onRemove(p), onLevel(p,world)}
  // p.mutations holds per-player instances (Object.create(def)) so hooks can keep state on `this`.
  const bestStat = (p) => Math.max(p.statMul('brutality'), p.statMul('tactics'), p.statMul('survival'));
  G.MUTATIONS = [
    {
      id: 'adrenaline', name: 'Адреналин', stat: 'brutality', desc: 'Каждое убийство восстанавливает 5% здоровья.',
      onKill(p, e, world) { const h = p.heal(p.maxHp * 0.05); if (h > 0 && world) world.fx.label(p.cx, p.y - 12, '+' + Math.round(h), PAL.green, 0.6); },
      icon: icon((I) => { I.disc(12, 13, 8, '#8a1020'); I.disc(10, 11, 3, '#ff3348'); I.poly([[3, 13], [7, 13], [9, 9], [12, 18], [15, 8], [17, 13], [21, 13]], '#ffffff'); }),
    },
    {
      id: 'kinetic', name: 'Кинетический отскок', stat: 'tactics', desc: 'В конце кувырка остаётся шоковая мина (не чаще раза в 1.5 с).',
      onRollEnd(p, world) {
        if (world.time < (this.nextT || 0)) return;
        this.nextT = world.time + 1.5;
        world.addObject(new G.ShockMine(p.cx - p.facing * 4, p.bottom, { dmg: Math.round(12 * bestStat(p)) }));
      },
      icon: icon((I) => { I.rect(4, 15, 16, 5, '#2b2a45'); I.rect(7, 13, 10, 2, '#45466a'); I.rect(10, 16, 4, 2, '#27f3ff'); I.poly([[6, 11], [9, 5], [12, 9], [16, 3], [19, 8]], '#27f3ff'); I.dot(19, 8, '#ffffff'); }),
    },
    {
      id: 'berserk', name: 'Берсерк', stat: 'brutality', desc: '+40% урона, пока здоровье ниже 50%.',
      dmgMod: (p) => (p.hp < p.maxHp * 0.5 ? 1.4 : 1),
      update(p, dt, world) { if (p.hp < p.maxHp * 0.5 && G.rand.chance(dt * 8)) world.fx.particle({ x: p.x + G.rand.float(0, p.w), y: p.y + G.rand.float(0, p.h), vy: -40, life: 0.4, color: PAL.red, additive: true, glow: 4 }); },
      icon: icon((I) => { I.disc(12, 12, 8, '#3a0d18'); I.poly([[5, 8], [10, 11], [5, 14]], '#ff3348'); I.poly([[19, 8], [14, 11], [19, 14]], '#ff3348'); I.rect(8, 16, 8, 2, '#ff3348'); I.rect(9, 16, 1, 1, '#ffffff'); I.rect(14, 16, 1, 1, '#ffffff'); }),
    },
    {
      id: 'armor', name: 'Броня', stat: 'survival', desc: 'Получаемый урон снижен на 15%.',
      onIncoming: (p, a) => a * 0.85,
      icon: icon((I) => { I.rect(5, 4, 14, 10, '#45466a'); I.rect(6, 14, 12, 3, '#45466a'); I.rect(8, 17, 8, 2, '#45466a'); I.rect(10, 19, 4, 2, '#45466a'); I.rect(6, 5, 12, 1, '#aab0d6'); I.rect(11, 5, 2, 14, '#4dff7a'); }),
    },
    {
      id: 'economy', name: 'Экономия', stat: 'tactics', desc: 'Навыки перезаряжаются на 25% быстрее.',
      onAdd(p) { p.cdMul = (p.cdMul || 1) * 0.75; }, onRemove(p) { p.cdMul = (p.cdMul || 1) / 0.75; },
      icon: icon((I) => { I.ring(12, 12, 8, '#b46cff', 2); I.line(12, 12, 12, 6, '#ffffff', 1); I.line(12, 12, 16, 14, '#ffffff', 1); I.poly([[19, 3], [21, 7], [17, 7]], '#b46cff'); }),
    },
    {
      id: 'greed', name: 'Жадность', stat: 'tactics', desc: '+50% кредитов.',
      onAdd(p) { p.goldMul = (p.goldMul || 1) * 1.5; }, onRemove(p) { p.goldMul = (p.goldMul || 1) / 1.5; },
      icon: icon((I) => { I.disc(9, 14, 6, '#8a5a12'); I.disc(9, 13, 5, '#ffc23d'); I.disc(15, 9, 6, '#8a5a12'); I.disc(15, 8, 5, '#ffc23d'); I.rect(14, 5, 2, 7, '#fff2b0'); I.rect(8, 11, 2, 5, '#fff2b0'); }),
    },
    {
      id: 'secondChance', name: 'Второй шанс', stat: 'survival', desc: 'Раз за уровень смертельный удар оставляет 1 ОЗ и даёт 2 с неуязвимости.',
      onIncoming(p, amount) {
        if (this.used || amount < p.hp || G.debug.god) return amount;
        this.used = true;
        p.invuln = Math.max(p.invuln, 2);
        const w = G.world;
        if (w) {
          w.fx.ring(p.cx, p.cy, 4, 40, PAL.survival, 0.5, 2); w.fx.flash(PAL.survival, 0.12);
          w.fx.label(p.cx, p.y - 16, 'SECOND CHANCE', PAL.survival, 1.2); w.hitstop(0.15);
        }
        snd('parry', { pitch: 0.7 });
        p.hp = Math.min(p.hp, 1);
        return 0;
      },
      onLevel() { this.used = false; },
      icon: icon((I) => { I.rect(10, 3, 4, 18, '#4dff7a'); I.rect(4, 9, 16, 4, '#4dff7a'); I.rect(11, 4, 2, 16, '#c8ffd8'); I.ring(12, 12, 10, '#1f8a44'); }),
    },
    {
      id: 'acrobat', name: 'Акробат', stat: 'tactics', desc: 'Ещё один прыжок в воздухе, кувырок длиннее на 15%.',
      onAdd(p) { p.airJumps = (p.airJumps || 1) + 1; p.rollMul = (p.rollMul || 1) * 1.15; },
      onRemove(p) { p.airJumps = Math.max(1, (p.airJumps || 2) - 1); p.rollMul = (p.rollMul || 1) / 1.15; },
      icon: icon((I) => { I.poly([[4, 20], [8, 12], [12, 8], [16, 10], [20, 4]], '#b46cff'); I.ring(8, 16, 2, '#27f3ff'); I.ring(16, 8, 2, '#27f3ff'); I.dot(20, 4, '#ffffff'); }),
    },
    {
      id: 'titan', name: 'Титановый каркас', stat: 'survival', desc: '+25% максимального здоровья.',
      hpMul: 1.25,
      icon: icon((I) => { I.rect(7, 3, 10, 18, '#6f7299'); I.rect(8, 4, 8, 16, '#aab0d6'); for (let y = 6; y < 20; y += 4) I.rect(5, y, 14, 2, '#45466a'); I.rect(11, 3, 2, 18, '#4dff7a'); }),
    },
    {
      id: 'combo', name: 'Комбо-процессор', stat: 'brutality', desc: 'Каждое попадание подряд даёт +4% урона (до +40%). Сбрасывается через 1.5 с без попаданий.',
      onDealDamage(p, dealt) { if (dealt > 0) { this.stacks = Math.min(10, (this.stacks || 0) + 1); this.idle = 0; } },
      update(p, dt) { this.idle = (this.idle || 0) + dt; if (this.idle > 1.5) this.stacks = 0; },
      dmgMod() { return 1 + 0.04 * (this.stacks || 0); },
      icon: icon((I) => { for (let i = 0; i < 4; i++) I.rect(4 + i * 4, 18 - i * 4, 3, 3 + i * 4, i === 3 ? '#ffffff' : '#ff3d4f'); I.poly([[3, 6], [9, 4], [7, 9]], '#ffe14d'); }),
    },
    {
      id: 'detonator', name: 'Детонатор', stat: 'brutality', desc: 'Убитые враги взрываются, раня соседей.',
      onKill(p, e, world) {
        if (!world || !e) return;
        const hits = G.explode(world, e.cx, e.cy, { radius: 34, dmg: Math.round(10 * bestStat(p)), color: PAL.orange, info: { kb: 120, kbUp: 100, stun: 0.3 } });
        for (const h of hits) p.onDealDamage(h.lastDealt || 0, h, null);
      },
      icon: icon((I) => { I.disc(12, 13, 7, '#b34a12'); I.disc(12, 13, 4, '#ffe14d'); I.disc(12, 13, 2, '#ffffff'); for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; I.line(12 + Math.cos(a) * 8, 13 + Math.sin(a) * 8, 12 + Math.cos(a) * 11, 13 + Math.sin(a) * 11, '#ff8a2a', 1); } }),
    },
    {
      id: 'coolant', name: 'Хладагент', stat: 'tactics', desc: 'Каждое убийство сокращает перезарядку навыков на 1 с.',
      onKill(p) { for (const s of ['skill1', 'skill2']) { const it = p.slots[s]; if (it && it.cd > 0) it.cd = Math.max(0, it.cd - 1); } },
      icon: icon((I) => { I.line(12, 2, 12, 22, '#9fe8ff', 1); I.line(3, 7, 21, 17, '#9fe8ff', 1); I.line(3, 17, 21, 7, '#9fe8ff', 1); I.disc(12, 12, 3, '#3f8fc8'); I.dot(12, 12, '#ffffff'); for (const [x, y] of [[12, 4], [12, 20], [5, 8], [19, 16], [5, 16], [19, 8]]) I.dot(x, y, '#ffffff'); }),
    },
    {
      id: 'static', name: 'Статический заряд', stat: 'survival', desc: 'Удары ближнего боя с шансом 25% бьют током (+25% получаемого урона).',
      onDealDamage(p, dealt, target, inst) { if (inst && inst.def.kind === 'melee' && target && !target.dead && G.rand.chance(0.25)) target.applyStatus('shock', 2.5, 1); },
      icon: icon((I) => { I.rect(5, 16, 14, 4, '#45466a'); I.poly([[14, 2], [9, 10], [14, 10], [9, 18]], '#27f3ff'); I.poly([[15, 2], [10, 10]], '#ffffff'); I.dot(4, 6, '#27f3ff'); I.dot(20, 9, '#27f3ff'); }),
    },
    {
      id: 'nanoshield', name: 'Нанощит', stat: 'survival', desc: 'Раз в 12 с полностью поглощает один удар.',
      update(p, dt, world) {
        this.cd = Math.max(0, (this.cd || 0) - dt);
        if (this.cd <= 0 && world && G.rand.chance(dt * 6)) { const a = G.rand.float(0, TAU); world.fx.particle({ x: p.cx + Math.cos(a) * 12, y: p.cy + Math.sin(a) * 14, life: 0.3, color: PAL.cyan, additive: true }); }
      },
      onIncoming(p, amount) {
        if ((this.cd || 0) > 0 || amount <= 0) return amount;
        this.cd = 12;
        const w = G.world;
        if (w) { w.fx.ring(p.cx, p.cy, 6, 18, PAL.cyan, 0.3, 2); w.fx.label(p.cx, p.y - 12, 'ABSORB', PAL.cyan, 0.6); }
        snd('shield', { pitch: 1.4 });
        p.invuln = Math.max(p.invuln, 0.5);
        return 0;
      },
      icon: icon((I) => { for (let y = 3; y <= 21; y++) { const hw = y < 8 ? Math.round((y - 3) * 1.6) : y < 16 ? 8 : Math.round((21 - y) * 1.6); I.dot(12 - hw, y, '#27f3ff'); I.dot(12 + hw, y, '#27f3ff'); } I.rect(10, 8, 5, 8, '#0e8fa6'); I.rect(11, 9, 3, 6, '#9ffcff'); }),
    },
    {
      id: 'marksman', name: 'Снайперский модуль', stat: 'tactics', desc: '+20% шанса крита для оружия дальнего боя.',
      critChance: (p, inst) => (inst && inst.def.kind === 'ranged' ? 0.2 : 0),
      icon: icon((I) => { I.ring(12, 12, 8, '#b46cff', 1); I.ring(12, 12, 4, '#b46cff', 1); I.line(12, 1, 12, 23, '#ffffff', 1); I.line(1, 12, 23, 12, '#ffffff', 1); I.rect(11, 11, 3, 3, '#ff3348'); }),
    },
  ];
  const MUT_BY_ID = {};
  for (const m of G.MUTATIONS) MUT_BY_ID[m.id] = m;
  G.mutationById = (id) => MUT_BY_ID[id];

  const mutIconCache = new Map();
  G.mutationIcon = function (def, size = 24) {
    def = def.def || def;
    const key = def.id + '|' + size;
    let c = mutIconCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = size;
    try { if (def.icon) def.icon(c.getContext('2d'), size); G.outlineCanvas(c); } catch (e) { console.error('[mutation icon ' + def.id + ']', e); }
    mutIconCache.set(key, c);
    return c;
  };
  G.MAX_MUTATIONS = 3;
  // 3 random mutation defs the player doesn't own yet
  G.offerMutations = function (rng = G.rand, player, n = 3) {
    const owned = new Set((player && player.mutations ? player.mutations : []).map((m) => m.id));
    const pool = G.MUTATIONS.filter((m) => !owned.has(m.id));
    return rng.shuffle(pool.slice()).slice(0, n);
  };
  // adds a mutation (max 3). replaceIndex: slot to overwrite when full. Returns the new instance or null.
  G.addMutation = function (p, def, replaceIndex) {
    def = def && def.def ? def.def : def;
    if (!p || !def || p.mutations.some((m) => m.id === def.id)) return null;
    if (p.mutations.length >= G.MAX_MUTATIONS) {
      if (replaceIndex == null || !p.mutations[replaceIndex]) return null;
      G.removeMutation(p, replaceIndex);
    }
    const m = Object.create(def);
    m.def = def;
    if (replaceIndex != null && replaceIndex <= p.mutations.length) p.mutations.splice(replaceIndex, 0, m); else p.mutations.push(m);
    if (m.onAdd) m.onAdd(p);
    p.recalc(false);
    const w = G.world;
    if (w) {
      w.fx.ring(p.cx, p.cy, 4, 34, G.STAT_COLOR[def.stat] || PAL.cyan, 0.5, 2);
      w.fx.burst(p.cx, p.cy, 24, { speed: 110, life: 0.8, color: [G.STAT_COLOR[def.stat] || PAL.cyan, '#ffffff'], grav: -60, additive: true });
    }
    snd('scroll', { pitch: 1.2 });
    G.emit('mutation', def);
    return m;
  };
  G.removeMutation = function (p, index) {
    const m = p.mutations[index];
    if (!m) return null;
    p.mutations.splice(index, 1);
    if (m.onRemove) m.onRemove(p);
    p.recalc(false);
    return m;
  };
  // mutation-driven crit chance (read by G.rollCrit through p.critChance getter-free path)
  const baseRollCrit = G.rollCrit;
  G.rollCrit = function (p, inst, target, cond) {
    if (cond) return true;
    if (p && p.mutations) {
      let extra = 0;
      for (const m of p.mutations) if (m.critChance) extra += typeof m.critChance === 'function' ? m.critChance(p, inst, target) || 0 : m.critChance;
      if (extra > 0 && G.rand.chance(extra)) return true;
    }
    return baseRollCrit(p, inst, target, false);
  };

  // hooks driven by events
  G.on('enemyKilled', (e) => {
    const w = G.world, p = w && w.player;
    if (!p || p.state === 'dead' || !p.mutations) return;
    for (const m of p.mutations) if (m.onKill) { try { m.onKill(p, e && e.enemy, w); } catch (err) { console.error('[mutation onKill]', err); } }
  });
  G.on('levelStart', (e) => {
    const w = (e && e.world) || G.world, p = w && w.player;
    if (!p) return;
    for (const m of p.mutations || []) if (m.onLevel) m.onLevel(p, w);
    // «Банковский вклад»: interest on carried credits
    if (p.interest && p.gold > 0) {
      const gain = Math.min(100, Math.round(p.gold * p.interest));
      if (gain > 0) { p.gold += gain; if (w.fx) w.fx.label(p.cx, p.y - 14, '+' + gain + '$', PAL.gold, 1.5); }
    }
    // re-attach the overload aura if a buff carried over from the previous level
    if (p.overloadUntil && G.game && p.overloadUntil > G.game.runTime && G.Effect) {
      // aura is purely cosmetic; skip re-creating to keep it simple
    }
  });

  // ================================================================ object factories
  G.OBJECTS.chest = (w, s) => new Chest(s.x, floorY(w, s.x, s.y), s);
  G.OBJECTS.scroll = (w, s) => new Scroll(s.x, floorY(w, s.x, s.y), s);
  G.OBJECTS.food = (w, s) => new Food(s.x, floorY(w, s.x, s.y), { type: s.type || w.rng.pick(['noodles', 'noodles', 'burger', 'stim']) });
  G.OBJECTS.weapon = (w, s) => { const inst = G.rollLoot(w, w.rng, s.itemKind); return inst ? new ItemDrop(s.x, s.y, inst) : null; };
  G.OBJECTS.healstation = (w, s) => new HealStation(s.x, floorY(w, s.x, s.y));
  G.OBJECTS.collector = (w, s) => new Collector(s.x, floorY(w, s.x, s.y));
  G.OBJECTS.shop = (w, s) => makeShop(w, s);
})();

</script>
<script>/* js/player.js */
'use strict';
// The player: "Сбой" — a nanite swarm wearing a scrapped combat chassis.
// Movement (run, jump, double jump, roll, ledge climb, ladders, slam), item use, healing,
// recovery ("rally") HP, and a procedural skeletal pixel-art renderer.
(function () {
  const G = window.G;
  const PAL = G.PAL, TS = G.TILE;

  const RUN = 138, JUMP_V = 340, DJUMP_V = 305, ROLL_V = 255, ROLL_T = 0.32, ROLL_IFRAMES = 0.27;
  const SLOT_BUTTONS = [['primary', 'attack1'], ['secondary', 'attack2'], ['skill1', 'skill1'], ['skill2', 'skill2']];
  G.SLOT_BUTTONS = SLOT_BUTTONS;

  const COL = {
    outline: '#07050d', legB: '#1a1729', leg: '#27233d', boot: '#121019', coat: '#3a2352', coatB: '#2a1a3c',
    trim: PAL.magenta, arm: '#322e4f', armB: '#221f36', hand: '#8d95c4', scarf: PAL.magenta, scarf2: '#b3125f',
  };

  class Player extends G.Actor {
    constructor(x, y) {
      super(x - 5, y - 22, 10, 22);
      this.team = 'player';
      this.stats = { brutality: 1, tactics: 1, survival: 1 };
      this.baseHp = 100;
      this.maxHp = this.hp = 100;
      this.flasks = 2; this.maxFlasks = 2; this.flaskHeal = 0.5;
      this.cells = 0; this.gold = 0; this.kills = 0;
      this.slots = { primary: null, secondary: null, skill1: null, skill2: null };
      this.mutations = [];
      this.state = 'normal'; this.stateT = 0;
      this.airJumps = 1; this.jumpsUsed = 0; this.coyote = 0; this.jumpBuf = 0;
      this.rollT = 0; this.rollCd = 0; this.landLag = 0;
      this.act = null; this.buffer = null;
      this.recoverable = 0; this.recoverT = 0;
      this.healT = 0; this.healRate = 0;
      this.cdMul = 1; this.dmgMul = 1;
      this.runPhase = 0; this.idleT = 0;
      this.ledge = null; this.ladderX = 0; this.climbPhase = 0;
      this.safe = { x: this.x, y: this.y }; this.safeT = 0;
      this.ghosts = []; this.ghostT = 0;
      this.scarf = [];
      for (let i = 0; i < 6; i++) this.scarf.push({ x: this.cx, y: this.y + 6, px: this.cx, py: this.y + 6 });
      this.focus = null;
      this.deadT = 0;
      this.recalc(true);
    }

    // ------------------------------------------------------------ stats
    statMul(stat) {
      if (!stat) return 1;
      if (Array.isArray(stat)) return Math.max(...stat.map((s) => this.statMul(s)));
      return Math.pow(1.14, (this.stats[stat] || 1) - 1);
    }
    recalc(fill) {
      const s = this.stats;
      const old = this.maxHp;
      let hp = this.baseHp + 14 * (s.brutality - 1) + 14 * (s.tactics - 1) + 32 * (s.survival - 1);
      for (const m of this.mutations) if (m.hpMul) hp *= m.hpMul;
      this.maxHp = Math.round(hp * (this.hpMul || 1));
      if (fill) this.hp = this.maxHp;
      else if (this.maxHp > old) this.hp += this.maxHp - old;
      this.hp = Math.min(this.hp, this.maxHp);
    }
    addStat(stat) {
      this.stats[stat] = (this.stats[stat] || 1) + 1;
      this.recalc(false);
      this.hp = this.maxHp; // scrolls fully heal (like Dead Cells)
    }

    // ------------------------------------------------------------ inventory
    slotFor(inst) {
      const k = inst.def.kind;
      if (k === 'skill') {
        if (!this.slots.skill1) return 'skill1';
        if (!this.slots.skill2) return 'skill2';
        return G.input.down('down') ? 'skill2' : 'skill1';
      }
      if (!this.slots.primary) return 'primary';
      if (!this.slots.secondary) return 'secondary';
      if (G.input.down('down')) return 'secondary';
      if (this.slots.primary.def.kind === k) return 'primary';
      if (this.slots.secondary.def.kind === k) return 'secondary';
      return 'primary';
    }
    // returns the item that was replaced (or null)
    equip(inst, slot) {
      slot = slot || this.slotFor(inst);
      const old = this.slots[slot];
      if (this.act && this.act.inst === old) { this.act.end(); this.act = null; }
      this.slots[slot] = inst;
      G.emit('equip', { player: this, inst, slot, old });
      return old;
    }

    // ------------------------------------------------------------ damage
    takeDamage(amount, info = {}) {
      if (this.dead || this.dying || this.state === 'dead') return 0;
      if (G.debug.god) return 0;
      if (this.invuln > 0 || (this.state === 'roll' && this.rollT < ROLL_IFRAMES) || this.state === 'ledge') return 0;
      if (this.act && this.act.block) {
        amount = this.act.block(amount, info, G.world);
        if (amount <= 0) return 0;
      }
      for (const m of this.mutations) if (m.onIncoming) amount = m.onIncoming(this, amount, info);
      if (amount <= 0) return 0;
      const dealt = super.takeDamage(amount, Object.assign({}, info, { stun: 0, kb: (info.kb || 60) * 0.8, kbUp: info.kbUp || 90 }));
      if (!dealt) return 0;
      this.recoverable = Math.min(this.maxHp - this.hp, this.recoverable + dealt * 0.6);
      this.recoverT = 0;
      this.invuln = 0.6; this.hurtInvuln = true;
      if (this.state !== 'dead') { this.state = 'hurt'; this.stateT = 0; }
      if (this.act) { this.act.end(); this.act = null; }
      this.healT = 0;
      const w = G.world;
      if (w) {
        w.shake(4, 0.25); w.hitstop(0.06);
        w.fx.flash(PAL.red, 0.1);
        w.fx.splat(this.cx, this.cy, info.dir || -this.facing, 10, ['#ff2a8a', '#b3125f', '#27f3ff']);
        w.glitch = Math.max(w.glitch, 0.25);
      }
      if (G.audio) G.audio.play('playerHurt');
      G.emit('playerHurt', { dmg: dealt, info });
      return dealt;
    }
    die() {
      this.hp = 0;
      this.state = 'dead'; this.stateT = 0; this.dying = true;
      if (this.act) { this.act.end(); this.act = null; }
      const w = G.world;
      if (w) {
        w.fx.burst(this.cx, this.y + 4, 40, { speed: 200, life: 1.2, color: [PAL.cyan, '#9ffcff', PAL.magenta], shape: 'px', grav: -60, drag: 2, glow: 6, additive: true });
        w.hitstop(0.25); w.shake(6, 0.5); w.glitch = 1;
      }
      if (G.audio) { G.audio.play('death'); G.audio.duck(0.8, 2); }
      G.emit('playerDied', { player: this });
    }
    // called by weapons when damage is dealt: recovery (rally) heals part of recent damage
    onDealDamage(dealt, target, inst) {
      if (this.recoverable > 0 && dealt > 0) {
        const h = Math.min(this.recoverable, Math.max(1, dealt * 0.45));
        this.recoverable -= h;
        this.heal(h);
      }
      for (const m of this.mutations) if (m.onDealDamage) m.onDealDamage(this, dealt, target, inst);
    }

    // ------------------------------------------------------------ update
    update(dt, world) {
      const L = world.level, I = G.input;
      this.tickTimers(dt);
      this.updateStatuses(dt);
      this.stateT += dt;
      if (this.state === 'dead') {
        this.vx *= Math.pow(0.02, dt);
        this.physics(dt, L);
        this.deadT += dt;
        this.updateScarf(dt);
        return;
      }

      // timers
      for (const k in this.slots) { const it = this.slots[k]; if (it && it.cd > 0) it.cd = Math.max(0, it.cd - dt); }
      if (this.rollCd > 0) this.rollCd -= dt;
      if (this.landLag > 0) this.landLag -= dt;
      if (this.jumpBuf > 0) this.jumpBuf -= dt;
      this.recoverT += dt;
      if (this.recoverT > 2.5) this.recoverable = Math.max(0, this.recoverable - this.maxHp * 0.25 * dt);
      if (this.healT > 0) {
        this.healT -= dt;
        this.heal(this.healRate * dt);
        if (G.rand.chance(dt * 30)) world.fx.particle({ x: this.x + G.rand.float(0, this.w), y: this.y + G.rand.float(4, this.h), vy: -40, life: 0.5, color: PAL.green, glow: 5, additive: true });
      }
      // low-HP heartbeat
      if (this.hp < this.maxHp * 0.25) {
        this.beatT = (this.beatT || 0) - dt;
        if (this.beatT <= 0) { this.beatT = 0.9; if (G.audio) G.audio.play('lowHp', { vol: 0.6 }); }
      } else this.beatT = 0;
      if (I.pressed('jump')) this.jumpBuf = 0.13;
      for (const [slot, btn] of SLOT_BUTTONS) if (I.pressed(btn)) this.buffer = { slot, btn, t: 0.22 };
      if (this.buffer && (this.buffer.t -= dt) <= 0) this.buffer = null;
      for (const m of this.mutations) if (m.update) m.update(this, dt, world);

      const ix = (I.down('right') ? 1 : 0) - (I.down('left') ? 1 : 0);
      switch (this.state) {
        case 'normal': this.stNormal(dt, world, ix); break;
        case 'roll': this.stRoll(dt, world, ix); break;
        case 'slam': this.stSlam(dt, world); break;
        case 'ladder': this.stLadder(dt, world, ix); break;
        case 'ledge': this.stLedge(dt, world); break;
        case 'hurt':
          this.physics(dt, L);
          this.vx = G.approach(this.vx, 0, 600 * dt);
          if (this.stateT > 0.2) this.state = 'normal';
          break;
      }

      // hazards
      if (this.state !== 'dead' && this.invuln <= 0 && this.touchesHazard(L)) {
        this.takeDamage(Math.round(this.maxHp * 0.12), { kb: 0, kbUp: 330, color: PAL.red });
        this.vy = -330;
        if (G.audio) G.audio.play('spikes');
      }
      // fell out of the map
      if (this.y > L.ph + 40) {
        this.x = this.safe.x; this.y = this.safe.y; this.vx = this.vy = 0;
        this.takeDamage(Math.round(this.maxHp * 0.1), { kb: 0 });
      }
      if (this.onGround && this.state === 'normal') {
        this.safeT += dt;
        if (this.safeT > 0.4 && !this.touchesHazard(L) && L.solid(Math.floor(this.cx / TS), Math.floor((this.bottom + 2) / TS))) { this.safe.x = this.x; this.safe.y = this.y; this.safeT = 0; }
      }
      L.reveal(this.cx, this.cy, 11);

      // interactables
      this.focus = null;
      let best = 1e9;
      for (const o of world.objects) {
        if (!o.interactable || o.dead) continue;
        const r = o.interactRange || 18;
        if (Math.abs(o.cx - this.cx) < r + o.w / 2 && this.bottom > o.y - 8 && this.y < o.y + o.h + 4) {
          const d = Math.abs(o.cx - this.cx);
          if (d < best) { best = d; this.focus = o; }
        }
      }
      if (this.focus && I.pressed('interact') && this.state === 'normal') this.focus.interact(this, world);

      this._lastJ = this.joints(this.buildPose());
      this.updateScarf(dt);
      // afterimages
      this.ghostT -= dt;
      if ((this.state === 'roll' || this.state === 'slam') && this.ghostT <= 0) {
        this.ghostT = 0.03;
        this.ghosts.push({ j: this.joints(this.buildPose()), t: 0, c: this.ghosts.length % 2 ? PAL.cyan : PAL.magenta });
      }
      for (let i = this.ghosts.length - 1; i >= 0; i--) { this.ghosts[i].t += dt; if (this.ghosts[i].t > 0.18) this.ghosts.splice(i, 1); }
    }

    canUseItems() { return this.state === 'normal' && this.landLag <= 0; }

    handleItems(dt, world) {
      if (this.buffer && this.canUseItems()) {
        const { slot, btn } = this.buffer;
        const inst = this.slots[slot];
        if (!inst) this.buffer = null;
        else if (this.act && this.act.inst === inst && !this.act.done && !(this.act.cancelable && this.act.restartOnPress)) {
          this.act.press(); this.buffer = null;
        } else if (!this.act || this.act.cancelable) {
          if (inst.cd > 0) {
            this.buffer = null;
            if (G.audio) G.audio.play('denied', { vol: 0.5 });
            G.emit('denied', { slot });
          } else {
            if (this.act) this.act.end();
            this.act = inst.def.use(this, inst, world, btn);
            this.buffer = null;
            G.emit('itemUsed', { slot, inst });
          }
        }
      }
      if (this.act) {
        this.act.update(dt, world);
        if (this.act && this.act.done) { this.act.end(); this.act = null; }
      }
    }

    stNormal(dt, world, ix) {
      const L = world.level, I = G.input;
      if (this.onGround) { this.coyote = 0.1; this.jumpsUsed = 0; } else this.coyote -= dt;

      // horizontal
      let mm = 1;
      if (this.act) mm = this.onGround ? this.act.moveMul : this.act.airMoveMul;
      if (this.healT > 0) mm = Math.min(mm, 0.5);
      if (this.landLag > 0) mm = 0;
      const target = ix * RUN * this.slowMul * (this.speedMul || 1) * mm;
      const acc = this.act ? 700 : this.onGround ? (ix ? 1600 : 2200) : 1200;
      this.vx = G.approach(this.vx, target, acc * dt);
      if (ix && (!this.act || !this.act.lockFacing)) this.facing = ix;

      // ladders
      const ladTx = Math.floor(this.cx / TS);
      if (I.down('up') && !this.act) {
        for (let ty = Math.floor((this.y + 2) / TS); ty <= Math.floor((this.bottom - 2) / TS); ty++) {
          if (L.ladder(ladTx, ty)) { this.enterLadder(ladTx); return; }
        }
      }
      if (I.down('down') && this.onGround && !this.act && L.ladder(ladTx, Math.floor((this.bottom + 2) / TS)) && !I.down('jump')) {
        this.y += 3; this.enterLadder(ladTx); return;
      }

      // jump / drop / slam / double jump
      if (this.jumpBuf > 0 && this.landLag <= 0 && (!this.act || this.act.cancelable || !this.onGround)) {
        if (I.down('down') && this.onGround && this.standingOnPlatformOnly(L)) {
          this.dropThrough = 0.25; this.jumpBuf = 0; this.y += 1; this.onGround = false;
        } else if (I.down('down') && !this.onGround && this.coyote <= 0) {
          this.startSlam(world);
          return;
        } else if (this.coyote > 0) {
          this.cancelAct();
          this.vy = -JUMP_V * (this.jumpMul || 1); this.coyote = 0; this.jumpBuf = 0;
          world.fx.burst(this.cx, this.bottom, 6, { angle: -Math.PI / 2, spread: 1.2, speed: 60, life: 0.3, color: ['#4a4666', '#6f7299'], grav: 100 });
          if (G.audio) G.audio.play('jump');
        } else if (this.jumpsUsed < this.airJumps) {
          this.cancelAct();
          this.vy = -DJUMP_V * (this.jumpMul || 1); this.jumpsUsed++; this.jumpBuf = 0;
          world.fx.ring(this.cx, this.bottom, 2, 12, PAL.cyan, 0.25, 1);
          world.fx.burst(this.cx, this.bottom, 8, { angle: Math.PI / 2, spread: 1.0, speed: 90, life: 0.3, color: [PAL.cyan, PAL.magenta], grav: 0, additive: true });
          if (G.audio) G.audio.play('doublejump');
        }
      }
      if (I.released('jump') && this.vy < -120) this.vy *= 0.5;

      // roll
      if (I.pressed('roll') && this.rollCd <= 0 && this.landLag <= 0 && (!this.act || this.act.cancelable || this.act.rollCancel !== false)) {
        this.cancelAct();
        if (ix) this.facing = ix;
        this.state = 'roll'; this.stateT = 0; this.rollT = 0;
        this.vx = this.facing * ROLL_V;
        world.fx.burst(this.cx, this.bottom, 5, { angle: this.facing > 0 ? Math.PI : 0, spread: 0.6, speed: 70, life: 0.3, color: ['#4a4666'], grav: 80 });
        if (G.audio) G.audio.play('roll');
        return;
      }

      // heal
      if (I.pressed('heal') && !this.act) this.tryHeal(world);

      this.handleItems(dt, world);
      if (this.state !== 'normal') return;

      // physics
      const g0 = this.gravity;
      if (this.vy > 0) this.gravity = g0 * 1.2;
      if (this.act) this.gravity *= this.act.gravityMul;
      const vyBefore = this.vy;
      this.physics(dt, L);
      this.gravity = g0;
      if (this.onGround && !this.wasOnGround) this.onLand(vyBefore, world);

      // ledge grab
      if (!this.onGround && this.vy > -40 && ix === this.facing && !this.act) this.tryLedge(L);

      // footsteps
      if (this.onGround && Math.abs(this.vx) > 40) {
        const prev = this.runPhase;
        this.runPhase += dt * Math.abs(this.vx) / 8.5;
        if (Math.floor(prev / Math.PI) !== Math.floor(this.runPhase / Math.PI)) {
          if (G.audio) G.audio.play('step', { vol: 0.35 });
          if (G.rand.chance(0.5)) world.fx.particle({ x: this.cx - this.facing * 3, y: this.bottom - 1, vx: -this.facing * 20, vy: -15, life: 0.3, color: '#3b3753', grav: 60 });
        }
      } else this.runPhase = 0;
    }

    cancelAct() { if (this.act) { this.act.end(); this.act = null; } }

    onLand(vy, world) {
      if (vy > 200) {
        world.fx.burst(this.cx, this.bottom, vy > 380 ? 10 : 5, { angle: -Math.PI / 2, spread: 1.4, speed: 70, life: 0.35, color: ['#4a4666', '#6f7299'], grav: 150 });
        if (G.audio) G.audio.play('land', { vol: Math.min(1, vy / 430) });
      }
    }

    tryHeal(world) {
      if (this.flasks <= 0 || this.hp >= this.maxHp || this.healT > 0) {
        if (G.audio) G.audio.play('denied', { vol: 0.5 });
        return;
      }
      this.flasks--;
      const amount = this.maxHp * this.flaskHeal;
      this.healT = 0.6; this.healRate = amount / 0.6;
      this.recoverable = 0;
      world.fx.ring(this.cx, this.cy, 4, 22, PAL.green, 0.4, 1);
      if (G.audio) G.audio.play('heal');
      G.emit('heal', { amount });
    }

    enterLadder(tx) {
      this.cancelAct();
      this.state = 'ladder'; this.stateT = 0;
      this.ladderX = tx * TS + TS / 2 - this.w / 2;
      this.x = this.ladderX; this.vx = 0; this.vy = 0; this.onLadder = true; this.jumpsUsed = 0;
    }
    stLadder(dt, world, ix) {
      const L = world.level, I = G.input;
      const dir = (I.down('down') ? 1 : 0) - (I.down('up') ? 1 : 0);
      this.vy = dir * 90; this.vx = 0; this.x = this.ladderX;
      if (dir) {
        const prev = this.climbPhase;
        this.climbPhase += dt * 9;
        if (Math.floor(prev / Math.PI) !== Math.floor(this.climbPhase / Math.PI) && G.audio) G.audio.play('ladder', { vol: 0.3 });
      }
      this.noGravity = true;
      this.physics(dt, L);
      this.noGravity = false;
      const tx = Math.floor(this.cx / TS);
      let on = false;
      for (let ty = Math.floor((this.y + 6) / TS); ty <= Math.floor((this.bottom - 1) / TS); ty++) if (L.ladder(tx, ty)) on = true;
      const exit = (vy) => { this.state = 'normal'; this.onLadder = false; this.vy = vy; };
      if (this.jumpBuf > 0) { this.jumpBuf = 0; exit(-JUMP_V * 0.85); if (ix) this.facing = ix; this.vx = ix * RUN; if (G.audio) G.audio.play('jump'); return; }
      if (!on) {
        if (dir < 0) { exit(0); this.y = Math.floor(this.bottom / TS) * TS - this.h; if (L.floorAt(this.cx, this.bottom + 1)) this.onGround = true; }
        else exit(0);
        return;
      }
      if (this.onGround && dir > 0) exit(0);
    }

    tryLedge(L) {
      const d = this.facing;
      const tx = d > 0 ? Math.floor((this.x + this.w + 2) / TS) : Math.floor((this.x - 2) / TS);
      const myTx = Math.floor(this.cx / TS);
      for (let ty = Math.floor((this.y - 6) / TS); ty <= Math.floor((this.y + 12) / TS); ty++) {
        const top = ty * TS;
        if (top < this.y - 8 || top > this.y + 12) continue;
        if (L.solid(tx, ty) && !L.solid(tx, ty - 1) && !L.solid(tx, ty - 2) && !L.solid(myTx, ty - 1) && !L.solid(myTx, ty - 2)) {
          this.state = 'ledge'; this.stateT = 0;
          this.ledge = { x0: this.x, y0: this.y, x1: d > 0 ? tx * TS + 1 : (tx + 1) * TS - this.w - 1, y1: top - this.h };
          this.vx = 0; this.vy = 0; this.jumpsUsed = 0;
          if (G.audio) G.audio.play('ledge');
          return true;
        }
      }
      return false;
    }
    stLedge(dt) {
      const k = Math.min(1, this.stateT / 0.17);
      const l = this.ledge;
      // up first, then over
      const ky = G.easeOut(Math.min(1, k * 1.4)), kx = G.easeInOut(Math.max(0, (k - 0.35) / 0.65));
      this.y = G.lerp(l.y0, l.y1, ky);
      this.x = G.lerp(l.x0, l.x1, kx);
      if (k >= 1) { this.state = 'normal'; this.onGround = true; this.vy = 0; }
    }

    stRoll(dt, world, ix) {
      this.rollT += dt;
      this.vx = this.facing * ROLL_V * (this.rollT > ROLL_T * 0.75 ? 0.6 : 1) * (this.rollMul || 1);
      this.physics(dt, world.level);
      if (this.rollT >= ROLL_T) {
        this.state = 'normal'; this.rollCd = 0.1;
        for (const m of this.mutations) if (m.onRollEnd) m.onRollEnd(this, world);
      }
      // allow jumping out of a roll
      if (this.jumpBuf > 0 && this.onGround && this.rollT > 0.08) { this.state = 'normal'; this.rollCd = 0.1; }
    }

    startSlam(world) {
      this.cancelAct();
      this.state = 'slam'; this.stateT = 0; this.jumpBuf = 0;
      this.vx = 0; this.vy = -80;
      if (G.audio) G.audio.play('dash');
    }
    stSlam(dt, world) {
      if (this.stateT > 0.08) this.vy = 620;
      this.invuln = Math.max(this.invuln, 0.05);
      const mf = this.maxFall; this.maxFall = 640;
      this.physics(dt, world.level);
      this.maxFall = mf;
      if (this.onGround) {
        const best = Math.max(this.statMul('brutality'), this.statMul('tactics'), this.statMul('survival'));
        const box = { x: this.cx - 34, y: this.bottom - 18, w: 68, h: 20 };
        const hits = G.hitBox(world, box, 'player', Math.round(14 * best * (this.dmgMul || 1)), { kb: 140, kbUp: 200, stun: 1.1, sourceKind: 'slam' });
        for (const t of hits) this.onDealDamage(t.lastDealt || 1, t, null);
        world.fx.ring(this.cx, this.bottom, 4, 36, PAL.cyan, 0.35, 2);
        world.fx.burst(this.cx, this.bottom - 1, 18, { angle: -Math.PI / 2, spread: 1.4, speed: 200, life: 0.4, color: [PAL.cyan, '#ffffff', '#4a4666'], grav: 500, shape: 'spark' });
        world.shake(5, 0.25); world.hitstop(0.05);
        world.flashLights.push({ x: this.cx, y: this.bottom, r: 70, color: PAL.cyan, t: 0, life: 0.2 });
        this.state = 'normal'; this.landLag = 0.16;
        if (G.audio) G.audio.play('slam');
      }
    }

    updateScarf(dt) {
      const s = this.scarf;
      const pose = this._lastJ;
      const ax = pose ? pose.neck[0] : this.cx, ay = pose ? pose.neck[1] + 1 : this.y + 6;
      s[0].x = ax; s[0].y = ay;
      const wind = -this.vx * 0.9 - this.facing * 25;
      for (let i = 1; i < s.length; i++) {
        const p = s[i];
        const vx = (p.x - p.px) * 0.86, vy = (p.y - p.py) * 0.86;
        p.px = p.x; p.py = p.y;
        p.x += vx + wind * dt * dt * 30 + Math.sin(this.t * 7 + i) * 0.08;
        p.y += vy + 260 * dt * dt + Math.cos(this.t * 5 + i * 1.3) * 0.05;
      }
      for (let k = 0; k < 3; k++) {
        for (let i = 1; i < s.length; i++) {
          const a = s[i - 1], b = s[i];
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
          const f = (d - 3) / d;
          b.x -= dx * f; b.y -= dy * f;
        }
      }
    }

    // ------------------------------------------------------------ pose & drawing
    buildPose() {
      const P = { lean: 0.05, bob: 0, crouch: 0, thF: 0.05, shF: -0.05, thB: -0.1, shB: -0.15, uaF: 0.25, faF: 0.55, uaB: -0.15, faB: 0.2, rot: 0, aim: null, held: null };
      const st = this.state;
      if (st === 'dead') {
        const k = Math.min(1, this.deadT / 0.5);
        P.crouch = 9 * k; P.lean = G.lerp(0.1, 1.1, k); P.thF = 1.4 * k; P.shF = -0.3; P.thB = 1.2 * k; P.shB = -0.6 * k;
        P.uaF = 0.3; P.faF = 0.2; P.uaB = 0.5; P.faB = 0.3;
        return P;
      }
      if (st === 'roll') {
        const k = this.rollT / ROLL_T;
        P.rot = k * Math.PI * 2; P.crouch = 7; P.lean = 0.9;
        P.thF = 2.0; P.shF = -0.6; P.thB = 1.7; P.shB = -0.9; P.uaF = 1.6; P.faF = 2.6; P.uaB = 1.2; P.faB = 2.3;
        return P;
      }
      if (st === 'ledge') {
        P.uaF = 2.9; P.faF = 3.0; P.uaB = 2.7; P.faB = 2.9; P.thF = 1.4; P.shF = 0.2; P.thB = 0.9; P.shB = -0.4; P.lean = 0.3; P.crouch = 3;
        return P;
      }
      if (st === 'ladder') {
        const c = Math.sin(this.climbPhase);
        P.uaF = 2.7 + c * 0.35; P.faF = 3.0 + c * 0.2; P.uaB = 2.7 - c * 0.35; P.faB = 3.0 - c * 0.2;
        P.thF = 0.5 + c * 0.5; P.shF = -0.3 + c * 0.3; P.thB = 0.5 - c * 0.5; P.shB = -0.3 - c * 0.3; P.lean = 0;
        return P;
      }
      if (st === 'slam') {
        P.thF = 1.2; P.shF = -0.2; P.thB = 0.6; P.shB = -0.8; P.uaF = 2.6; P.faF = 2.2; P.uaB = 2.4; P.faB = 2.0; P.lean = 0.3;
        return P;
      }
      if (st === 'hurt') {
        P.lean = -0.45; P.uaF = -0.9; P.faF = -0.4; P.uaB = -1.2; P.faB = -0.6; P.thF = 0.4; P.thB = -0.4;
        return P;
      }
      if (!this.onGround) {
        if (this.vy < 0) { P.thF = 1.0; P.shF = -0.3; P.thB = -0.25; P.shB = -1.1; P.uaF = 1.3; P.faF = 1.9; P.uaB = -0.8; P.faB = -0.2; P.lean = 0.15; }
        else { P.thF = 0.45; P.shF = 0.05; P.thB = -0.35; P.shB = -0.55; P.uaF = 2.0; P.faF = 2.5; P.uaB = 1.6; P.faB = 2.2; P.lean = 0.05; }
      } else if (Math.abs(this.vx) > 25) {
        const ph = this.runPhase;
        const s = Math.sin(ph);
        P.thF = s * 0.85; P.thB = -s * 0.85;
        P.shF = P.thF - 0.2 - Math.max(0, Math.cos(ph)) * 1.1;

      } else {

      if (this.landLag > 0) { P.crouch = 3; P.thF = 0.9; P.shF = -0.5; P.thB = 0.6; P.shB = -0.7; }

      const dir = (a, len) => [Math.sin(a) * len * f, Math.cos(a) * len];
      const TH = 6, SH = 6, TO = 8, UA = 5, FA = 5;
      // hip height so the lower foot touches the ground
      const legDrop = (th, sh) => Math.cos(th) * TH + Math.cos(sh) * SH;
      const hipH = Math.max(legDrop(P.thF, P.shF), legDrop(P.thB, P.shB), 6);

      const kneeB = add(hip, dir(P.thB, TH)), footB = add(kneeB, dir(P.shB, SH));
      const neck = add(hip, [Math.sin(P.lean) * TO * f, -Math.cos(P.lean) * TO]);
      const head = add(neck, [Math.sin(P.lean) * 3 * f, -3.5]);
      const sh = add(neck, [0, 1]);
      const elbowF = add(sh, dir(P.uaF, UA)), handF = add(elbowF, dir(P.faF, FA));
      const shB = add(neck, [-f, 1]);
      const elbowB = add(shB, dir(P.uaB, UA)), handB = add(elbowB, dir(P.faB, FA));
      const J = { hip, kneeF, footF, kneeB, footB, neck, head, sh, elbowF, handF, shB, elbowB, handB };

        const cxr = 0, cyr = -8, c = Math.cos(P.rot * f), s = Math.sin(P.rot * f);

      }

    }

    draw(ctx, cam) {
      const P = this.buildPose();
      const J = this.joints(P);
      this._lastJ = J;
      const ox = cam.ox, oy = cam.oy;
      const S = (p) => [p[0] - ox, p[1] - oy];

      for (const g of this.ghosts) {

        this.drawSkeleton(ctx, g.j, ox, oy, g.c);
      }
      ctx.globalAlpha = 1;

      const sc = this.scarf;

      }
      for (let i = 1; i < sc.length; i++) {
        G.px.line(ctx, sc[i - 1].x - ox, sc[i - 1].y - oy, sc[i].x - ox, sc[i].y - oy, i < 3 ? COL.scarf : COL.scarf2, i < 4 ? 2 : 1);
      }

      this.drawSkeleton(ctx, J, ox, oy, white, true);
      // held item
      if (this.state !== 'dead' && this.state !== 'roll' && this.state !== 'ladder' && this.state !== 'ledge') {
        let inst = this.act ? this.act.inst : null;
        let ang;
        if (inst && P.aim != null) ang = this.facing > 0 ? P.aim : Math.PI - P.aim;
        else {
          inst = this.slots.primary;
          if (inst && inst.def.kind !== 'melee') inst = null;

          ang = this.facing > 0 ? ia : Math.PI - ia;

        if (inst && inst.def.drawHeld) {
          const h = S(J.handF);
          inst.def.drawHeld(ctx, h[0], h[1], ang, this, inst, 1);
        }

        const h = S(J.handF);
        G.px.rect(ctx, h[0] - 1, h[1] - 1, 2, 2, white || COL.hand);
      }
      if (this.act && this.act.draw) this.act.draw(ctx, cam);
    }

    drawSkeleton(ctx, J, ox, oy, mono, full) {
      const S = (p) => [p[0] - ox, p[1] - oy];
      const seg = (a, b, c, t) => { const A = S(a), B = S(b); G.px.line(ctx, A[0], A[1], B[0], B[1], c, t); };
      const O = mono && !full ? mono : COL.outline;
      // outline pass
      if (full || !mono) {
        seg(J.hip, J.kneeB, O, 5); seg(J.kneeB, J.footB, O, 5);
        seg(J.shB, J.elbowB, O, 5); seg(J.elbowB, J.handB, O, 4);
        seg(J.hip, J.neck, O, 7);
        seg(J.hip, J.kneeF, O, 5); seg(J.kneeF, J.footF, O, 5);
        seg(J.sh, J.elbowF, O, 5); seg(J.elbowF, J.handF, O, 4);
        const h = S(J.head); G.px.disc(ctx, h[0], h[1], 4, O);
      }
      const c = (col) => mono || col;
      // back limbs
      seg(J.shB, J.elbowB, c(COL.armB), 3); seg(J.elbowB, J.handB, c(COL.armB), 2);
      seg(J.hip, J.kneeB, c(COL.legB), 3); seg(J.kneeB, J.footB, c(COL.legB), 3);
      const fb = S(J.footB); G.px.rect(ctx, fb[0] - 1 + (this.facing > 0 ? 0 : -1), fb[1] - 1, 3, 2, c(COL.boot));
      // torso (coat)
      seg(J.hip, J.neck, c(COL.coat), 5);
      if (!mono) {
        const a = S(J.hip), b = S(J.neck);
        G.px.line(ctx, a[0] + this.facing * 2, a[1], b[0] + this.facing * 2, b[1] + 1, COL.trim, 1);
        // coat tail
        G.px.line(ctx, a[0] - this.facing * 1, a[1], a[0] - this.facing * 4 - this.vx * 0.02, a[1] + 5, COL.coatB, 3);
        // belt + chest light
        G.px.rect(ctx, a[0] - 2, a[1] - 1, 5, 1, '#15131f');
        G.px.rect(ctx, a[0] + (this.facing > 0 ? 0 : 0), a[1] - 1, 1, 1, PAL.yellow);
        const m = [(a[0] * 0.4 + b[0] * 0.6), (a[1] * 0.4 + b[1] * 0.6)];
        G.px.rect(ctx, m[0] - (this.facing > 0 ? 0 : 1), m[1], 2, 1, '#4a4470');
        // collar (scarf origin)
        G.px.rect(ctx, b[0] - 2, b[1], 4, 2, COL.scarf);
        G.px.rect(ctx, b[0] - 2 - this.facing, b[1] + 1, 1, 1, COL.scarf2);
      }
      // front leg
      seg(J.hip, J.kneeF, c(COL.leg), 3); seg(J.kneeF, J.footF, c(COL.leg), 3);
      const ff = S(J.footF); G.px.rect(ctx, ff[0] - 1 + (this.facing > 0 ? 0 : -1), ff[1] - 1, 3, 2, c(COL.boot));
      // head: nanite flame
      const h = S(J.head);
      if (mono) G.px.disc(ctx, h[0], h[1], 3, mono);
      else this.drawFlame(ctx, h[0], h[1]);
      // front arm
      seg(J.sh, J.elbowF, c(COL.arm), 3); seg(J.elbowF, J.handF, c(COL.arm), 2);
    }

    drawFlame(ctx, x, y) {
      const t = this.t, f = this.facing;
      const lean = -f * G.clamp(Math.round(this.vx * 0.012), -2, 2);
      // skull plate
      G.px.disc(ctx, x, y, 3, '#0c3d4a');
      G.px.rect(ctx, x - 2, y - 1, 5, 3, '#15879c');
      // flame: 5 columns, tallest in the middle-back, flickering
      const base = [2, 4, 5, 4, 2];
      for (let i = 0; i < 5; i++) {
        const col = i - 2;
        const hgt = base[i] + Math.round(Math.sin(t * 14 + i * 1.7) * 1.2 + Math.sin(t * 6.1 + i * 0.6));
        for (let k = 0; k < hgt; k++) {
          const cx = x + col - f * (k > 1 ? 1 : 0) + (k > 2 ? lean : 0);
          ctx.fillStyle = k >= hgt - 1 ? PAL.magenta : k >= hgt - 2 ? '#27f3ff' : '#aefcff';
          ctx.fillRect(cx, y - 2 - k, 1, 1);
        }
      }
      // visor eye
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + (f > 0 ? 1 : -2), y, 2, 1);
      ctx.fillStyle = PAL.magenta;
      ctx.fillRect(x + (f > 0 ? 3 : -3), y, 1, 1);
    }
    drawLight(ctx, cam) {
      const J = this._lastJ;
      if (!J || this.state === 'dead') return;
      G.drawGlow(ctx, J.head[0] - cam.ox, J.head[1] - cam.oy - 3, 16, PAL.cyan, 0.3 + Math.sin(this.t * 9) * 0.05);
      G.drawGlow(ctx, this.cx - cam.ox, this.cy - cam.oy, 70, '#2a6cff', 0.07);
    }
  }
  G.Player = Player;
})();

// (bright on top/front, dim on bottom/back) plus an inner rim light. Flipped / white-flash / elite

      let best = 0;

    }
    // like hitPlayer but lands at most once per attack (reset swingHit when the attack starts)
    hitOnce(box, dmg = this.dmg, info = {}) {
      if (this.swingHit) return 0;
      const d = this.hitPlayer(box, dmg, info);
      if (d) this.swingHit = true;
      return d;
    }
    // hitscan segment vs player
    beamHit(x0, y0, x1, y1, pad, dmg, info = {}) {
      let best = 0;
      for (const v of this.victims()) {
        if (!Art.segBox(x0, y0, x1, y1, v, pad)) continue;
        const d = v.takeDamage(dmg, Object.assign({ dir: G.sign(x1 - x0) || this.facing, kb: 120, kbUp: 100, source: this }, info));
        if (d > best) best = d;
      }
      return best;
    }
    patrol(dt, speed = this.speed * 0.5) {
      this.patrolT -= dt;
      if (this.patrolT <= 0) { this.patrolT = G.rand.float(1.5, 3.5); this.patrolDir = G.rand.chance(0.3) ? 0 : G.rand.sign(); }
      if (this.patrolDir && (this.ledgeAhead(this.patrolDir) || this.wallAhead(this.patrolDir))) this.patrolDir *= -1;
      this.vx = G.approach(this.vx, this.patrolDir * speed * this.slowMul, 400 * dt);
      if (this.patrolDir) this.facing = this.patrolDir;
    }
    chase(dt, speed = this.speed, stopDist = 14) {
      const dx = this.dxToPlayer();
      const dir = Math.abs(dx) > stopDist ? G.sign(dx) : 0;
      if (dir) this.facing = dir;
      const blocked = dir && (this.ledgeAhead(dir) && !this.flying);

    // ground: move away from the player (returns false when cornered)
    retreat(dt, speed) {

    takeDamage(amount, info = {}) {

    }

    update(dt, world) {
      this.tickTimers(dt);
      this.updateStatuses(dt);
      if (this.hpBarT > 0) this.hpBarT -= dt;
      if (this.dying) { this.updateDeath(dt, world); return; }
      this.stateT += dt;
      if (this.alertT > 0) this.alertT -= dt;
      if (this.teleT > 0) this.teleT -= dt;
      if (this.cooldown > 0) this.cooldown -= dt;
      if (this.flinchT > 0) this.flinchT -= dt;
      if (this.poiseT > 0) this.poiseT -= dt;
      if (!this.aggro && this.canSee()) this.notice();
      if (this.aggro && this.distToPlayer() > this.loseSight) this.aggro = false;
      if (this.stun > 0) {
        this.teleT = 0;
        if (this.state !== 'stunned') this.setState('stunned');

        if (this.flying) this.vy = G.approach(this.vy, 0, 500 * dt);

      if (!this.flying && this.onGround && this.stun > 0) this.vx *= Math.pow(0.02, dt);

    separate(world, dt) {

        if (o === this || o.dying || o.flying || o.immobile) continue;

      w.fx.burst(this.cx, this.cy, 10, { speed: 140, life: 0.35, color: [PAL.yellow, '#ffffff'], shape: 'spark', grav: 200, additive: true });

  // ---------------------------------------------------------------- «Оболочка» husk (shambling cyborg zombie)
  const HUSK_COL = [
    { main: '#a3203f', light: '#ff7598', dark: '#5a0f27', metal: '#3c3658', metalL: '#8f8bbd', eye: '#eaff5a', jaw: '#6e1331', tooth: '#ffe0e8', mouth: '#1a0610', rim: '#ff4f7e', dim: '#a0143f' },
    { main: '#2e8a2a', light: '#bfff6a', dark: '#154716', metal: '#3c3658', metalL: '#8f8bbd', eye: '#ff5ae6', jaw: '#1c561c', tooth: '#eaffd0', mouth: '#06140a', rim: '#a4ff45', dim: '#2e8a1c' },
  ];
  const huskSpec = (v) => {
    const C = HUSK_COL[v];
    const B = {
      TH: 5, SH: 5, TO: 7, HN: 3, UA: 5, FA: 5, legW: 3, armW: 2, hipW: 5, shW: 8, shX: 2, col: C,
      torso(g, J, P, B) {
        Art.torso(g, J, P, B);
        for (let i = 0; i <= 4; i++) {
          const p = Art.spine(J, i / 4, -(G.lerp(B.hipW, B.shW, i / 4) / 2 - 0.5));
          Art.px(g, p[0], p[1], i % 2 ? C.metalL : C.metal);
        }
        for (let i = 0; i < 3; i++) { const p = Art.spine(J, 0.45 + i * 0.17, 0.5); Art.line(g, p[0], p[1], p[0] + Math.cos(J.lean) * 2, p[1] + Math.sin(J.lean) * 2, C.light); }
        const b = Art.spine(J, 0.2, -2.5);
        Art.line(g, b[0], b[1], b[0] - 2, b[1] + 3, C.metal); // dangling cable
      },
      head(g, J, P) {
        const [x, y] = J.head, jo = P.jaw || 0;
        if (jo) Art.rect(g, x, y + 1, 4, jo + 1, C.mouth);
        Art.rect(g, x, y + 1 + jo, 4, 2, C.jaw);
        Art.px(g, x + 1, y + 1 + jo, C.tooth); Art.px(g, x + 3, y + 1 + jo, C.tooth);
        Art.disc(g, x, y - 0.5, 3, C.main);
        Art.rect(g, x - 3, y - 2, 3, 3, C.metal); Art.px(g, x - 2, y - 3, C.metalL); Art.px(g, x - 3, y, C.metalL);

    pickAttack(world, adx) {

      if (adx < 70 && !high) add('swipe', 3.2);
      add('slam', high ? 0.6 : adx < 200 ? 3 : 1.2);
      add('laser', high ? 5 : adx > 55 ? 2.8 : 1);
      if (this.phase >= 1) {
        add('missiles', 2.4);
        this.drones = this.drones.filter((d) => !d.dead && !d.dying);
        if (this.drones.length < 2 && this.summonCd <= 0) add('summon', 2);
      }
      if (this.phase >= 2 && adx > 80) {
        const A = this.arena(), room = this.facing > 0 ? A.x1 - this.x - this.w : this.x - A.x0;
        const toward = G.sign(this.dxToPlayer()) === this.facing;
        if (toward && room > 140) add('charge', 3);
      }
      const k = G.world.rng.weighted(opts);
      this.last = k;
      this.facePlayer(); this.turnT = 0;
      switch (k) {
        case 'swipe': this.setState('swW'); this.telegraph(0.55); snd('heavy', { vol: 0.4, pitch: 0.6 }); break;
        case 'slam': this.windDur = [0.9, 0.8, 0.7][this.phase]; this.didSecond = false; this.setState('slamW'); this.telegraph(this.windDur); break;
        case 'laser': {
          this.windDur = [1.05, 0.95, 0.85][this.phase];
          const A = this.arena();
          const [ex, ey] = this.eyeWorld();
          const p = this.target;
          this.a0 = Math.atan2(A.floorY - ey, 14);   // floor right at its feet
          this.a1 = -0.06;                          // out to the far wall…
          // …or high enough to sweep a player standing on a platform
          if (p.bottom < A.floorY - 40) this.a1 = Math.min(this.a1, Math.atan2(p.y - 14 - ey, Math.max(20, Math.abs(p.cx - ex))));
          this.setState('laserW'); this.telegraph(this.windDur); snd('charge', { pitch: 0.5 });
          break;
        }
        case 'missiles': {
          const p = this.target, A = this.arena(), L = world.level;
          const n = this.phase >= 2 ? 8 : 5;
          const xs = [];
          const lead = p.cx + (p.vx || 0) * 0.5;
          for (let i = 0; i < n; i++) {

            x = G.clamp(x + G.rand.float(-6, 6), A.x0 + 10, A.x1 - 10);
            const fy = L.groundBelow(x, A.ceilY + 18, 600);
            if (fy != null) xs.push([x, fy]);

      }

    slam(world) {

      this.snap = 0.08; this.swingHit = false;
      this.hitOnce({ x: gx - 26, y: gy - 36, w: 52, h: 36 }, 24, { kb: 230, kbUp: 220 });
      const sp = [190, 215, 240][this.phase];
      for (const d of [-1, 1]) world.addProjectile(new G.GroundWave({ x: gx + d * 10, y: gy, dir: d, speed: sp, life: 3, dmg: 16, h: 14, color: this.pc.core, owner: this }));
      world.fx.ring(gx, gy, 4, 50, this.pc.core, 0.35, 2);
      world.fx.burst(gx, gy - 2, 26, { angle: -Math.PI / 2, spread: 1.3, speed: 240, life: 0.6, color: ['#3b3350', '#6f6b8a', this.pc.core, '#ffffff'], grav: 700, size: [1, 2] });
      world.shake(7, 0.35); world.hitstop(0.05);
      world.flashLights.push({ x: gx, y: gy, r: 110, color: this.pc.core, t: 0, life: 0.25 });
      snd('heavy'); snd('explosion', { vol: 0.5, pitch: 1.3 });
    }

    // ------------------------------------------------------------ update: pose smoothing
    update(dt, world) {
      super.update(dt, world);
      if (this.dead) return;
      const rate = this.snap > 0 ? 45 : this.state === 'sw' || this.state === 'slam' ? 26 : 11;
      if (this.snap > 0) this.snap -= dt;
      const k = 1 - Math.exp(-rate * dt);
      for (const key in this.T) this.P[key] = G.lerp(this.P[key], this.T[key], key === 'look' ? Math.min(1, k * 1.5) : k);
    }

    // ------------------------------------------------------------ death
    die(info) {
      if (this.dying) return;
      this.dying = true; this.deathT = 0; this.state = 'death'; this.untargetable = true; this.teleT = 0; this.beam = null;
      this.vx = 0; this.deathDir = -this.facing;
      const w = G.world;
      w.hitstop(0.35); w.fx.flash('#ffffff', 0.3); w.shake(8, 0.8); w.glitch = 1;

      world.fx.burst(x, y, 5, { speed: 60, life: 0.9, color: ['#2a2438', '#3b3350'], size: [2, 4], grav: -40, drag: 2, shape: 'disc', shrink: true });
      world.flashLights.push({ x, y, r: r * 3, color: PAL.orange, t: 0, life: 0.2 });
      world.shake(3, 0.2);

    }
    dissolveK() { return G.clamp((this.deathT - 2.7) / 1.4, 0, 1); }
    updateDeath(dt, world) {

        }

        world.fx.ring(ex, ey, 6, 180, this.pc.core, 0.7, 2);
        world.fx.burst(ex, ey, 60, { speed: 360, life: 1.0, color: [this.pc.core, '#ffffff', PAL.yellow], shape: 'spark', grav: 100, additive: true });
        world.fx.flash('#ffffff', 0.35); world.shake(12, 0.9); world.hitstop(0.18); world.glitch = 1;
        world.flashLights.push({ x: ex, y: ey, r: 360, color: this.pc.core, t: 0, life: 0.9 });
        snd('explosion', { vol: 1, pitch: 0.6 }); snd('eliteDie');
        world.dropCurrency(this.cx, this.cy - 20, 40, 60);
        // snapshot the final frame for the pixel dissolve
        this.render(true);
        const c = this.facing > 0 ? this.out : Art.flip(this.out);
        const ax = this.facing > 0 ? OX : CW - OX;
        this._lastSpr = { c: Art.canvas(CW, CH), dx: -ax, dy: -OY };
        this._lastSpr.c.getContext('2d').drawImage(c, 0, 0);
        this.prepareDissolve();
      }
      this.dissolveStep(world);

    // ------------------------------------------------------------ drawing
    render(noFlash) {

        tg.globalCompositeOperation = 'source-in'; tg.fillStyle = col; tg.fillRect(0, 0, CW, CH);
        tg.globalCompositeOperation = 'source-over';
      }
      const o = this.og;
      o.clearRect(0, 0, CW, CH);
      o.drawImage(this.tD, -1, 0); o.drawImage(this.tD, 0, 1);
      o.drawImage(this.tB, 1, 0); o.drawImage(this.tB, 0, -1);
      o.drawImage(this.raw, 0, 0);
      if (!noFlash && (this.flash > 0.05 || (this.state === 'death' && G.rand.chance(0.25)))) {
        o.globalCompositeOperation = 'source-atop'; o.globalAlpha = this.state === 'death' ? 0.6 : 0.32; o.fillStyle = '#ffffff'; o.fillRect(0, 0, CW, CH);

      }

    }
    draw(ctx, cam0) {
      const cam = { ox: cam0.ox, oy: cam0.oy, x: cam0.x, y: cam0.y, w: cam0.w, h: cam0.h };
      if (this.dying && this.dis) { this.drawDissolve(ctx, cam); return; }
      this.render();
      const flip = this.facing < 0;
      let sx = Math.round(this.cx - cam.ox) - (flip ? CW - OX : OX), sy = Math.round(this.bottom - cam.oy) - OY;
      if (this.dying || this.state === 'chgHit' && this.stateT < 0.3) { sx += G.rand.int(-2, 2); sy += G.rand.int(-1, 1); }
      if (flip) { ctx.save(); ctx.translate(sx + CW, sy); ctx.scale(-1, 1); ctx.drawImage(this.out, 0, 0); ctx.restore(); }
      else ctx.drawImage(this.out, sx, sy);
      if ((this.state === 'intro' && this.stateT < 0.9) || this.state === 'roar' && this.stateT < 0.6) {
        ctx.globalAlpha = 0.5;
        if (flip) { ctx.save(); ctx.translate(sx + CW + G.rand.int(-4, 4), sy); ctx.scale(-1, 1); Art.glitchDraw(ctx, this.out, 0, 0, 0.6, 0.6); ctx.restore(); }

    }

      const ox = cam.ox, oy = cam.oy, pc = this.pc;

      const [ex, ey] = this.eyeWorld();
      const on = this.P.eyeOn;
      G.drawGlow(ctx, this.cx - ox, this.cy - oy, 110, pc.rim, 0.05 * on + 0.03);
      G.drawGlow(ctx, ex - ox, ey - oy, 20 + this.P.charge * 16, pc.core, (0.3 + this.P.charge * 0.3) * on);
      const hd = this.toWorld(skel(this.P).head);
      G.drawGlow(ctx, hd[0] + this.facing * 2 - ox, hd[1] - oy, 12, pc.core, 0.5 * on);
      // thruster flames
      if (this.P.thrust > 0.05) {
        const [tx, ty] = this.toWorld(skel(this.P).thr);
        const len = Math.round(6 + this.P.thrust * 18 + G.rand.int(0, 5));
        const x = Math.round(tx - ox - this.facing * 4), y = Math.round(ty - oy);

          const wdt = Math.max(1, Math.round(4 * (1 - i / len)));

        }
        G.drawGlow(ctx, tx - this.facing * 12 - ox, ty - oy, 30 + this.P.thrust * 20, PAL.orange, 0.7 * this.P.thrust);
      }
      // laser guide & beam
      if (this.state === 'laserW') {
        const w = this.wa(this.a0);
        const h = G.world.level.raycast(ex, ey, ex + Math.cos(w) * 800, ey + Math.sin(w) * 800);
        Art.sight(ctx, ex - ox, ey - oy, h.x - ox, h.y - oy, pc.core, 0.4 + 0.5 * (this.stateT / this.windDur), 2, this.t);
        // show the sweep arc on the floor
        const w1 = this.wa(this.a1);
        const h1 = G.world.level.raycast(ex, ey, ex + Math.cos(w1) * 800, ey + Math.sin(w1) * 800);
        Art.sight(ctx, ex - ox, ey - oy, h1.x - ox, h1.y - oy, pc.core, 0.18, 4, -this.t);
      }
      if (this.state === 'laser' && this.beam) {
        const b = this.beam;
        Art.beam(ctx, b[0] - ox, b[1] - oy, b[2] - ox, b[3] - oy, pc.core, '#ffffff', 5, 0.9);
        G.drawGlow(ctx, b[2] - ox, b[3] - oy, 34, pc.core, 0.8);
        G.drawGlow(ctx, b[0] - ox, b[1] - oy, 26, pc.core, 0.5);
      }
      if (this.state === 'missW' || this.state === 'miss') {
        const [px, py] = this.toWorld(skel(this.P).pod);
        G.drawGlow(ctx, px - ox, py - oy, 24, PAL.red, 0.5);
      }
      if (this.teleT > 0) G.drawGlow(ctx, this.cx - ox, this.y - 12 - oy, 16, PAL.yellow, 0.5);

  G.Overseer = Overseer;

  // Creates the boss at a feet position, registers it as world.boss. 'bossStart' fires when the player approaches.
  G.spawnBoss = function (world, x, y) {
    const b = G.spawnEnemy(world, 'overseer', x, y, { depth: world.depth });
    if (!b) return null;
    world.boss = b;
    if (world.player) b.facing = world.player.cx < b.cx ? -1 : 1;
    return b;
  };
})();

      if (isItem) {
        const inst = o.inst, slot = p.slotFor ? p.slotFor(inst) : null, old = slot ? p.slots[slot] : null;
        key = 'i|' + inst.uid + '|' + inst.id + '|' + slot + '|' + (old ? old.uid : '') + '|' + (o.price || 0) + '|' + (p.gold >= (o.price || 0)) + '|' + dev;
        if (key !== c.focusKey || o !== c.focus) {
          this.buildCard(o, inst, slot, old, p, dev);
          this.ca.hidden = false; this.pa.hidden = true;
          c.focusKey = key; c.focus = o; c.px = null;
          this.cardH = this.cardEl.offsetHeight / this.ppg;
          this.cardW = this.cardEl.offsetWidth / this.ppg;
        }
      } else {
        const txt = typeof o.prompt === 'function' ? o.prompt() : o.prompt || 'Использовать';
        key = 'p|' + txt + '|' + dev;
        if (key !== c.focusKey || o !== c.focus) {
          this.promptTxt.textContent = txt;
          this.keyLabel(this.promptKey, 'interact', dev);
          this.pa.hidden = false; this.ca.hidden = true;
          c.focusKey = key; c.focus = o; c.px = null;
          this.cardH = this.promptEl.offsetHeight / this.ppg;
          this.cardW = this.promptEl.offsetWidth / this.ppg;
        }
      }
      // anchor above the object (game px), clamped to the screen
      const sx = o.cx - cam.x, sy = o.y - cam.y;
      const W = this.cardW || 100, H = this.cardH || 20;
      const touch = dev === 'touch';
      const top = touch ? 50 : 4, bot = touch ? G.H - 4 : G.H - 72; // keep clear of the HUD bands
      let x = sx - W / 2, y = sy - H - (isItem ? 10 : 8);
      if (y < top) { // no room above: put it beside the object, on the side away from the player
        y = sy + (o.h || 16) / 2 - H / 2;
        const left = p.cx > o.cx;
        x = left ? sx - 16 - W : sx + 16;
        if (x < 4 || x + W > G.W - 4) x = left ? sx + 16 : sx - 16 - W;
      }
      x = Math.round(G.clamp(x, 4, G.W - W - 4));
      y = Math.round(G.clamp(y, top, Math.max(top, bot - H)));
      if (x !== c.px || y !== c.py) {
        (isItem ? this.ca : this.pa).style.transform = `translate(${(x * this.ppg).toFixed(1)}px, ${(y * this.ppg).toFixed(1)}px)`;
        c.px = x; c.py = y;
      }
    },

    buildCard(o, inst, slot, old, p, dev) {
      const def = inst.def;
      const q = qualityClass(inst);
      const stats = statList(def.stat);
      const sc = statColor(def.stat);
      const glow = stats.length ? G.STAT_COLOR[stats[0]] + '33' : 'rgba(39,243,255,0.18)';
      const chips = stats.map((s) => `<span class="chip" style="--chip:${G.STAT_COLOR[s]}">${STAT_NAME[s] || s}</span>`).join('');
      const aff = (inst.affixes || []).map((a) => a && (a.text || a.name || a.desc)).filter(Boolean);
      const key = dev === 'touch' ? '' : G.input.label('interact');
      let cmp = '';
      if (slot) {
        const sk = dev === 'touch' ? '' : G.input.label((G.SLOT_BUTTONS.find((s) => s[0] === slot) || [])[1] || '');
        if (old) {
          const dt = (inst.tier || 0) - (old.tier || 0);
          const arrow = dt > 0 ? `<span class="up"><i class="ar u"></i>${dt}</span>` : dt < 0 ? `<span class="dn"><i class="ar d"></i>${-dt}</span>` : '';
          cmp = `<div class="hc-cmp"><span>Заменит${sk ? ' [' + esc(sk) + ']' : ''}:</span><canvas class="px cmpi" width="24" height="24"></canvas><span class="nm ${qualityClass(old)}">${esc(G.itemName(old))}</span>${arrow}</div>`;
        } else {
          cmp = `<div class="hc-cmp"><span>Свободный слот:</span><span class="nm">${SLOT_NAME[slot] || slot}${sk ? ' [' + esc(sk) + ']' : ''}</span></div>`;
        }
      }
      let hint = '';
      if (old && def.kind !== 'skill' && p.slots.primary && p.slots.secondary) hint = dev === 'touch' ? 'Джойстик вниз — во второй слот' : 'Удерживайте «вниз» — во второй слот';
      else if (old && def.kind === 'skill' && p.slots.skill1 && p.slots.skill2) hint = dev === 'touch' ? 'Джойстик вниз — во второй навык' : 'Удерживайте «вниз» — во второй навык';
      const price = o.price ? `<span class="hc-price ${p.gold < o.price ? 'no' : ''}">${o.price}${img('gold')}</span>` : '<span></span>';
      const verb = o.price ? 'Купить' : 'Взять';
      this.cardEl.className = 'h-card cf' + (inst.quality === 'legendary' ? ' q-legendary-card' : '');
      this.cardEl.style.setProperty('--bc', sc);
      this.cardEl.style.setProperty('--glow', glow);
      this.cardEl.innerHTML = `
        <div class="hc-head"><div class="hc-icon cf" style="--bc:${sc}"><canvas class="px" width="24" height="24"></canvas></div>
          <div><div class="hc-name ${q}">${esc(def.name)}${inst.tier > 0 ? `<span class="hc-tier">+${inst.tier}</span>` : ''}</div>
          <div class="hc-meta"><span>${KIND_NAME[def.kind] || ''}</span>${chips}${def.cooldown ? `<span>${def.cooldown} с</span>` : ''}</div></div></div>
        ${def.desc ? `<div class="hc-desc">${esc(def.desc)}</div>` : ''}
        ${aff.length ? `<div class="hc-aff">${aff.map((t) => `<div>${esc(t)}</div>`).join('')}</div>` : ''}
        ${cmp}${hint ? `<div class="hc-hint">${hint}</div>` : ''}
        <div class="hc-foot"><span class="hc-act">${key ? `<span class="h-key">${esc(key)}</span>` : ''}${verb}</span>${price}</div>`;
      paintItem(this.cardEl.querySelector('.hc-icon canvas'), def);
      const ci = this.cardEl.querySelector('.cmpi');
      if (ci && old) paintItem(ci, old.def);
    },

    // ---------------------------------------------------------------- toasts
    toasts: [],
    toast(o) {
      if (!this.toastsEl) return;
      const d = document.createElement('div');
      d.className = 'h-toast cf' + (o.big ? ' big' : '');
      d.style.setProperty('--bc', o.color || 'var(--cyan)');
      let ic = '';
      if (o.icon) ic = img(o.icon);
      d.innerHTML = `${ic}<div class="tt">${o.sub ? `<small>${esc(o.sub)}</small>` : ''}<span style="${o.textColor ? 'color:' + o.textColor : ''}" class="${o.cls || ''}">${esc(o.text)}</span></div>`;
      if (o.item) {
        const cv = document.createElement('canvas');
        cv.width = cv.height = 24; cv.className = 'px';
        paintItem(cv, o.item);
        d.insertBefore(cv, d.firstChild);
      } else if (o.mutation) {
        const cv = document.createElement('canvas');
        cv.width = cv.height = 16; cv.className = 'px';
        paintMutation(cv, o.mutation);
        d.insertBefore(cv, d.firstChild);
      }
      this.toastsEl.appendChild(d);
      this.toasts.push({ el: d, t: 0, life: o.life || 3 });
      while (this.toasts.length > 4) { const x = this.toasts.shift(); x.el.remove(); }
    },
    updateToasts(dt) {
      for (let i = this.toasts.length - 1; i >= 0; i--) {
        const x = this.toasts[i];
        x.t += dt;
        if (x.t > x.life && !x.out) { x.out = true; x.el.classList.add('out'); }
        if (x.t > x.life + 0.4) { x.el.remove(); this.toasts.splice(i, 1); }
      }
    },
    clearToasts() { for (const x of this.toasts) x.el.remove(); this.toasts = []; },

    bindEvents() {
      G.on('pickup', (e) => {
        if (!e || e.kind !== 'item' || !e.inst) return;
        const inst = e.inst;
        const st = statList(inst.def.stat)[0];
        this.toast({ item: inst.def, text: G.itemName(inst), sub: 'Получено', color: statColor(inst.def.stat), cls: qualityClass(inst), textColor: st ? null : null });
      });
      G.on('scroll', (e) => {
        const st = e && e.stat;
        if (!st) return;
        this.toast({ icon: 'chip', text: `${STAT_NAME[st] || st} +1`, sub: 'Чип усиления', color: G.STAT_COLOR[st], textColor: G.STAT_COLOR[st] });
      });
      G.on('mutation', (e) => {
        const m = (e && (e.mutation || e.m || e.def)) || e;
        this.toast({ mutation: m, text: mutName(m), sub: 'Имплант установлен', color: 'var(--violet)' });
      });
      G.on('blueprint', (e) => {
        const def = e && (e.def || (e.id && G.ITEMS[e.id]));
        this.toast({ item: def || null, icon: def ? null : 'chip', text: def ? def.name : 'Чертёж', sub: 'Найден чертёж', color: 'var(--cells)' });
      });
      G.on('unlock', (e) => {
        const def = e && (e.def || (e.id && G.ITEMS[e.id]));
        if (def) this.toast({ item: def, text: def.name, sub: 'Чертёж разблокирован', color: 'var(--cells)' });
      });
      G.on('bossStart', (e) => {
        const b = (e && (e.boss || e)) || (G.world && G.world.boss);
        const name = (b && (b.bossName || b.name)) || (G.world && G.world.boss && G.world.boss.bossName) || 'Страж ядра';
        this.toast({ icon: 'skull', text: name, sub: 'Угроза обнаружена', color: 'var(--magenta)', big: true, life: 3.5 });
      });
      G.on('bossDefeated', () => this.toast({ icon: 'skull', text: 'Страж уничтожен', sub: 'Выход разблокирован', color: 'var(--cyan)', big: true, life: 4 }));
      G.on('denied', (e) => {
        const s = e && e.slot && this.slots && this.slots[e.slot];
        if (s) { s.el.classList.remove('denied'); void s.el.offsetWidth; s.el.classList.add('denied'); }
      });
      G.on('runStart', () => { this.clearToasts(); this.reset(); });
    },
  };
  G.hud = hud;
})();

</script>
<script>/* js/ui.js */
'use strict';
// Menus & overlays: title (animated city backdrop), controls, settings, pause, death, victory,
// level banner, stat choice, collector, big map. Every screen is operable by mouse/touch AND
// keyboard/gamepad (spatial focus navigation driven from G.ui.update, called every fixed step).
(function () {
  const G = window.G;
  const H = () => G.hud;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sfx = (name, vol = 0.5) => { try { if (G.audio && G.audio.play) G.audio.play(name, { vol }); } catch (e) { /* audio optional */ } };
  const img = (name) => (H() && H().img ? H().img(name) : '');
  const fmt = (t) => (H() ? H().fmtTime(t) : Math.floor(t) + 's');
  const STAT_NAME = { brutality: 'Жестокость', tactics: 'Тактика', survival: 'Живучесть' };
  const STAT_K = { brutality: 'k-b', tactics: 'k-t', survival: 'k-s' };
  const STAT_WORD = { brutality: 'красного', tactics: 'фиолетового', survival: 'зелёного' };
  const STAT_HP = { brutality: 14, tactics: 14, survival: 32 };
  const mk = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const itemCanvas = (def, size = 24) => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size; cv.className = 'px';
    if (def && H()) H().paintItem(cv, def);
    return cv;
  };
  const statList = (s) => (Array.isArray(s) ? s : s ? [s] : []);
  const statColor = (s) => (H() ? H().statColor(s) : '#45466a');

  const ui = {
    el: null, layer: null, stack: [], t: 0, rep: {}, lastDev: null, bn: null,

    init() {
      this.el = document.getElementById('ui');
      this.el.innerHTML = '<div class="layer"></div><div class="banner" hidden></div>';
      this.layer = this.el.querySelector('.layer');
      this.bannerEl = this.el.querySelector('.banner');
      // we manage focus ourselves: keep native focus off buttons (prevents double activation by Enter/Space)
      this.el.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
      this.el.addEventListener('click', () => { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); }, true);
      this.applySettings(false);
    },

    // ---------------------------------------------------------------- screen stack & focus navigation
    top() { return this.stack[this.stack.length - 1] || null; },
    isModalOpen() { return this.stack.some((s) => s.modal); },
    push(sc) {
      const top = this.top();
      if (top && !sc.overlay) top.el.hidden = true;
      this.stack.push(sc);
      this.layer.appendChild(sc.el);
      this.el.classList.add('has-screen');
      sc.el.addEventListener('mousemove', (e) => {
        const it = e.target.closest && e.target.closest('[data-nav]');
        if (it && it !== sc.focus && sc.el.contains(it) && !it.disabled) this.setFocus(sc, it, false);
      });
      this.setFocus(sc, sc.el.querySelector('[data-focus]') || this.items(sc)[0], false);
      this.refreshHint(sc, true);
      return sc;
    },
    pop(sc) {
      sc = sc || this.top();
      const i = this.stack.indexOf(sc);
      if (i < 0) return;
      this.stack.splice(i, 1);
      sc.el.remove();
      if (sc.onClose) sc.onClose();
      const top = this.top();
      if (top) { top.el.hidden = false; this.refreshHint(top, true); }
      else this.el.classList.remove('has-screen');
    },
    closeKind(kind) { for (const s of this.stack.slice()) if (s.kind === kind || s.group === kind) this.pop(s); },
    hideAll() {
      for (const s of this.stack.slice().reverse()) { s.el.remove(); if (s.onClose) s.onClose(); }
      this.stack = [];
      if (this.el) this.el.classList.remove('has-screen');
    },
    items(sc) { return Array.from(sc.el.querySelectorAll('[data-nav]')).filter((e) => !e.disabled && e.offsetParent !== null); },
    setFocus(sc, el, auto) {
      if (sc.focus === el) return;
      if (sc.focus) sc.focus.classList.remove('focus');
      sc.focus = el || null;
      if (!el) return;
      el.classList.add('focus');
      if (auto && el.dataset.auto != null) el.click();
      const sp = el.closest('.coll-body');
      if (sp) {
        const r = el.getBoundingClientRect(), pr = sp.getBoundingClientRect();
        if (r.top < pr.top) sp.scrollTop -= pr.top - r.top + 4;
        else if (r.bottom > pr.bottom) sp.scrollTop += r.bottom - pr.bottom + 4;
      }
    },
    nav(sc, dir) {
      let f = sc.focus;
      if (f && !sc.el.contains(f)) f = sc.focus = null;
      const list = this.items(sc);
      if (!list.length) return;
      if (!f) { this.setFocus(sc, list[0], true); return; }
      if (f.dataset.slider && (dir === 'left' || dir === 'right')) { this.adjustSlider(f, dir === 'left' ? -0.1 : 0.1); return; }
      if (f.dataset.toggle && (dir === 'left' || dir === 'right')) { f.click(); return; }
      if (sc.onNav && sc.onNav(dir)) return;
      const r0 = f.getBoundingClientRect();
      const x0 = r0.left + r0.width / 2, y0 = r0.top + r0.height / 2;
      // score by edge gaps: rows spanning the current item's column win over far-away centered items
      const gapX = (r) => Math.max(0, r.left - r0.right, r0.left - r.right);
      const gapY = (r) => Math.max(0, r.top - r0.bottom, r0.top - r.bottom);
      let best = null, bs = Infinity;
      for (const e of list) {
        if (e === f) continue;
        const r = e.getBoundingClientRect();
        const dx = r.left + r.width / 2 - x0, dy = r.top + r.height / 2 - y0;
        let s;
        if (dir === 'down') { if (dy <= 3 || r.bottom <= r0.bottom) continue; s = gapY(r) + gapX(r) * 3 + Math.abs(dx) * 0.05; }
        else if (dir === 'up') { if (dy >= -3 || r.top >= r0.top) continue; s = gapY(r) + gapX(r) * 3 + Math.abs(dx) * 0.05; }
        else if (dir === 'right') { if (dx <= 3 || r.right <= r0.right) continue; s = gapX(r) + gapY(r) * 3 + Math.abs(dy) * 0.05; }
        else { if (dx >= -3 || r.left >= r0.left) continue; s = gapX(r) + gapY(r) * 3 + Math.abs(dy) * 0.05; }
        if (e.classList.contains('on')) s -= 6; // prefer the active tab
        if (s < bs) { bs = s; best = e; }
      }
      if (!best && (dir === 'up' || dir === 'down')) {
        // wrap vertically (menus): take the extreme item nearest in x
        let ext = null, ev = 0;
        for (const e of list) {
          const r = e.getBoundingClientRect();
          const v = (dir === 'down' ? -1 : 1) * (r.top + r.height / 2) * 10 - Math.abs(r.left + r.width / 2 - x0);
          if (e !== f && (ext === null || v > ev)) { ext = e; ev = v; }
        }
        best = ext;
      }
      if (best) { this.setFocus(sc, best, true); sfx('uiMove', 0.35); }
    },
    activate(sc) {
      const f = sc.focus;
      if (!f || f.disabled || !sc.el.contains(f)) return;
      if (f.dataset.slider) return;
      f.click();
    },
    consumeConfirm() { const I = G.input; I.consume('confirm'); I.consume('jump'); I.consume('attack1'); },
    consumeBack() { const I = G.input; I.consume('back'); I.consume('pause'); I.consume('interact'); },

    hintText() {
      const d = G.input.device;
      if (d === 'pad') return 'Крестовина — выбор · A — подтвердить · B — назад';
      return 'Стрелки / WASD — выбор · Enter / J — подтвердить · Esc — назад';
    },
    refreshHint(sc, force) {
      const dev = G.input.device;
      if (!force && dev === this.lastDev) return;
      this.lastDev = dev;
      const h = sc && sc.el.querySelector('.hint');
      if (h) h.innerHTML = this.hintText();
    },

    // called every fixed step (also while paused)
    update(dt) {
      this.t += dt;
      this.updateBanner(dt);
      const I = G.input;
      const sc = this.top();
      if (!sc) {
        if (G.game && G.game.state === 'play' && !G.game.paused && G.world && I.pressed('map')) { I.consume('map'); this.openMap(); }
        return;
      }
      this.refreshHint(sc, false);
      if (sc.update) sc.update(dt);
      if (sc !== this.top()) return;
      for (const d of ['up', 'down', 'left', 'right']) {
        if (I.pressed(d)) { this.nav(sc, d); this.rep[d] = 0.36; }
        else if (I.down(d)) { this.rep[d] = (this.rep[d] || 0.36) - dt; if (this.rep[d] <= 0) { this.nav(sc, d); this.rep[d] = 0.085; } }
      }
      if (sc.kind === 'map' && (I.pressed('map') || I.pressed('back') || I.pressed('confirm'))) { this.consumeBack(); this.consumeConfirm(); I.consume('map'); this.closeMap(); return; }
      if (I.pressed('confirm')) { this.consumeConfirm(); this.activate(sc); sfx('uiSelect', 0.45); }
      else if (I.pressed('back')) { this.consumeBack(); if (sc.onBack) { sc.onBack(); sfx('uiBack', 0.4); } }
    },

    // ---------------------------------------------------------------- settings helpers
    applySettings(save) {
      const S = G.settings;
      const st = document.getElementById('stage');
      if (st) st.classList.toggle('no-scanlines', S.scanlines === false);
      if (save) { try { G.saveSettings(); } catch (e) { /* storage */ } }
      try { if (G.audio && G.audio.setVolumes) G.audio.setVolumes({ music: S.music, sfx: S.sfx }); } catch (e) { /* audio optional */ }
    },
    adjustSlider(el, d) {
      const k = el.dataset.slider;
      const v = Math.round(G.clamp((G.settings[k] == null ? 0.7 : G.settings[k]) + d, 0, 1) * 10) / 10;
      G.settings[k] = v;
      this.paintSlider(el);
      this.applySettings(true);
      if (k === 'sfx') sfx('uiMove', 0.6);
    },
    paintSlider(el) {
      const v = G.settings[el.dataset.slider];
      const pct = Math.round((v == null ? 0.7 : v) * 100);
      el.querySelector('.trk i').style.width = pct + '%';
      el.querySelector('.trk b').style.left = pct + '%';
      el.querySelector('.val').textContent = pct + '%';
    },
    toggleFullscreen() {
      const d = document, el = d.documentElement;
      try {
        if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return true; }
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return false;
        const r = req.call(el, { navigationUI: 'hide' });
        const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* unsupported */ } };
        if (r && r.then) r.then(lock).catch(() => {}); else lock();
        return true;
      } catch (e) { return false; }
    },

    // ---------------------------------------------------------------- TITLE
    showTitle(onStart) {
      this.hideAll();
      this.clearBanner();
      const m = G.meta || {};
      const best = m.bestTime ? fmt(m.bestTime) : '—';
      const el = mk(`<div class="scr title enter">
        <div class="t-logo"><div class="glitch jitter" data-text="DEAD CIRCUITS">DEAD CIRCUITS</div><div class="t-sub">Нейро-рогалик</div></div>
        <div class="t-menu">
          <button class="mbtn cf primary" data-nav data-focus data-a="play">Играть</button>
          <button class="mbtn cf" data-nav data-a="controls">Управление</button>
          <button class="mbtn cf" data-nav data-a="settings">Настройки</button>
        </div>
        <div class="t-meta cf"><span>Забеги<b>${m.runs || 0}</b></span><span>Победы<b>${m.wins || 0}</b></span><span>Рекорд<b>${best}</b></span><span>Уничтожено<b>${m.kills || 0}</b></span>${(m.unlocked || []).length ? `<span>Чертежи<b>${m.unlocked.length}</b></span>` : ''}</div>
        <div class="hint"></div><div class="t-ver">v${esc(G.VERSION || '1.0')}</div></div>`);
      const sc = this.push({ el, kind: 'title' });
      el.querySelector('[data-a=play]').onclick = () => { sfx('uiSelect', 0.6); this.hideAll(); onStart(); };
      el.querySelector('[data-a=controls]').onclick = () => this.showControls();
      el.querySelector('[data-a=settings]').onclick = () => this.showSettings();
      return sc;
    },

    // ---------------------------------------------------------------- CONTROLS
    showControls(group) {
      const dev = G.input.device === 'pad' ? 'pad' : G.input.device === 'touch' || document.body.classList.contains('touch-mode') ? 'touch' : 'kb';
      const el = mk(`<div class="scr dim enter"><div class="win cf">
        <div class="win-h"><div class="ttl cy">Управление</div>
