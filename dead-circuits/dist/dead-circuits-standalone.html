<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dead Circuits</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap">
<style>
/* DEAD CIRCUITS — page shell + all DOM UI (HUD, menus, touch controls).
   UI is sized in game pixels: --u = one game pixel in CSS px (game.js sets --s = stage px per game px). */
:root {
  --s: 2;
  --u: calc(var(--s) * 1px);
  --ink: #05040a;
  --bg: #07060d;
  --panel: #120f22;
  --panel-bg: rgba(10, 8, 22, 0.88);
  --line: #2b2a45;
  --text: #e9e6ff;
  --dim: #8d8fb8;
  --dim2: #5c5f86;
  --cyan: #27f3ff;
  --magenta: #ff2a8a;
  --violet: #9b5cff;
  --yellow: #ffe14d;
  --orange: #ff8a2a;
  --red: #ff3348;
  --green: #48ff8a;
  --brutality: #ff3d4f;
  --tactics: #b46cff;
  --survival: #4dff7a;
  --cells: #35c8ff;
  --gold: #ffc23d;
  --font-pixel: 'Tiny5', ui-monospace, 'Menlo', 'Consolas', 'Courier New', monospace;
  --font-display: 'Press Start 2P', 'Tiny5', ui-monospace, 'Menlo', 'Consolas', 'Courier New', monospace;
  --sh: 0 var(--u) 0 rgba(0, 0, 0, 0.9);
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font-pixel); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
#stage { position: relative; width: 960px; height: 540px; overflow: hidden; background: #000; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#stage::after { /* scanlines */
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(var(--s) * 1px), rgba(0,0,0,0.13) calc(var(--s) * 1px), rgba(0,0,0,0.13) calc(var(--s) * 2px));
  mix-blend-mode: multiply;
}
#stage.no-scanlines::after { display: none; }
#hud, #ui { position: absolute; inset: 0; pointer-events: none; }
#hud { z-index: 2; }
#ui { z-index: 3; }
#touch { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
[hidden] { display: none !important; }
#hud, #ui { font-size: calc(var(--u) * 8); line-height: 1.25; text-shadow: var(--sh); font-synthesis: none; -webkit-font-smoothing: none; }
#hud *, #ui * { box-sizing: border-box; }
/* CSS-drawn arrow (pixel fonts lack arrow glyphs) */
.ar { display: inline-block; width: calc(var(--u) * 5); height: calc(var(--u) * 4); background: currentColor; vertical-align: middle; clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 calc(var(--u) * 1); }
.ar.d { transform: rotate(180deg); } .ar.l { transform: rotate(-90deg); } .ar.r { transform: rotate(90deg); }
.card .lv .ar { color: var(--k); }
img.px, canvas.px, .px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ------------------------------------------------------------------ chamfered neon frame
   .cf: translucent fill clipped to a chamfered shape; ::after draws a 1-game-px ring in --bc. */
.cf {
  --c: calc(var(--u) * 4); --b: var(--u); --bc: var(--cyan); --bg: var(--panel-bg);
  position: relative; background: var(--bg);
  clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c));
}
.cf::after {
  --ci: calc(var(--c) + var(--b) * 0.42);
  content: ''; position: absolute; inset: 0; pointer-events: none; background: var(--bc); z-index: 3;
  clip-path: polygon(evenodd,
    var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c), var(--c) 0,
    var(--ci) var(--b), calc(100% - var(--b)) var(--b), calc(100% - var(--b)) calc(100% - var(--ci)), calc(100% - var(--ci)) calc(100% - var(--b)), var(--b) calc(100% - var(--b)), var(--b) var(--ci), var(--ci) var(--b));
}
.cf.sm { --c: calc(var(--u) * 2.5); }
.cf.lg { --c: calc(var(--u) * 7); }

/* color keys: --k main, --ka translucent glow, --kd dark tint */
.k-b { --k: #ff3d4f; --ka: rgba(255, 61, 79, 0.35); --kd: #4a0f18; }
.k-t { --k: #b46cff; --ka: rgba(180, 108, 255, 0.35); --kd: #2c1450; }
.k-s { --k: #4dff7a; --ka: rgba(77, 255, 122, 0.3); --kd: #0f3a1e; }
.k-c { --k: #27f3ff; --ka: rgba(39, 243, 255, 0.3); --kd: #0a3040; }
.k-y { --k: #ffe14d; --ka: rgba(255, 225, 77, 0.3); --kd: #3a3008; }
.k-v { --k: #b9c2ff; --ka: rgba(185, 194, 255, 0.3); --kd: #1e2240; }
.k-g { --k: #7dffb1; --ka: rgba(125, 255, 177, 0.3); --kd: #0f3a24; }

/* ================================================================== HUD */
#hud { color: var(--text); }
.h-bl { position: absolute; left: calc(var(--u) * 8); bottom: calc(var(--u) * 5); display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 3); }
.h-muts { display: flex; gap: calc(var(--u) * 2); min-height: calc(var(--u) * 13); }
.h-mut { --c: calc(var(--u) * 2.5); width: calc(var(--u) * 13); height: calc(var(--u) * 13); }
.h-mut canvas { position: absolute; inset: calc(var(--u) * 1.5); width: calc(var(--u) * 10); height: calc(var(--u) * 10); }
.h-slots { display: flex; gap: calc(var(--u) * 4); align-items: flex-start; }
.h-slot { position: relative; width: calc(var(--u) * 22); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.5); }
.h-sf { --c: calc(var(--u) * 3.5); --bc: #45466a; --bg: rgba(8, 7, 18, 0.82); width: calc(var(--u) * 22); height: calc(var(--u) * 22); background-image: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(0,0,0,0) 45%); }
.h-sf canvas { position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * 1); width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
.h-slot.empty .h-sf { --bc: #2b2a45; --bg: rgba(8, 7, 18, 0.55); }
.h-slot.empty .h-sf canvas { opacity: 0.25; }
.h-cd { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: rgba(4, 3, 12, 0.72); transform-origin: bottom; transform: scaleY(0); z-index: 1; }
.h-cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: calc(var(--u) * 8); color: #fff; z-index: 2; }
.h-ammo { position: absolute; right: calc(var(--u) * 1.5); bottom: calc(var(--u) * 0.5); font-size: calc(var(--u) * 8);  color: var(--yellow); z-index: 2; }
.h-slot.ready .h-sf { animation: h-ready 0.35s steps(4) 1; }
.h-slot.denied .h-sf { animation: h-denied 0.3s steps(6) 1; }
@keyframes h-ready { 0% { filter: brightness(2.2); } 100% { filter: none; } }
@keyframes h-denied { 0%, 100% { transform: none; } 20% { transform: translateX(calc(var(--u) * -2)); } 60% { transform: translateX(calc(var(--u) * 2)); } 50% { filter: brightness(1.6) saturate(0) sepia(1) hue-rotate(-50deg); } }
.h-key { min-width: calc(var(--u) * 11); height: calc(var(--u) * 7); padding: 0 calc(var(--u) * 1.5); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: calc(var(--u) * 8); line-height: 1; color: #cfd3ff; background: #1b1a2e; border: var(--u) solid #45466a; border-radius: calc(var(--u) * 3.5); text-shadow: none; }
.h-key:empty { display: none; }
.h-key.pad-X { color: #7fb4ff; border-color: #3e6ad8; }
.h-key.pad-Y { color: #ffe36b; border-color: #c49a12; }
.h-key.pad-A { color: #6dff9a; border-color: #1f9f4a; }
.h-key.pad-B { color: #ff7b8a; border-color: #c02a3a; }
.h-cnt { position: absolute; right: calc(var(--u) * 1.5); bottom: calc(var(--u) * 0.5); z-index: 2; font-family: var(--font-pixel); font-size: calc(var(--u) * 8); color: #fff; }
.h-pips { position: absolute; left: calc(var(--u) * 2); right: calc(var(--u) * 2); top: calc(var(--u) * 1.5); display: flex; gap: calc(var(--u) * 1); z-index: 2; }
.h-pips i { flex: 1; height: calc(var(--u) * 1.5); background: var(--survival); box-shadow: 0 0 calc(var(--u) * 2) rgba(77, 255, 122, 0.8); }
.h-pips i.off { background: #2b3a33; box-shadow: none; }
.h-flask.empty canvas { filter: grayscale(1) brightness(0.55); }
.h-flask.healing .h-sf { --bc: var(--survival); }

.h-hprow { display: flex; align-items: center; gap: calc(var(--u) * 5); }
.h-stats { display: flex; gap: calc(var(--u) * 4); font-family: var(--font-display); font-size: calc(var(--u) * 8); line-height: 1; }
.h-stats b { font-weight: 400; min-width: calc(var(--u) * 5); text-align: center; }
.h-stats b.pop { animation: h-pop 0.6s steps(6) 1; }
@keyframes h-pop { 0% { transform: scale(2.2); filter: brightness(2); } 100% { transform: none; } }
.sB { color: var(--brutality); } .sT { color: var(--tactics); } .sS { color: var(--survival); }
.h-hp { --c: calc(var(--u) * 2.5); --bc: #2c3b36; --bg: rgba(6, 12, 10, 0.86); width: calc(var(--u) * 206); height: calc(var(--u) * 9); }
.h-hp > i { position: absolute; left: var(--u); top: var(--u); bottom: var(--u); width: calc(100% - var(--u) * 2); transform-origin: left; transform: scaleX(0); }
.h-hp .trail { background: linear-gradient(to bottom, #ffe0e4 0, #ffe0e4 var(--u), #ff8795 var(--u)); }
.h-hp .rec { background: repeating-linear-gradient(90deg, #ff8a2a 0, #ff8a2a calc(var(--u) * 2), #d76410 calc(var(--u) * 2), #d76410 calc(var(--u) * 3)); }
.h-hp .fill { background: linear-gradient(to bottom, #c6ffd6 0, #c6ffd6 var(--u), #56f08a var(--u), #2fcf62 60%, #1c9a47 60%); }
.h-hp .edge { position: absolute; top: var(--u); bottom: var(--u); left: var(--u); width: var(--u); background: #fff; transform: none; box-shadow: 0 0 calc(var(--u) * 3) #b6ff3b; }
.h-hpt { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 8); line-height: 1; color: #fff; text-shadow: var(--u) 0 0 #05040a, calc(var(--u) * -1) 0 0 #05040a, 0 var(--u) 0 #05040a, 0 calc(var(--u) * -1) 0 #05040a; }
.h-hp.low { --bc: #ff3348; animation: h-low 0.9s ease-in-out infinite; }
.h-hp.low .fill { background: linear-gradient(to bottom, #ffd0d0 0, #ffd0d0 var(--u), #ff5b5b var(--u), #e02c3c 60%, #a8182a 60%); }
@keyframes h-low { 50% { filter: brightness(1.6); } }
.h-hp.healing .fill { filter: brightness(1.35); }

.h-br { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 5); display: grid; grid-template-columns: auto auto; grid-template-areas: "seed seed" "time time" "cur map"; column-gap: calc(var(--u) * 4); row-gap: calc(var(--u) * 1); align-items: end; }
.h-seed { grid-area: seed; justify-self: end; font-size: calc(var(--u) * 8); color: var(--dim2); }
.h-time { grid-area: time; justify-self: end; margin-right: calc(var(--u) * 26); font-family: var(--font-pixel); font-size: calc(var(--u) * 8); color: #c9ccef; }
.h-cur { grid-area: cur; display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 3); padding-bottom: calc(var(--u) * 1); }
.h-cur > div { display: flex; align-items: center; gap: calc(var(--u) * 2); font-family: var(--font-display); font-size: calc(var(--u) * 8); line-height: 1; position: relative; }
.h-cur img { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.h-cells { color: var(--cells); } .h-gold { color: var(--gold); }
.h-cur .bump { animation: h-bump 0.25s steps(3) 1; }
@keyframes h-bump { 0% { transform: translateY(calc(var(--u) * -2)); filter: brightness(1.8); } 100% { transform: none; } }
.h-gain { position: absolute; right: calc(100% + var(--u) * 3); top: 0; font-size: calc(var(--u) * 8); pointer-events: none; animation: h-gain 0.9s linear 1 forwards; }
@keyframes h-gain { from { transform: none; opacity: 1; } to { transform: translateY(calc(var(--u) * -8)); opacity: 0; } }
.h-map { grid-area: map; --c: calc(var(--u) * 5); --bc: #3d4fa0; --bg: rgba(5, 8, 22, 0.8); width: calc(var(--u) * 98); height: calc(var(--u) * 56); pointer-events: auto; cursor: pointer; }
.h-map canvas { position: absolute; left: var(--u); top: var(--u); width: calc(var(--u) * 96); height: calc(var(--u) * 54); }
.h-map .h-mapkey { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 2); z-index: 4; font-family: var(--font-pixel); font-size: calc(var(--u) * 8); color: #7f8fd8; }

/* boss bar */
.h-boss { position: absolute; left: 50%; top: calc(var(--u) * 7); width: calc(var(--u) * 210); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); transition: opacity 0.6s; }
.h-boss.gone { opacity: 0; }
.h-boss-name { font-family: var(--font-display); font-size: calc(var(--u) * 8);  letter-spacing: calc(var(--u) * 1); color: #ffd6e6; text-transform: uppercase; display: flex; align-items: center; gap: calc(var(--u) * 4); }
.h-boss-name::before, .h-boss-name::after { content: ''; width: calc(var(--u) * 18); height: var(--u); background: linear-gradient(90deg, transparent, var(--magenta)); }
.h-boss-name::after { transform: scaleX(-1); }
.h-boss-bar { --c: calc(var(--u) * 3); --bc: var(--magenta); --bg: rgba(20, 4, 14, 0.88); width: 100%; height: calc(var(--u) * 8); }
.h-boss-bar > i { position: absolute; left: var(--u); top: var(--u); bottom: var(--u); width: calc(100% - var(--u) * 2); transform-origin: left; }
.h-boss-bar .trail { background: linear-gradient(to bottom, #fff0f6 0, #fff0f6 var(--u), #ffa3c9 var(--u)); }
.h-boss-bar .fill { background: linear-gradient(to bottom, #ffb3d4 0, #ffb3d4 var(--u), #ff2a8a var(--u), #d61468 60%, #9c0c4b 60%); }
.h-boss-bar .tick { position: absolute; top: 0; bottom: 0; width: var(--u); background: var(--ink); z-index: 2; transform: none; }
.h-boss-bar .tick::after { content: ''; position: absolute; left: 0; top: 0; width: var(--u); height: calc(var(--u) * 2); background: #ffd6e6; }
.h-boss.hit .h-boss-bar { animation: h-bosshit 0.15s steps(2) 1; }
@keyframes h-bosshit { 50% { filter: brightness(1.8); } }

/* interaction prompt & item card (positioned in game px via transform) */
.h-anchor { position: absolute; left: 0; top: 0; will-change: transform; }
.h-prompt { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2) calc(var(--u) * 5) calc(var(--u) * 2) calc(var(--u) * 3); white-space: nowrap; font-size: calc(var(--u) * 8); --c: calc(var(--u) * 3); --bc: rgba(39, 243, 255, 0.8); --bg: rgba(6, 5, 16, 0.9); }
.h-prompt .h-key { height: calc(var(--u) * 8); }
.h-card { width: calc(var(--u) * 158); padding: calc(var(--u) * 5) calc(var(--u) * 6) calc(var(--u) * 5); --c: calc(var(--u) * 6); --bg: rgba(8, 6, 18, 0.94); display: flex; flex-direction: column; gap: calc(var(--u) * 3.5); font-size: calc(var(--u) * 8); }
.h-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 24); background: linear-gradient(to bottom, var(--glow, rgba(39,243,255,0.18)), transparent); pointer-events: none; }
.hc-head { display: flex; gap: calc(var(--u) * 5); align-items: center; position: relative; }
.hc-icon { --c: calc(var(--u) * 3); width: calc(var(--u) * 26); height: calc(var(--u) * 26); flex: none; --bg: rgba(0, 0, 0, 0.5); }
.hc-icon canvas { position: absolute; inset: var(--u); width: calc(var(--u) * 24); height: calc(var(--u) * 24); }
.hc-name { font-size: calc(var(--u) * 8);  line-height: 1.1; }
.hc-tier { font-family: var(--font-display); font-size: calc(var(--u) * 8); color: var(--yellow); margin-left: calc(var(--u) * 2); }
.hc-meta { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3); align-items: center; margin-top: calc(var(--u) * 2); font-size: calc(var(--u) * 8); color: var(--dim); text-transform: uppercase; letter-spacing: calc(var(--u) * 0.4); }
.chip { display: inline-flex; align-items: center; gap: calc(var(--u) * 1.5); padding: 0 calc(var(--u) * 2.5); height: calc(var(--u) * 8); font-size: calc(var(--u) * 8); color: #0a0714; text-shadow: none;  background: var(--chip, var(--cyan)); clip-path: polygon(calc(var(--u)*2) 0, 100% 0, 100% calc(100% - var(--u)*2), calc(100% - var(--u)*2) 100%, 0 100%, 0 calc(var(--u)*2)); text-transform: none; letter-spacing: 0; }
.hc-desc { color: #cfd0ec; line-height: 1.3; }
.hc-aff { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.hc-aff div { color: #ffe9a8; padding-left: calc(var(--u) * 7); position: relative; line-height: 1.25; }
.hc-aff div::before { content: ''; position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * 2.5); width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--yellow); transform: rotate(45deg); }
.hc-cmp { display: flex; align-items: center; gap: calc(var(--u) * 3); padding-top: calc(var(--u) * 3.5); border-top: var(--u) dashed #34335a; color: var(--dim); font-size: calc(var(--u) * 8); }
.hc-cmp canvas { width: calc(var(--u) * 12); height: calc(var(--u) * 12); flex: none; }
.hc-cmp .nm { color: #d8d8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc-cmp > span:first-child { white-space: nowrap; }
.hc-cmp .up, .hc-cmp .dn { white-space: nowrap; display: inline-flex; align-items: center; margin-left: auto; }
.hc-cmp .up { color: var(--green); } .hc-cmp .dn { color: var(--red); }
.hc-hint { font-size: calc(var(--u) * 8); color: var(--dim2); margin-top: calc(var(--u) * -1.5); }
.hc-foot { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 4); }
.hc-act { display: flex; align-items: center; gap: calc(var(--u) * 3); font-size: calc(var(--u) * 8); color: #fff; }
.hc-price { display: flex; align-items: center; gap: calc(var(--u) * 2); font-family: var(--font-display); font-size: calc(var(--u) * 8); color: var(--gold); }
.hc-price img { width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
.hc-price.no { color: var(--red); }
.q-normal { color: #f0eeff; } .q-rare { color: #5fdcff; } .q-legendary { color: #ffc23d; }
.h-card.q-legendary-card { --bc: var(--gold) !important; }

/* toasts */
.h-toasts { position: absolute; right: calc(var(--u) * 8); top: calc(var(--u) * 8); display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 3); }
.h-toast { --c: calc(var(--u) * 3); --bg: rgba(8, 6, 18, 0.86); display: flex; align-items: center; gap: calc(var(--u) * 4); padding: calc(var(--u) * 2.5) calc(var(--u) * 7) calc(var(--u) * 2.5) calc(var(--u) * 3); font-size: calc(var(--u) * 8); max-width: calc(var(--u) * 210); animation: h-toast-in 0.25s steps(5) 1; }
.h-toast > canvas, .h-toast > img { width: calc(var(--u) * 12); height: calc(var(--u) * 12); flex: none; }
.h-toast .tt { display: flex; flex-direction: column; line-height: 1.15; }
.h-toast .tt small { font-size: calc(var(--u) * 8); color: var(--dim); text-transform: uppercase; letter-spacing: calc(var(--u) * 0.5); }
.h-toast.out { animation: h-toast-out 0.35s steps(5) 1 forwards; }
.h-toast.big { font-size: calc(var(--u) * 8); }

<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud" hidden></div>
    <div id="ui"></div>

<script>/* js/core.js */
'use strict';
// DEAD CIRCUITS — core: namespace, math, RNG, palette, pixel drawing, bitmap font,
// input (keyboard / mouse / gamepad / touch), camera, event bus.
(function () {
  const G = (window.G = window.G || {});
  G.VERSION = '0.9';
  G.W = 480;           // internal render width (px)
  G.H = 270;           // internal render height (px)
  G.TILE = 16;         // tile size (px)
  G.DT = 1 / 60;       // fixed simulation step
  G.GRAVITY = 1150;    // px/s^2

  // Tile codes (see ARCHITECTURE.md)
  G.T = { AIR: 0, SOLID: 1, PLATFORM: 2, LADDER: 3, SPIKES: 4 };

  // ---------------------------------------------------------------- math
  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
  G.sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  G.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  G.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  G.easeOut = (t) => 1 - (1 - t) * (1 - t) * (1 - t);
  G.easeIn = (t) => t * t * t;
  G.easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  G.angleLerp = (a, b, t) => {
    let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  };
  G.hashStr = (s) => {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  // ---------------------------------------------------------------- RNG (mulberry32)
  class RNG {
    constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
    next() {
      let t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    float(a = 0, b = 1) { return a + (b - a) * this.next(); }
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); } // inclusive
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    sign() { return this.next() < 0.5 ? -1 : 1; }
    // list of [item, weight]
    weighted(list) {
      let total = 0;
      for (const e of list) total += e[1];
      let r = this.next() * total;
      for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; }
      return list[list.length - 1][0];
    }
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(this.next() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    fork() { return new RNG(Math.floor(this.next() * 4294967296)); }
  }
  G.RNG = RNG;
  G.rand = new RNG((Math.random() * 4294967296) >>> 0); // cosmetic randomness only

  // ---------------------------------------------------------------- palette
  G.PAL = {
    ink: '#05040a', outline: '#0b0814', bg0: '#07060d', bg1: '#0e0b1c', bg2: '#171330',
    steel0: '#1b1a2e', steel1: '#2b2a45', steel2: '#45466a', steel3: '#6f7299', steel4: '#aab0d6',
    cyan: '#27f3ff', cyanDim: '#0e8fa6', magenta: '#ff2a8a', pink: '#ff5cc8', violet: '#9b5cff',
    yellow: '#ffe14d', orange: '#ff8a2a', red: '#ff3348', green: '#48ff8a', lime: '#b6ff3b',
    white: '#f4f1ff', skin: '#c9a48c',
    brutality: '#ff3d4f', tactics: '#b46cff', survival: '#4dff7a',
    cells: '#35c8ff', gold: '#ffc23d',
  };
  G.STAT_COLOR = { brutality: G.PAL.brutality, tactics: G.PAL.tactics, survival: G.PAL.survival };

  // ---------------------------------------------------------------- pixel drawing
  // All coordinates are rounded so primitives stay on the pixel grid.
  G.px = {
    rect(ctx, x, y, w, h, c) {
      if (c) ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    },
    // Bresenham line with a square brush of size t
    line(ctx, x0, y0, x1, y1, c, t = 1) {
      if (c) ctx.fillStyle = c;
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      const o = (t / 2) | 0;
      for (let guard = 0; guard < 2000; guard++) {
        ctx.fillRect(x0 - o, y0 - o, t, t);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    },
    disc(ctx, cx, cy, r, c) {
      if (c) ctx.fillStyle = c;
      cx = Math.round(cx); cy = Math.round(cy); r = Math.max(0, Math.round(r));
      for (let y = -r; y <= r; y++) {
        const hw = Math.floor(Math.sqrt(r * r - y * y) + 0.5);
        ctx.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
      }
    },
    ring(ctx, cx, cy, r, c, t = 1) {
      if (c) ctx.fillStyle = c;
      cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
      const steps = Math.max(12, Math.floor(r * 6.3));
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        ctx.fillRect(Math.round(cx + Math.cos(a) * r) - (t >> 1), Math.round(cy + Math.sin(a) * r) - (t >> 1), t, t);
      }
    },
  };

  // Cached radial-gradient sprites for additive glows.
  const glowCache = new Map();
  G.glowSprite = function (color, r) {
    r = Math.max(2, Math.round(r / 2) * 2);
    const key = color + '|' + r;
    let c = glowCache.get(key);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = r * 2;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(r, r, 0, r, r, r);
      grd.addColorStop(0, color);
      grd.addColorStop(0.25, color + 'aa');
      grd.addColorStop(0.6, color + '33');
      grd.addColorStop(1, color + '00');
      g.fillStyle = grd;
      g.fillRect(0, 0, r * 2, r * 2);
      glowCache.set(key, c);
    }
    return c;
  };
  // Colors passed to glow must be #rrggbb.
  G.drawGlow = function (ctx, x, y, r, color, alpha = 1) {
    if (alpha <= 0.01 || r < 1) return;
    const s = G.glowSprite(color, r);
    const prev = ctx.globalAlpha;
    ctx.globalAlpha = prev * Math.min(1, alpha);
    ctx.drawImage(s, Math.round(x - s.width / 2), Math.round(y - s.height / 2));
    ctx.globalAlpha = prev;
  };

  // Lights collected each frame, drawn additively after the world.
  G.lights = [];
  G.addLight = function (x, y, r, color, a = 0.6) { G.lights.push(x, y, r, color, a); };

  // ---------------------------------------------------------------- 3x5 bitmap font
  const GLYPHS = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
    '8': '111101111101111', '9': '111101111001111', '!': '010010010000010', '+': '000010111010000',
    '-': '000000111000000', '?': '111001011000010', '/': '001001010100100', 'x': '000101010101000',
    '.': '000000000000010', '%': '101001010100101', ':': '000010000010000', ' ': '000000000000000',
    'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011', 'D': '110101101101110',
    'E': '111100110100111', 'F': '111100110100100', 'G': '011100101101011', 'H': '101101111101101',
    'I': '111010010010111', 'J': '001001001101010', 'K': '101101110101101', 'L': '100100100100111',
    'M': '101111111101101', 'N': '110101101101101', 'O': '010101101101010', 'P': '110101110100100',
    'Q': '010101101110011', 'R': '110101110101101', 'S': '011100010001110', 'T': '111010010010010',
    'U': '101101101101111', 'V': '101101101101010', 'W': '101101111111101', 'X': '101101010101101',
    'Y': '101101010010010', 'Z': '111001010100111', '#': '101111101111101', '$': '011110010011110',
    '<': '001010100010001', '>': '100010001010100', '=': '000111000111000', '*': '101010101000000',
  };
  const textCache = new Map();
  G.font = {
    width(text, scale = 1) { return text.length ? (text.length * 4 - 1) * scale : 0; },
    // Pre-rendered, outlined text sprite (cached)
    sprite(text, color, scale = 1, outline = G.PAL.ink) {
      text = String(text).toUpperCase();
      const key = text + '|' + color + '|' + scale + '|' + outline;
      let c = textCache.get(key);
      if (c) return c;
      if (textCache.size > 600) textCache.clear();
      const w = G.font.width(text, scale) + 2 * scale, h = 7 * scale;
      c = document.createElement('canvas');
      c.width = Math.max(1, w); c.height = h;
      const g = c.getContext('2d');
      const plot = (ox, oy, col) => {
        g.fillStyle = col;
        for (let i = 0; i < text.length; i++) {
          const gl = GLYPHS[text[i]] || GLYPHS['?'];
          for (let p = 0; p < 15; p++) {
            if (gl[p] === '1') g.fillRect(ox + (i * 4 + (p % 3)) * scale, oy + ((p / 3) | 0) * scale, scale, scale);
          }
        }
      };
      if (outline) {
        for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2], [0, 0], [2, 2], [0, 2], [2, 0]]) plot(dx * scale, dy * scale, outline);
      }
      plot(scale, scale, color);
      textCache.set(key, c);
      return c;
    },
    // align: 'left' | 'center' | 'right'
    draw(ctx, text, x, y, color = G.PAL.white, scale = 1, align = 'left', outline = G.PAL.ink) {
      const s = G.font.sprite(text, color, scale, outline);
      let ox = x;
      if (align === 'center') ox = x - s.width / 2;
      else if (align === 'right') ox = x - s.width;

  };

  // ---------------------------------------------------------------- event bus
  const listeners = {};
  G.on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); return fn; };
  G.off = (evt, fn) => { const l = listeners[evt]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } };
  G.emit = (evt, data) => {
    const l = listeners[evt];
    if (!l) return;
    for (const fn of l.slice()) { try { fn(data); } catch (e) { console.error('[event ' + evt + ']', e); } }
  };

  // ---------------------------------------------------------------- input
  // Actions: left right up down jump roll attack1 attack2 skill1 skill2 heal interact pause map
  const KEYMAP = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    jump: ['Space'], roll: ['ShiftLeft', 'ShiftRight', 'KeyL'],
    attack1: ['KeyJ'], attack2: ['KeyK'], skill1: ['KeyQ', 'KeyU'], skill2: ['KeyE', 'KeyI'],
    heal: ['KeyR', 'KeyH'], interact: ['KeyF'], pause: ['Escape', 'KeyP'], map: ['Tab', 'KeyM'],
    confirm: ['Enter', 'Space', 'KeyJ'], back: ['Escape', 'Backspace'],
  };
  // Standard gamepad mapping
  const PADMAP = {
    jump: [0], interact: [1], attack1: [2], attack2: [3], heal: [4], roll: [5, 10],
    skill1: [6], skill2: [7], map: [8], pause: [9], up: [12], down: [13], left: [14], right: [15],
    confirm: [0], back: [1],
  };
  const LABELS = {
    kb: { attack1: 'J', attack2: 'K', skill1: 'Q', skill2: 'E', heal: 'R', interact: 'F', roll: 'SHIFT', jump: 'SPACE', map: 'M', pause: 'ESC' },
    pad: { attack1: 'X', attack2: 'Y', skill1: 'LT', skill2: 'RT', heal: 'LB', interact: 'B', roll: 'RB', jump: 'A', map: 'SELECT', pause: 'START' },
    touch: { attack1: '', attack2: '', skill1: '', skill2: '', heal: '', interact: '', roll: '', jump: '', map: '', pause: '' },
  };
  const ACTIONS = Object.keys(KEYMAP);
  const keyToActions = {};
  for (const a of ACTIONS) for (const k of KEYMAP[a]) (keyToActions[k] = keyToActions[k] || []).push(a);

  const input = {
    device: 'kb',
    held: {},       // action -> bool (combined)
    _kb: {},        // action -> count of held keys
    _mouse: {},     // action -> bool
    _virt: {},      // action -> bool (touch)
    _pad: {},       // action -> bool
    _pressed: {},   // edges queued since last step
    _released: {},
    axisX: 0, axisY: 0,
    enabled: true,
    down(a) { return !!this.held[a]; },
    pressed(a) { return !!this._pressed[a]; },
    released(a) { return !!this._released[a]; },
    consume(a) { this._pressed[a] = false; },
    label(a) { return (LABELS[this.device] || LABELS.kb)[a] || ''; },
    _recompute(a) {
      const was = !!this.held[a];
      const now = (this._kb[a] || 0) > 0 || !!this._mouse[a] || !!this._virt[a] || !!this._pad[a];
      this.held[a] = now;
      if (now && !was) this._pressed[a] = true;
      if (!now && was) this._released[a] = true;
    },
    setVirtual(a, on) {
      if (!!this._virt[a] === !!on) return;
      this._virt[a] = !!on;
      this.device = 'touch';
      this._recompute(a);
    },
    clearAll() {
      for (const a of ACTIONS) { this._kb[a] = 0; this._mouse[a] = false; this._virt[a] = false; this._pad[a] = false; this.held[a] = false; }
      this._pressed = {}; this._released = {};
    },
    // called once per fixed step, before the simulation
    poll() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      let pad = null;
      for (const p of pads) if (p && p.connected) { pad = p; break; }
      this.axisX = 0; this.axisY = 0;
      if (pad) {
        const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
        const btn = (i) => { const b = pad.buttons[i]; return !!b && (b.pressed || b.value > 0.5); };
        let any = Math.abs(ax) > 0.35 || Math.abs(ay) > 0.35;
        for (const a in PADMAP) {
          let on = false;
          for (const i of PADMAP[a]) if (btn(i)) on = true;
          if (a === 'left' && ax < -0.35) on = true;
          if (a === 'right' && ax > 0.35) on = true;
          if (a === 'up' && ay < -0.5) on = true;
          if (a === 'down' && ay > 0.5) on = true;
          if (on) any = true;
          if (on !== !!this._pad[a]) { this._pad[a] = on; this._recompute(a); }
        }
        if (any) this.device = 'pad';
        if (Math.abs(ax) > 0.2) this.axisX = ax;
        if (Math.abs(ay) > 0.2) this.axisY = ay;
      }
    },
    // called after each fixed step
    endStep() { this._pressed = {}; this._released = {}; },
  };
  G.input = input;

  const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (GAME_KEYS.has(e.code)) e.preventDefault();
    input.device = 'kb';
    if (e.repeat) return;
    const acts = keyToActions[e.code];
    if (!acts) return;
    for (const a of acts) { input._kb[a] = (input._kb[a] || 0) + 1; input._recompute(a); }
    G.emit('key', e.code);
  });
  window.addEventListener('keyup', (e) => {
    const acts = keyToActions[e.code];
    if (!acts) return;
    for (const a of acts) { input._kb[a] = Math.max(0, (input._kb[a] || 0) - 1); input._recompute(a); }
  });
  window.addEventListener('blur', () => input.clearAll());
  G.bindMouse = function (el) {
    el.addEventListener('mousedown', (e) => {
      const a = e.button === 0 ? 'attack1' : e.button === 2 ? 'attack2' : null;
      if (!a) return;
      input.device = 'kb';
      input._mouse[a] = true; input._recompute(a);
    });
    window.addEventListener('mouseup', (e) => {
      const a = e.button === 0 ? 'attack1' : e.button === 2 ? 'attack2' : null;
      if (!a) return;
      input._mouse[a] = false; input._recompute(a);
    });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  };

  // ---------------------------------------------------------------- camera
  class Camera {
    constructor() {
      this.x = 0; this.y = 0; this.w = G.W; this.h = G.H;
      this.shakeT = 0; this.shakeMag = 0; this.kx = 0; this.ky = 0;
      this.look = 0; this.zoomPunch = 0;
    }
    snap(tx, ty, level) { this.x = tx - this.w / 2; this.y = ty - this.h * 0.58; this.clamp(level); }
    follow(target, level, dt) {
      this.look = G.lerp(this.look, target.facing * 38 + target.vx * 0.12, Math.min(1, dt * 2.2));
      const tx = target.x + target.w / 2 + this.look - this.w / 2;
      const ty = target.y + target.h / 2 - this.h * 0.56;
      this.x = G.lerp(this.x, tx, Math.min(1, dt * 7));
      const fy = target.vy > 250 ? 10 : 5;
      this.y = G.lerp(this.y, ty, Math.min(1, dt * fy));
      this.clamp(level);
      if (this.shakeT > 0) this.shakeT -= dt; else this.shakeMag = 0;
      this.kx *= Math.pow(0.0005, dt); this.ky *= Math.pow(0.0005, dt);
    }
    clamp(level) {
      if (!level) return;
      this.x = G.clamp(this.x, 0, Math.max(0, level.pw - this.w));
      this.y = G.clamp(this.y, 0, Math.max(0, level.ph - this.h));
    }
    shake(mag, time = 0.2) {
      if (G.settings && G.settings.shake === false) return;
      this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, time);
    }
    kick(dx, dy) { this.kx += dx; this.ky += dy; }
    // pick this frame's shake offset once (called at the start of each world draw)
    beginFrame() {
      this.sx = this.shakeT > 0 ? (Math.random() * 2 - 1) * this.shakeMag : 0;
      this.sy = this.shakeT > 0 ? (Math.random() * 2 - 1) * this.shakeMag : 0;
    }
    // integer draw offset (world -> screen = world - ox), stable within a frame
    get ox() { return Math.round(this.x + this.kx + (this.sx || 0)); }
    get oy() { return Math.round(this.y + this.ky + (this.sy || 0)); }
    visible(x, y, w, h, pad = 32) {
      return x + w > this.x - pad && x < this.x + this.w + pad && y + h > this.y - pad && y < this.y + this.h + pad;
    }
  }
  G.Camera = Camera;

  // ---------------------------------------------------------------- persistence
  G.store = {
    get(key, def) {
      try { const v = localStorage.getItem('deadcircuits.' + key); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
    },
    set(key, val) {
      try { localStorage.setItem('deadcircuits.' + key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ }
    },
  };
  G.settings = Object.assign({ shake: true, music: 0.6, sfx: 0.8, scanlines: true }, G.store.get('settings', {}));
  G.saveSettings = () => G.store.set('settings', G.settings);

  // URL debug flags: ?play&biome=slums&seed=123&god&weapon=katana
  G.params = new URLSearchParams(location.search);
  G.debug = { god: G.params.has('god'), fps: G.params.has('fps') };
})();

</script>
<script>/* js/audio.js */
'use strict';
// DEAD CIRCUITS — audio. Everything is synthesized at runtime with the Web Audio API (no assets):
// one-shot SFX voices (limited, rate-limited, pitch-randomized) and a lookahead-scheduled
// procedural synthwave / darksynth sequencer whose layers follow a combat "intensity".
// Every public call is a silent no-op when Web Audio is missing, blocked or broken.
//
// Graph:  SFX voices ─┬─> sfxBus ─> sfxVol ─────────────┐
//                     └─> sfxVerb ─┘                     ├─> master ─> compressor ─> safety limiter ─> out
//         music tracks ─> musicBus ─> musicVol ─> duck ──┘
//         (each track: layers pad/bass/arp/lead/beat/perc ─> crossfade gain; sends ─> delay / musicVerb)
(function () {
  const G = (window.G = window.G || {});
  const AC = window.AudioContext || window.webkitAudioContext;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;

  const MAX_VOICES = 24;   // simultaneous SFX voices
  const LOOKAHEAD = 0.15;  // s of music scheduled ahead of currentTime
  const TICK_MS = 25;      // scheduler period
  const XFADE = 1.5;       // music crossfade (s)
  const MAKEUP_TRIM = 0.898; // 1 / DynamicsCompressor makeup gain for the settings below (measured)
  const LAYERS = ['pad', 'bass', 'arp', 'lead', 'beat', 'perc'];

  // ---------------------------------------------------------------- helpers
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const hash = (s) => {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  function makeRng(seed) { // mulberry32 (self-contained: audio must not depend on load order)
    let s = seed >>> 0 || 0x9e3779b9;
    const r = () => {
      let t = (s = (s + 0x6d2b79f5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;

  // pattern strings: x = accent, o = normal, g = ghost, anything else = rest
  const hit = (pat, st) => { const c = pat[st % pat.length]; return c === 'x' ? 1 : c === 'o' ? 0.6 : c === 'g' ? 0.3 : 0; };
  const quiet = (p) => { if (p && typeof p.catch === 'function') p.catch(() => {}); };

  // ---------------------------------------------------------------- shared tables (context-free)
  function mkCurve(fn, n = 4096) {
    const c = new Float32Array(n);
    for (let i = 0; i < n; i++) c[i] = fn((i / (n - 1)) * 2 - 1);
    return c;
  }
  const CURVES = {
    soft: mkCurve((x) => Math.tanh(x * 2) / Math.tanh(2)),
    hard: mkCurve((x) => Math.tanh(x * 7) / Math.tanh(7)),
    crush: mkCurve((x) => Math.round(x * 5) / 5),

  function makeImpulse(ac, dur, decay) {
    const sr = ac.sampleRate, n = Math.floor(sr * dur), pre = Math.floor(sr * 0.012), b = ac.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {

  }

  // ================================================================ SFX
  class Voice {
    constructor(e, name, cfg, t, vol, pitch, pan) {
      const ac = e.ac;
      this.e = e; this.ac = ac; this.name = name; this.pri = cfg.pri; this.t = t; this.p = pitch; this.vol = vol;

        if (o.lin) p.linearRampToValueAtTime(this.hz(o.f2), tt); else p.exponentialRampToValueAtTime(this.hz(o.f2), tt);

      fl.Q.value = q == null ? 1 : q;
      this.sweep(fl.frequency, this.t + (o.t || 0), f, o, 0.2);

    o(w, f, d, g, o = {}) {

      const osc = this.n(ac.createOscillator());
      osc.type = w;
      this.sweep(osc.frequency, t, f, o, a + hold + d);
      if (o.det) osc.detune.value = o.det;
      const eg = this.n(ac.createGain());
      const end = this.env(eg.gain, t, a, g, d, hold);
      if (o.vib) {
        const l = this.n(ac.createOscillator()), lg = this.n(ac.createGain());
        l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1] * this.p;
        l.connect(lg); lg.connect(osc.frequency);
        this.run(l, t, end + 0.02);

      osc.connect(eg);
      let dest = o.to || this.out;
      if (o.flt) dest = this.flt(o.flt[0], o.flt[1], o.flt[2], { to: dest, t: o.t, f2: o.flt[3], gd: o.flt[4] });
      eg.connect(dest);
      this.run(osc, t, end + 0.02);
      return osc;
    }
    // filtered noise burst. o: {t,a,hold,q,f2,gd,pts,to,rate}
    nz(d, g, type, f, o = {}) {
      const ac = this.ac, t = this.t + (o.t || 0), a = o.a == null ? 0.001 : o.a, hold = o.hold || 0;
      const s = this.n(ac.createBufferSource());
      s.buffer = this.e.noise; s.loop = true;
      if (o.rate) s.playbackRate.value = o.rate;
      const fl = this.n(ac.createBiquadFilter());
      fl.type = type;
      fl.Q.value = o.q == null ? (type === 'bandpass' ? 1 : 0.7) : o.q;
      this.sweep(fl.frequency, t, f, o, a + hold + d);
      const eg = this.n(ac.createGain());
      const end = this.env(eg.gain, t, a, g, d, hold);
      s.connect(fl); fl.connect(eg); eg.connect(o.to || this.out);
      this.run(s, t, end + 0.02, Math.random() * (this.e.noise.duration - 0.2));
      return fl;
    }
    // 2-operator FM. idx = modulation index (deviation = idx * modulator freq). o: {t,a,hold,idx2,w,mw,f2,gd,pts,to}
    fm(f, ratio, idx, d, g, o = {}) {

      const car = this.n(ac.createOscillator()), mod = this.n(ac.createOscillator()), mg = this.n(ac.createGain());

      mg.gain.setValueAtTime(dev, t);
      if (o.idx2 != null) mg.gain.linearRampToValueAtTime(this.hz(o.f2 || f) * ratio * o.idx2, t + dur);
      mod.connect(mg); mg.connect(car.frequency);
      const eg = this.n(ac.createGain());
      const end = this.env(eg.gain, t, a, g, d, hold);
      car.connect(eg); eg.connect(o.to || this.out);

    }

    sh(curve, drive = 1, post = 0.3, to) {
      const ws = this.n(this.ac.createWaveShaper());
      ws.curve = CURVES[curve];
      ws.connect(this.gn(post, to));
      const ig = this.n(this.ac.createGain());
      ig.gain.value = drive; ig.connect(ws);
      return ig;
    }
    // amplitude modulation stage (square = stutter/glitch); returns its input
    trem(rate, depth, d, to, w = 'square', rate2) {
      const ac = this.ac, t = this.t, g = this.gn(1 - depth / 2, to);
      const l = this.n(ac.createOscillator()), lg = this.n(ac.createGain());

      l.frequency.setValueAtTime(rate, t);
      if (rate2) l.frequency.linearRampToValueAtTime(rate2, t + d);
      lg.gain.value = depth / 2;
      l.connect(lg); lg.connect(g.gain);
      this.run(l, t, t + d + 0.05);

    }

    echo(time, fb, wet, to) {
      const ac = this.ac, inp = this.gn(1, to);

      dl.delayTime.value = time; fg.gain.value = fb;
      inp.connect(dl); dl.connect(fg); fg.connect(dl);
      dl.connect(this.gn(wet, to));
      this.tail = Math.max(this.tail, time * Math.ceil(Math.log(0.01) / Math.log(clamp(fb, 0.05, 0.9))));
      return inp;
    }
    verb(amount) { const g = this.n(this.ac.createGain()); g.gain.value = amount; this.out.connect(g); g.connect(this.e.sfxVerb); }
    stop(fade = 0.05) { try { this.kill(this.e.now(), fade); } catch (err) { /* ignore */ } }
    kill(t, fade = 0.02) {
      if (this.dead) return;
      this.dead = true;
      const g = this.out.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(this.vol, t);
      g.linearRampToValueAtTime(0, t + fade);
      for (const s of this.srcs) { try { s.stop(t + fade + 0.01); } catch (err) { /* already stopped */ } }
      this.end = Math.min(this.end, t + fade + 0.02);
      this.tail = 0;
    }
    dispose() {
      for (const x of this.nodes) { try { x.disconnect(); } catch (err) { /* ignore */ } }
      this.nodes.length = 0; this.srcs.length = 0;
    }
  }

        if (ctx && ctx.state !== 'running' && ctx.state !== 'closed') { autoSusp = false; quiet(ctx.resume()); }
      } catch (err) { /* ignore */ }
      return A.ready;
    },
    // One-shot SFX. Returns a handle with stop(fade) (useful for 'charge'), or null.
    play(name, opts) {
      if (!eng) return null;
      try { return eng.play(name, opts || {}); } catch (err) { eng.fault(err); return null; }
    },
    // Music track by name, or null to stop. Crossfades; same track = no-op.
    music(track) {
      if (track === undefined) track = null;
      if (track !== null && !TRACKS[track]) return;
      pend.track = track;
      if (!eng) return;
      try { eng.music(track); } catch (err) { eng.fault(err); }
    },
    setVolumes(v) {
      if (!v) return;
      const cur = pend.vol || settingsVol();
      pend.vol = { music: v.music != null ? clamp(num(v.music, cur.music), 0, 1) : cur.music, sfx: v.sfx != null ? clamp(num(v.sfx, cur.sfx), 0, 1) : cur.sfx };
      if (eng) { try { eng.setVolumes(pend.vol.music, pend.vol.sfx, 0.03); } catch (err) { eng.fault(err); } }
    },
    // Lower the music by `amount` (0..1) for `time` seconds, then recover.
    duck(amount, time) {
      if (!eng) return;
      try { eng.duck(amount, time); } catch (err) { eng.fault(err); }
    },
    // 0..1 combat intensity; may be called every frame (applied smoothly, max 10x/s).
    intensity(x) {
      pend.int = clamp(num(x, 0), 0, 1);
      if (eng) eng.int = pend.int;
    },
    get ready() { return !!(ctx && eng && ctx.state === 'running'); },
    get current() { return pend.track === undefined ? null : pend.track; },
    names: Object.keys(SFX),
    tracks: Object.keys(TRACKS),
    stats() { return eng ? eng.stats() : null; },
    get context() { return ctx; },
    _engine() { return eng; },
    // Test helper: render music and/or SFX into an AudioBuffer with an OfflineAudioContext.
    // o: {seconds, sampleRate, track, seed, intensity, music, sfx (volumes 0..1), fade,
    //     limiter (false = compressor output without the safety limiter, 'raw' = master bus), plays: [[name, time, opts]],
    //     musicAt: [[time, track]], intensityAt: [[time, x]], duckAt: [[time, amount, secs]]}
    renderOffline(o) {
      o = o || {};
      if (!OAC) return Promise.resolve(null);
      try {
        const sr = o.sampleRate || 44100, sec = o.seconds || 4;
        const ac = new OAC(2, Math.ceil(sr * sec), sr), e = new Engine(ac, true);
        e.vnow = 0;
        if (o.limiter === false || o.limiter === 'raw') e.bypass(o.limiter === 'raw' ? 'raw' : 'comp');
        e.setVolumes(o.music != null ? o.music : 1, o.sfx != null ? o.sfx : 1, 0);
        e.setIntensity(o.intensity != null ? o.intensity : 0.5, true);
        const ev = [];
        if (o.track) ev.push([0, 'music', o.track]);
        for (const m of o.musicAt || []) ev.push([m[0], 'music', m[1]]);
        for (const p of o.plays || []) ev.push([p[1] || 0, 'play', p[0], p[2]]);
        for (const x of o.intensityAt || []) ev.push([x[0], 'int', x[1]]);
        for (const x of o.duckAt || []) ev.push([x[0], 'duck', x[1], x[2]]);
        ev.sort((a, b) => a[0] - b[0]);
        let ei = 0;
        for (let t = 0; t <= sec; t += 0.025) {
          while (ei < ev.length && ev[ei][0] <= t + 1e-9) {
            const x = ev[ei++];
            e.vnow = x[0];
            if (x[1] === 'music') e.music(x[2], o.seed != null ? o.seed : 1, o.fade != null ? o.fade : x[0] > 0);
            else if (x[1] === 'play') e.play(x[2], x[3] || {});
            else if (x[1] === 'int') e.setIntensity(x[2], false);
            else if (x[1] === 'duck') e.duck(x[2], x[3]);
          }
          e.vnow = t;
          e.update(t);
        }
        e.vnow = null;
        const pr = ac.startRendering();
        const stats = e.stats();
        return pr.then((buf) => { buf.engineStats = stats; return buf; });
      } catch (err) { return Promise.reject(err); }
    },
  };
  G.audio = A;

  // Safety net: resume/create on any user gesture even if the game forgets to call init().
  if (typeof window !== 'undefined' && window.addEventListener) {
    const onGesture = () => { if (!ctx || ctx.state !== 'running') A.init(); };
    for (const ev of ['pointerdown', 'mousedown', 'keydown', 'touchend']) window.addEventListener(ev, onGesture, { capture: true, passive: true });
  }
})();

<script>/* js/fx.js */
'use strict';
// Particles, floating damage numbers, shockwave rings, flashes and wall decals (coolant splats).
(function () {
  const G = window.G;
  const MAX_PARTS = 1400;

  class FX {
    constructor(level) {
      this.parts = [];
      this.texts = [];
      this.rings = [];
      this.slashes = [];
      this.flashT = 0; this.flashColor = '#ffffff';
      this.level = level;
      this.decals = null;
      if (level) {
        // decal layer covering the level (coolant/oil splats on back walls), 1/2 resolution to save memory
        this.decalScale = 2;
        this.decals = document.createElement('canvas');
        this.decals.width = Math.ceil(level.pw / this.decalScale);
        this.decals.height = Math.ceil(level.ph / this.decalScale);
        this.dctx = this.decals.getContext('2d');
      }
    }

    // p: {x,y,vx,vy,life,color,size,grav,drag,glow,shape:'px'|'line'|'disc'|'spark',bounce,decal,additive,shrink}
    particle(p) {
      if (this.parts.length >= MAX_PARTS) this.parts.shift();
      p.t = 0; p.life = p.life || 0.5; p.size = p.size || 1;
      p.vx = p.vx || 0; p.vy = p.vy || 0; p.grav = p.grav || 0; p.drag = p.drag == null ? 0 : p.drag;
      p.life0 = p.life;
      this.parts.push(p);
      return p;
    }
    // radial burst
    burst(x, y, n, o = {}) {
      const R = G.rand;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + R.float(-(o.spread || Math.PI), o.spread || Math.PI) : R.float(0, Math.PI * 2);
        const sp = R.float(o.speedMin || 30, o.speed || 160);
        this.particle({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
          life: R.float((o.life || 0.5) * 0.5, o.life || 0.5), color: Array.isArray(o.color) ? R.pick(o.color) : (o.color || G.PAL.white),
          size: o.size ? (Array.isArray(o.size) ? R.int(o.size[0], o.size[1]) : o.size) : 1,
          grav: o.grav == null ? 500 : o.grav, drag: o.drag == null ? 1.5 : o.drag,
          glow: o.glow || 0, shape: o.shape || 'px', bounce: o.bounce, decal: o.decal, additive: o.additive,
        });
      }
    }
    sparks(x, y, dir, n = 8, color = G.PAL.yellow) {
      this.burst(x, y, n, { angle: dir > 0 ? 0 : Math.PI, spread: 0.9, speed: 260, speedMin: 80, life: 0.3, color: [color, G.PAL.white], shape: 'spark', grav: 300, glow: 10, additive: true });
    }
    // coolant / oil splatter that paints decals when hitting walls
    splat(x, y, dir, n = 10, colors = ['#1fd6ff', '#0b7fa8', '#6b1c3a']) {
      this.burst(x, y, n, { angle: dir > 0 ? -0.4 : Math.PI + 0.4, spread: 1.1, speed: 220, speedMin: 40, life: 0.8, color: colors, size: [1, 2], grav: 600, drag: 0.5, decal: true });
    }
    // x,y world; value; color; crit => bigger
    number(x, y, value, color = G.PAL.white, crit = false) {
      this.texts.push({ x: x + G.rand.float(-4, 4), y, vy: -70, t: 0, life: crit ? 0.9 : 0.7, text: String(value), color, scale: crit ? 2 : 1 });
      if (this.texts.length > 60) this.texts.shift();
    }
    label(x, y, text, color = G.PAL.white, life = 1.2) {
      this.texts.push({ x, y, vy: -30, t: 0, life, text: String(text), color, scale: 1 });
    }
    ring(x, y, r0, r1, color = G.PAL.cyan, life = 0.35, thick = 2) {
      this.rings.push({ x, y, r0, r1, color, life, t: 0, thick });
    }
    // arc slash trail (drawn additive): angles in radians, dir facing
    slash(x, y, radius, a0, a1, color = G.PAL.cyan, life = 0.14, width = 5) {
      this.slashes.push({ x, y, radius, a0, a1, color, life, t: 0, width });
    }
    flash(color = '#ffffff', t = 0.08) { this.flashT = Math.max(this.flashT, t); this.flashColor = color; }
    decal(x, y, r, color) {
      if (!this.dctx || !this.level) return;
      // only paint where there's a back wall (not inside solid rock)
      if (this.level.solidAt(x, y)) return;
      const s = this.decalScale;
      this.dctx.fillStyle = color;
      this.dctx.globalAlpha = 0.85;
      G.px.disc(this.dctx, x / s, y / s, Math.max(0, r / s), color);
      this.dctx.globalAlpha = 1;
    }

    update(dt) {
      const L = this.level;
      const parts = this.parts;
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.t += dt;
        if (p.t >= p.life) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
        p.vy += p.grav * dt;
        if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
        const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
        if (L && (p.bounce || p.decal) && L.solidAt(nx, ny)) {
          if (p.decal) {
            this.decal(p.x, p.y, G.rand.int(1, 3), p.color);
            parts[i] = parts[parts.length - 1]; parts.pop(); continue;
          }
          if (L.solidAt(nx, p.y)) p.vx *= -p.bounce; else p.vy *= -p.bounce;
          p.vx *= 0.8;
        } else { p.x = nx; p.y = ny; }
      }
      for (let i = this.texts.length - 1; i >= 0; i--) {
        const t = this.texts[i];
        t.t += dt; t.y += t.vy * dt; t.vy *= Math.pow(0.02, dt);
        if (t.t >= t.life) this.texts.splice(i, 1);
      }
      for (let i = this.rings.length - 1; i >= 0; i--) { const r = this.rings[i]; r.t += dt; if (r.t >= r.life) this.rings.splice(i, 1); }
      for (let i = this.slashes.length - 1; i >= 0; i--) { const s = this.slashes[i]; s.t += dt; if (s.t >= s.life) this.slashes.splice(i, 1); }
      if (this.flashT > 0) this.flashT -= dt;
    }

    drawDecals(ctx, cam) {
      if (!this.decals) return;
      const s = this.decalScale;
      const sx = Math.max(0, Math.floor(cam.ox / s)), sy = Math.max(0, Math.floor(cam.oy / s));
      const sw = Math.min(this.decals.width - sx, Math.ceil(G.W / s) + 2), sh = Math.min(this.decals.height - sy, Math.ceil(G.H / s) + 2);
      if (sw <= 0 || sh <= 0) return;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(this.decals, sx, sy, sw, sh, sx * s - cam.ox, sy * s - cam.oy, sw * s, sh * s);
      ctx.globalAlpha = 1;
    }

    // normal-blend particles
    draw(ctx, cam) {
      const ox = cam.ox, oy = cam.oy;
      for (const p of this.parts) {
        if (p.additive) continue;
        this.drawPart(ctx, p, ox, oy);
      }
    }
    drawPart(ctx, p, ox, oy) {
      const k = 1 - p.t / p.life;
      const x = p.x - ox, y = p.y - oy;
      if (x < -20 || y < -20 || x > G.W + 20 || y > G.H + 20) return;
      ctx.globalAlpha = p.fade === false ? 1 : Math.min(1, k * 1.6);
      if (p.shape === 'spark' || p.shape === 'line') {
        const len = p.shape === 'spark' ? 0.03 : 0.05;
        G.px.line(ctx, x, y, x - p.vx * len, y - p.vy * len, p.color, 1);
      } else if (p.shape === 'disc') {
        G.px.disc(ctx, x, y, p.size * (p.shrink ? k : 1), p.color);
      } else {
        const s = Math.max(1, Math.round(p.size * (p.shrink ? k : 1)));
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
      }
      ctx.globalAlpha = 1;
    }
    drawTexts(ctx, cam) {
      for (const t of this.texts) {
        const k = t.t / t.life;
        ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
        const pop = t.scale > 1 && t.t < 0.08 ? 1 : 0;
        G.font.draw(ctx, t.text, t.x - cam.ox, t.y - cam.oy - pop, t.color, t.scale, 'center');
      }
      ctx.globalAlpha = 1;
    }
    // additive pass (called with 'lighter')
    drawAdditive(ctx, cam) {
      const ox = cam.ox, oy = cam.oy;
      for (const p of this.parts) {
        if (p.additive) this.drawPart(ctx, p, ox, oy);
        if (p.glow) G.drawGlow(ctx, p.x - ox, p.y - oy, p.glow, p.color.length === 7 ? p.color : '#ffffff', 0.5 * (1 - p.t / p.life));
      }
      for (const r of this.rings) {
        const k = r.t / r.life;
        ctx.globalAlpha = 1 - k;
        G.px.ring(ctx, r.x - ox, r.y - oy, G.lerp(r.r0, r.r1, G.easeOut(k)), r.color, r.thick);
        ctx.globalAlpha = 1;
      }
      for (const s of this.slashes) {
        const k = s.t / s.life;
        const cx = s.x - ox, cy = s.y - oy;
        const steps = Math.max(6, Math.ceil(Math.abs(s.a1 - s.a0) * s.radius / 2));
        const w = Math.max(1, Math.round(s.width * (1 - k)));
        ctx.globalAlpha = 1 - k * 0.6;
        ctx.fillStyle = s.color;
        for (let i = 0; i <= steps; i++) {
          const f = i / steps;
          const a = G.lerp(s.a0, s.a1, f);
          const ww = Math.max(1, Math.round(w * Math.sin(f * Math.PI)));
          for (let j = 0; j < ww; j++) {
            const rr = s.radius - j;
            ctx.fillRect(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr), 1, 1);
          }
        }
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i <= steps; i++) {
          const a = G.lerp(s.a0, s.a1, i / steps);
          ctx.fillRect(Math.round(cx + Math.cos(a) * s.radius), Math.round(cy + Math.sin(a) * s.radius), 1, 1);
        }
        ctx.globalAlpha = 1;
      }
    }
  }
  G.FX = FX;
})();
